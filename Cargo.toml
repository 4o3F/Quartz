[workspace]
members = [
    "crates/quartz",
    "crates/quartz-host",
    "crates/quartz-domain",
    "crates/quartz-protocol",
    "crates/quartz-i18n",
    "crates/quartz-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4o3F/Quartz"
version = "0.0.0"
publish = false

[workspace.dependencies]
clap = { version = "4.6.8", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
quartz-i18n = { path = "crates/quartz-i18n" }
rust-i18n = { version = "4.2.4", default-features = false }
snafu = { version = "0.9.2", default-features = false, features = ["std", "rust_1_81"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Console"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
# M0 实测体积和性能后，在 "s" 与 3 之间决定。
opt-level = 3

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
