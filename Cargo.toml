[workspace]
members = [
    "crates/quartz",
    "crates/quartz-host",
    "crates/quartz-domain",
    "crates/quartz-protocol",
    "crates/quartz-i18n",
    "crates/quartz-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4o3F/Quartz"
version = "0.0.0"
publish = false

[workspace.dependencies]
arc-swap = "1.9.5"
anyhow = "1"
diesel = { version = "2.4.0", default-features = false, features = ["std", "sqlite", "returning_clauses_for_sqlite_3_35", "32-column-tables"] }
diesel_migrations = { version = "2.4.0", default-features = false, features = ["sqlite"] }
# Declared only to enable bundled SQLite; keep this version within Diesel's allowed
# libsqlite3-sys range so Cargo unifies it with Diesel's dependency.
libsqlite3-sys = { version = "0.40.0", default-features = false, features = ["bundled"] }
jiff = { version = "1.0.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
clap = { version = "4.6.8", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
gpui-kit = { version = "=0.10.0", default-features = false, features = ["component", "assets"] }
icu_casemap = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
idna = { version = "1.1.0", default-features = false, features = ["alloc", "compiled_data"] }
quartz-domain = { path = "crates/quartz-domain" }
regex = "1.13.1"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
quartz-protocol = { path = "crates/quartz-protocol" }
quartz-i18n = { path = "crates/quartz-i18n" }
quartz-ui = { path = "crates/quartz-ui" }
rust-i18n = { version = "4.2.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
snafu = { version = "0.9.2", default-features = false, features = ["std", "rust_1_81"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Console"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
# M0 实测体积和性能后，在 "s" 与 3 之间决定。
opt-level = 3

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
