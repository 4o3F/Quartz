format = "quartz-rules/1"

[set]
key = "builtin.extraction"
kind = "extraction"
name = "Builtin document extraction"

# Synthetic zh-CN/en fixtures cover these formats; live application verification is pending.
# All patterns use absolute anchors and the parser's existing bounded regex compiler.
[[rule]]
id = "vscode-project"
label_key = "extraction.label.vscode"
detector = "builtin.vscode_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'code.exe' }]
pattern = '\A(?P<dirty>● )?(?P<document>[^\r\n]+?) - (?P<project>[^\r\n]+?)(?: \((?:Workspace|工作区)\))?(?: \[(?:WSL|SSH|Remote|Dev Container): [^\]\r\n]+\])? - Visual Studio Code(?: \[(?:WSL|SSH|Remote|Dev Container): [^\]\r\n]+\])?(?: - (?:WSL|SSH|Remote): [^\r\n]+)?\z'

# A workspace title without an active editor supplies only a project.
[[rule]]
id = "vscode-workspace"
label_key = "extraction.label.vscode"
detector = "builtin.vscode_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'code.exe' }]
pattern = '\A(?P<project>[^\r\n]+?) \((?:Workspace|工作区)\)(?: \[(?:WSL|SSH|Remote|Dev Container): [^\]\r\n]+\])? - Visual Studio Code(?: \[(?:WSL|SSH|Remote|Dev Container): [^\]\r\n]+\])?(?: - (?:WSL|SSH|Remote): [^\r\n]+)?\z'

[[rule]]
id = "vscode-document"
label_key = "extraction.label.vscode"
detector = "builtin.vscode_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'code.exe' }]
pattern = '\A(?P<dirty>● )?(?P<document>[^\r\n]+?)(?: \[(?:WSL|SSH|Remote|Dev Container): [^\]\r\n]+\])? - Visual Studio Code(?: \[(?:WSL|SSH|Remote|Dev Container): [^\]\r\n]+\])?(?: - (?:WSL|SSH|Remote): [^\r\n]+)?\z'

[[rule]]
id = "jetbrains-idea"
label_key = "extraction.label.jetbrains"
detector = "builtin.jetbrains_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "regex", value = '(?i)\Aidea(?:64)?\.exe\z' }]
pattern = '\A(?P<project>[^\r\n–—]+?) [–—-] (?P<document>[^\r\n–—]+?)(?: [–—-] IntelliJ IDEA)?\z'

