# Only recognized trailing mode annotations are removed; other brackets remain part of the name.
[[rule]]
id = "office-word"
label_key = "extraction.label.office"
detector = "builtin.office_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'winword.exe' }]
pattern = '\A(?P<document>[^\r\n]+?)(?: \[(?:Compatibility Mode|Read-Only|Read Only|兼容模式|只读)\]| \((?:Compatibility Mode|Read-Only|Read Only|兼容模式|只读)\)| （(?:兼容模式|只读)）){0,3} - (?:Microsoft )?Word\z'

[[rule]]
id = "office-excel"
label_key = "extraction.label.office"
detector = "builtin.office_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'excel.exe' }]
pattern = '\A(?P<document>[^\r\n]+?)(?: \[(?:Compatibility Mode|Read-Only|Read Only|兼容模式|只读)\]| \((?:Compatibility Mode|Read-Only|Read Only|兼容模式|只读)\)| （(?:兼容模式|只读)）){0,3} - (?:Microsoft )?Excel\z'

[[rule]]
id = "office-powerpoint"
label_key = "extraction.label.office"
detector = "builtin.office_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'powerpnt.exe' }]
pattern = '\A(?P<document>[^\r\n]+?)(?: \[(?:Compatibility Mode|Read-Only|Read Only|兼容模式|只读)\]| \((?:Compatibility Mode|Read-Only|Read Only|兼容模式|只读)\)| （(?:兼容模式|只读)）){0,3} - (?:Microsoft )?PowerPoint\z'

# Require the browser brand before the final profile suffix; page-title separators alone are ambiguous.
[[rule]]
id = "browser-chrome-profile"
label_key = "extraction.label.browser_profile"
detector = "builtin.browser_profile_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'chrome.exe' }]
pattern = '\A(?P<document>[^\r\n]+) - Google Chrome - (?P<profile>\S(?:[^\r\n]*\S)?)\z'

[[rule]]
id = "browser-edge-profile"
label_key = "extraction.label.browser_profile"
detector = "builtin.browser_profile_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'msedge.exe' }]
pattern = '\A(?P<document>[^\r\n]+) - Microsoft Edge - (?P<profile>\S(?:[^\r\n]*\S)?)\z'

[[rule]]
id = "browser-firefox-profile"
label_key = "extraction.label.browser_profile"
detector = "builtin.browser_profile_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'firefox.exe' }]
pattern = '\A(?P<document>[^\r\n]+) [-–—] (?:Mozilla )?Firefox - (?P<profile>\S(?:[^\r\n]*\S)?)\z'

# An editor command naming a file supplies a document; shell and task labels do not.
[[rule]]
id = "windows-terminal-document"
label_key = "extraction.label.terminal_document"
detector = "builtin.terminal_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'windowsterminal.exe' }]
pattern = '\A(?:n?vim|nano|emacs) (?P<document>[^\r\n]+\.[A-Za-z0-9]{1,16})(?: - Windows Terminal)?\z'

# A match without named captures keeps the tab title and prevents generic fallback from inventing a document.
[[rule]]
id = "windows-terminal-tab"
label_key = "extraction.label.terminal_tab"
detector = "builtin.terminal_title"
languages = ["zh-CN", "en"]
verified = false
app = [{ field = "app.exe_name", op = "equals", value = 'windowsterminal.exe' }]
pattern = '\A(?s:.*)\z'

