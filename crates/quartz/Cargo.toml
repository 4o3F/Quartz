[package]
name = "quartz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "quartz"
path = "src/main.rs"

[dependencies]
crossbeam-channel.workspace = true
num_enum.workspace = true
strum.workspace = true
diesel.workspace = true
diesel_migrations.workspace = true
libsqlite3-sys.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
clap.workspace = true
quartz-protocol = { workspace = true, features = ["codec"] }
quartz-domain.workspace = true
serde_json.workspace = true
serde.workspace = true
snafu.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
quartz-i18n.workspace = true
quartz-ui.workspace = true
windows = { workspace = true, features = [
    "std",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Accessibility",
    "Win32_System_StationsAndDesktops",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[dev-dependencies]
quartz-i18n.workspace = true
quartz-domain = { workspace = true, features = ["test-support"] }
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
