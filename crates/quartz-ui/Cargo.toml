[package]
name = "quartz-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
quartz-pipe.workspace = true
tokio.workspace = true
anyhow.workspace = true
gpui-kit.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform"] }
num-traits.workspace = true
quartz-i18n.workspace = true
quartz-protocol.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tracing.workspace = true
# WinRT observes appearance, transparency and energy saver; Win32 supplies system colors,
# high contrast and DWM backdrop support (11 sections 2 and 3.2).
windows = { workspace = true, features = ["Foundation", "UI_ViewManagement", "System_Power", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_Controls", "Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[features]
# Mock data and the off-screen preview window, for screenshots and tests; never in release builds.
preview = []

# The view models, text and timeline geometry have no GPUI dependency; they are tested on every
# platform but only used by the Windows views, so other platforms need them for tests alone.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
quartz-pipe = { workspace = true, features = ["test-util"] }
strum.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform"] }
num-traits.workspace = true
quartz-i18n.workspace = true
quartz-protocol.workspace = true
snafu.workspace = true
tracing.workspace = true
# Tests and the preview example build against the mock data.
quartz-ui = { workspace = true, features = ["preview"] }

# The workspace lints, plus casts and indexing checks for this crate's float-heavy layout code.
# A package cannot extend `[workspace.lints]`, so this table repeats it; keep the two in sync.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"
as_conversions = "warn"
cast_precision_loss = "warn"
indexing_slicing = "warn"
