<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Quartz — Annotations &amp; Timeline Selection</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<!--
  Annotations, Pan/Select timeline mode, range selection & batch annotation (M4 V6: H13 / H14).
  Query parameters:
    ?state=mode-pan | select-dragging | select-range | select-multi | select-dst |
           annotate-dialog | pending-other | annotation-list | annotation-edit
    &theme=light | dark
    &lang=zh-CN | en | en-XA
    &size=min          (optional: 640x480 minimum window per 07 §2.3; default 1280x800)
-->
<style>
/* Minimum window 640x480 (Compact breakpoint per 07 §2.1 & §2.3) */
html[data-size="min"],
html[data-size="min"] body,
html[data-size="min"] .window{width:640px;height:480px}

.wrap{position:relative;overflow:hidden}
.main-wrap{position:relative;flex:1;min-width:0;display:flex}
.main{position:relative;padding:var(--space-xl) var(--space-xxl) var(--space-l);gap:var(--space-s);overflow-y:auto;overflow-x:hidden}
html[data-has-panel="true"] .main{padding:var(--space-l) var(--space-l) var(--space-l)}
html[data-size="min"] .main{padding:var(--space-m) var(--space-m) var(--space-l)}

/* 07 §10: chart plot areas sit directly on bg.base in both light and dark */
.plot{background:var(--bg-base);border-radius:var(--radius-control)}

/* Fluent 2 overlay scrollbar indicator (11 §9.2) */
.scroll-track{
  display:none;
  position:absolute;top:var(--space-xs);right:var(--space-xs);bottom:var(--space-xs);
  width:6px;pointer-events:none;z-index:8;
}
.scrollable > .scroll-track{display:block}
.scroll-thumb{
  position:absolute;left:1px;right:1px;top:0;
  border-radius:var(--radius-control);
  background:var(--text-tertiary);
}

/* Nav & flexible text controls safe for en-XA */
.nav-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:3px}
.badge .btxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{max-width:100%;min-width:0}
.btn{min-height:var(--h-control-standard);height:auto;padding:4px 12px;max-width:100%}
.btn.compact{min-height:var(--h-control-compact);height:auto;padding:2px 9px;font:var(--type-caption)}
.btn.icon{width:var(--h-control-standard);height:var(--h-control-standard);padding:0;flex:none}
.btn.compact.icon{width:var(--h-control-compact);height:var(--h-control-compact);padding:0;flex:none}
.btn.danger-solid{
  background:var(--status-critical);border-color:var(--status-critical);
  color:var(--text-on-accent);box-shadow:var(--shadow-2);
}
.btn.danger-active{
  background:var(--status-critical-bg);
  border-color:color-mix(in srgb,var(--status-critical) 55%,transparent);
  color:var(--status-critical);
}

/* Today layout responsiveness */
.datebar{flex-wrap:wrap;height:auto;min-height:var(--h-control-standard)}
.datebar .date{min-width:186px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.stat{padding:0 10px;border-left:1px solid var(--stroke-divider);min-width:0}
.stat:first-child{padding-left:0;border-left:none}
.stat .v,.stat .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{flex-wrap:wrap;gap:var(--space-xs) var(--space-l)}

html[data-has-panel="true"] .stats{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:var(--space-s)}
html[data-has-panel="true"] .stat:nth-child(3n+1){padding-left:0;border-left:none}
html[data-has-panel="true"] .tl{--gut:98px}
html[data-has-panel="true"] .two-col{flex-direction:column}

html[data-size="min"] .datebar .date{min-width:154px}
html[data-size="min"] .stats{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:var(--space-s)}
html[data-size="min"] .stat:nth-child(3n+1){padding-left:0;border-left:none}
html[data-size="min"] .two-col{flex-direction:column}
html[data-size="min"] .tl{--gut:84px}
html[data-size="min"] .legend{gap:var(--space-xs) var(--space-m)}

/* Timeline toolbar + Pan/Select segmented control */
.tl-head{display:flex;align-items:center;gap:6px;row-gap:6px;flex-wrap:wrap}
.tl-head-l{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;flex-wrap:wrap}
.tl-head-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%}
.tl-head .h-sub{white-space:nowrap}

.seg.mode-seg{position:relative;gap:2px}
.seg.mode-seg div{gap:5px;padding:0 9px;white-space:nowrap}
.seg.mode-seg div svg{width:13px;height:13px;flex:none}
.seg.mode-seg.kb-focus{
  outline:2px solid var(--stroke-focus-outer);
  outline-offset:2px;
  box-shadow:0 0 0 1px var(--stroke-focus-inner);
}

/* Keyboard focus tooltip (mode-pan) */
.kb-tip{
  position:absolute;
  top:calc(100% + 7px);left:0;
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-control);
  box-shadow:var(--shadow-16);
  padding:5px 9px;
  font:var(--type-caption);color:var(--text-secondary);
  white-space:nowrap;z-index:25;
  display:inline-flex;align-items:center;gap:6px;
}
.kb-tip .kbd{
  display:inline-flex;align-items:center;height:16px;padding:0 4px;
  border-radius:3px;border:1px solid var(--stroke-control-strong);
  background:var(--fill-card-secondary);
  font-family:var(--font-mono);font-size:10.5px;line-height:14px;
  color:var(--text-primary);
}

/* DST clock-change marker */
.dst-marker{
  position:absolute;top:-2px;bottom:0;width:2px;
  background:repeating-linear-gradient(180deg,var(--status-caution) 0 4px,transparent 4px 7px);
  z-index:4;pointer-events:none;
}
.dst-pill{
  position:absolute;top:-19px;transform:translateX(-50%);
  height:16px;padding:0 5px;border-radius:var(--radius-control);
  background:var(--status-caution-bg);color:var(--status-caution);
  border:1px solid color-mix(in srgb,var(--status-caution) 28%,transparent);
  font:var(--type-caption);font-size:10.5px;line-height:14px;
  white-space:nowrap;display:inline-flex;align-items:center;gap:3px;
}

/* Range selection overlay & draggable endpoint handles */
.sel-layer{
  position:absolute;left:var(--gut);right:0;top:0;height:152px;
  pointer-events:none;z-index:5;
}
.range-band{
  position:absolute;top:-2px;bottom:-2px;
  background:color-mix(in srgb,var(--accent-fill) 18%,transparent);
  border-left:2px solid var(--accent-fill);
  border-right:2px solid var(--accent-fill);
}
.range-band.secondary{
  background:color-mix(in srgb,var(--accent-fill) 11%,transparent);
  border-left:1.5px solid color-mix(in srgb,var(--accent-fill) 72%,transparent);
  border-right:1.5px solid color-mix(in srgb,var(--accent-fill) 72%,transparent);
}
.range-band.dragging{
  background:color-mix(in srgb,var(--accent-fill) 22%,transparent);
  border-right-style:dashed;
}

.ep-handle{
  position:absolute;top:50%;transform:translateY(-50%);
  width:10px;height:28px;border-radius:5px;
  background:var(--bg-flyout);
  border:2px solid var(--accent-fill);
  box-shadow:var(--shadow-8);
  display:flex;align-items:center;justify-content:center;gap:1.5px;
}
.ep-handle::before,.ep-handle::after{
  content:"";width:1px;height:10px;border-radius:1px;background:var(--accent-fill);
}
.ep-handle.left{left:-6px}
.ep-handle.right{right:-6px}
.ep-handle.active{
  background:var(--accent-fill);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-fill) 25%,transparent),var(--shadow-8);
}
.ep-handle.active::before,.ep-handle.active::after{background:var(--text-on-accent)}

.ep-tag{
  position:absolute;top:-19px;
  height:16px;padding:0 5px;border-radius:var(--radius-control);
  background:var(--accent-fill);color:var(--text-on-accent);
  font-family:var(--font-mono);font-size:10.5px;line-height:14px;font-weight:600;
  white-space:nowrap;display:inline-flex;align-items:center;
  box-shadow:var(--shadow-2);
}
.ep-tag.left{left:-2px;transform:translateX(-30%)}
.ep-tag.right{right:-2px;transform:translateX(30%)}
.range-band.dst-band .ep-tag.left{left:-5px;transform:translateX(-100%)}
.range-band.dst-band .ep-tag.right{right:-5px;transform:translateX(100%)}

.range-num{
  position:absolute;top:-20px;left:50%;transform:translateX(-50%);
  min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--accent-fill);color:var(--text-on-accent);
  font:var(--type-caption);font-size:11px;line-height:16px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-2);
}
.range-band.secondary .range-num{
  background:var(--bg-flyout);color:var(--accent-text);
  border:1.5px solid var(--accent-fill);
}

/* Live drag tooltip inside plot */
.drag-tt{
  position:absolute;top:14px;
  width:236px;max-width:calc(100% - 16px);
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-16);
  padding:8px 10px;
  z-index:20;
  display:flex;flex-direction:column;gap:3px;
}
.drag-tt-time{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  font:var(--type-body-strong);color:var(--text-primary);
}
.drag-tt-sub{font:var(--type-caption);color:var(--text-secondary);overflow-wrap:anywhere}
.drag-tt-hint{font:var(--type-caption);color:var(--text-tertiary);overflow-wrap:anywhere}

.drag-cursor{
  position:absolute;right:-11px;top:66%;
  width:20px;height:20px;color:var(--text-primary);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));
}

/* Docked Selection Summary Card (below timeline plot) */
.sel-panel{
  margin-top:8px;
  padding:10px 12px;
  border-radius:var(--radius-overlay);
  background:var(--fill-card-secondary);
  border:1px solid color-mix(in srgb,var(--accent-fill) 32%,var(--stroke-card));
  display:flex;flex-direction:column;gap:8px;
}
.sel-top{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;row-gap:6px;flex-wrap:wrap;
}
.sel-endpoints{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;
}
.sel-actions{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto;
}
.time-in{
  display:inline-flex;align-items:center;gap:5px;
  height:26px;padding:0 7px;
  background:var(--fill-control);
  border:1px solid var(--stroke-control);
  border-bottom-color:var(--stroke-control-strong);
  border-radius:var(--radius-control);
  font-family:var(--font-mono);font-size:12px;line-height:16px;
  color:var(--text-primary);white-space:nowrap;
}
.time-in.focused{
  border-color:var(--stroke-control);
  border-bottom:2px solid var(--accent-fill);
  outline:2px solid var(--stroke-focus-outer);
  outline-offset:1px;
}
.time-in svg{width:13px;height:13px;color:var(--text-secondary);flex:none}
.utc-pill{
  display:inline-flex;align-items:center;gap:2px;
  height:20px;padding:0 5px;border-radius:3px;
  background:var(--status-caution-bg);color:var(--status-caution);
  font-family:var(--font-mono);font-size:11px;line-height:14px;font-weight:600;
  white-space:nowrap;
}
.utc-pill svg{width:11px;height:11px;color:var(--status-caution)}

.sel-summary-grid{
  display:grid;
  grid-template-columns:minmax(180px,1fr) minmax(200px,1.25fr) minmax(200px,1.25fr);
  gap:8px;
}
html[data-size="min"] .sel-summary-grid{grid-template-columns:1fr}
.sel-box{
  padding:7px 9px;
  border-radius:var(--radius-control);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:4px;min-width:0;
}
.sel-box-lbl{font:var(--type-caption);color:var(--text-secondary);overflow-wrap:anywhere}
.sel-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.split-bar{
  display:flex;height:6px;gap:1px;border-radius:3px;overflow:hidden;
  background:var(--fill-subtle-hover);margin-top:2px;
}
.split-bar .act{background:var(--accent-fill)}
.split-bar .idl{
  background:repeating-linear-gradient(45deg,transparent 0 2px,var(--stroke-control-strong) 2px 3px),
             color-mix(in srgb,var(--status-neutral) 35%,transparent);
}

/* Multi-range list (select-multi) */
.multi-list{display:flex;flex-direction:column;gap:5px}
.multi-row{
  position:relative;
  padding:6px 8px;
  border-radius:var(--radius-control);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.multi-row.active-range{
  border-color:color-mix(in srgb,var(--accent-fill) 48%,transparent);
  background:color-mix(in srgb,var(--accent-fill) 5%,var(--fill-card));
}
.m-num{
  width:20px;height:20px;border-radius:50%;flex:none;
  background:var(--accent-fill);color:var(--text-on-accent);
  font:var(--type-caption);font-weight:600;
  display:grid;place-items:center;
}
.multi-row:not(.active-range) .m-num{
  background:var(--fill-subtle-hover);color:var(--text-primary);
  border:1px solid var(--stroke-control-strong);
}
.m-time{font-family:var(--font-mono);font-size:12px;line-height:16px;font-weight:600;color:var(--text-primary);white-space:nowrap}
.m-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:160px}
.m-rm-wrap{position:relative;margin-left:auto;flex:none}
.m-rm-btn.hov{
  background:var(--status-critical-bg);
  border-color:color-mix(in srgb,var(--status-critical) 40%,transparent);
  color:var(--status-critical);
}
.rm-tip{
  position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);
  background:var(--bg-flyout);border:1px solid var(--stroke-surface);
  border-radius:var(--radius-control);box-shadow:var(--shadow-16);
  padding:3px 8px;font:var(--type-caption);color:var(--text-primary);
  white-space:nowrap;z-index:20;
}

/* Pending-away bar highlight (pending-other) */
.pending{display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.pending.highlight-card{
  border-color:color-mix(in srgb,var(--accent-fill) 45%,transparent);
  background:color-mix(in srgb,var(--accent-fill) 6%,var(--fill-card));
}
.pending .btn.other-active{
  background:var(--accent-fill);border-color:var(--accent-fill);color:var(--text-on-accent);
}

/* InfoBar */
.infobar{
  flex:none;padding:7px 10px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;align-items:flex-start;gap:var(--space-s);
  font:var(--type-caption);color:var(--text-secondary);
  overflow-wrap:anywhere;word-break:break-word;
}
.infobar .ib-ic{flex:none;margin-top:1px;color:var(--text-secondary)}
.infobar .ib-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.infobar .ib-title{font:var(--type-body-strong);font-size:13px;line-height:18px;color:var(--text-primary);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.infobar.caution{
  background:var(--status-caution-bg);
  border-color:color-mix(in srgb,var(--status-caution) 30%,transparent);
  color:var(--text-primary);
}
.infobar.caution .ib-ic{color:var(--status-caution)}
.infobar.critical{
  background:var(--status-critical-bg);
  border-color:color-mix(in srgb,var(--status-critical) 34%,transparent);
  color:var(--text-primary);
}
.infobar.critical .ib-ic{color:var(--status-critical)}
.infobar.accent-info{
  background:color-mix(in srgb,var(--accent-fill) 8%,var(--fill-card));
  border-color:color-mix(in srgb,var(--accent-fill) 30%,transparent);
  color:var(--text-primary);
}
.infobar.accent-info .ib-ic{color:var(--accent-text)}

/* ===========================
   Modal Dialog (annotate-dialog, pending-other)
   =========================== */
.modal-scrim{
  position:absolute;inset:0;
  background:var(--fill-smoke);
  z-index:40;
  display:flex;align-items:center;justify-content:center;
  padding:var(--space-l);
}
html[data-size="min"] .modal-scrim{padding:var(--space-s)}
.modal-dlg{
  width:576px;max-width:100%;max-height:100%;
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-64);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.modal-head{
  flex:none;padding:12px var(--space-xl);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:center;gap:var(--space-s);
}
.modal-head-txt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-body-wrap{position:relative;flex:1;min-height:0;display:flex}
.modal-body{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:12px var(--space-xl);
  display:flex;flex-direction:column;gap:10px;
}
.modal-foot{
  flex:none;padding:10px var(--space-xl);
  border-top:1px solid var(--stroke-divider);
  background:var(--fill-card-secondary);
  display:flex;align-items:center;flex-wrap:nowrap;gap:var(--space-s);
}
.modal-foot-l{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden}
.modal-foot-r{flex:0 0 auto;display:flex;align-items:center;gap:var(--space-s);margin-left:auto}
.modal-foot-r .btn{min-width:0;max-width:210px}
.modal-foot-r .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

html[data-size="min"] .modal-head{padding:9px 14px}
html[data-size="min"] .modal-body{padding:10px 14px;gap:8px}
html[data-size="min"] .modal-foot{padding:8px 14px}
html[data-size="min"] .modal-foot-l{display:none}
html[data-size="min"] .modal-foot-r{width:100%;justify-content:flex-end}

/* Form controls inside dialog & edit sidebar */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > label{
  font:var(--type-caption);color:var(--text-secondary);
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
}
.input{min-width:0}
.input.focused{border-color:var(--stroke-control);border-bottom:2px solid var(--accent-fill)}
.textarea{
  min-height:54px;padding:6px 9px;
  background:var(--fill-control);
  border:1px solid var(--stroke-control);
  border-bottom-color:var(--stroke-control-strong);
  border-radius:var(--radius-control);
  font:var(--type-body);color:var(--text-primary);
  overflow-wrap:anywhere;word-break:break-word;
}
.field-hint{font:var(--type-caption);color:var(--text-tertiary);overflow-wrap:anywhere}
.caret{
  display:inline-block;width:1.5px;height:14px;
  background:var(--accent-fill);vertical-align:text-bottom;margin-left:1px;
}

/* Kind segmented bar */
.full-seg{width:100%;display:flex;height:auto;min-height:28px;padding:2px;gap:2px}
.full-seg div{
  flex:1 1 0;min-width:0;padding:2px 6px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  text-align:center;overflow:hidden;
}
.full-seg div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Active-only category picker tray (no archived) */
.cat-tray{
  padding:6px;
  border-radius:var(--radius-control);
  background:var(--bg-base);
  border:1px solid var(--stroke-control);
  display:flex;flex-wrap:wrap;gap:5px;
}
.cat-opt{
  display:inline-flex;align-items:center;gap:6px;
  height:26px;padding:0 9px;
  border-radius:var(--radius-control);
  background:var(--fill-control);
  border:1px solid var(--stroke-control);
  font:var(--type-caption);color:var(--text-primary);
  max-width:100%;
}
.cat-opt .sw-dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.cat-opt.sel{
  border-color:var(--accent-fill);
  background:color-mix(in srgb,var(--accent-fill) 12%,var(--fill-card));
  font-weight:600;
}
.cat-opt .chk{width:12px;height:12px;color:var(--accent-text);flex:none}

/* Target ranges strip inside dialog */
.ranges-strip{
  padding:7px 9px;
  border-radius:var(--radius-control);
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:5px;
}
.ranges-pills{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.r-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 7px;min-height:22px;max-width:100%;
  border-radius:var(--radius-control);
  background:var(--fill-card);border:1px solid var(--stroke-control);
  font-family:var(--font-mono);font-size:11.5px;line-height:15px;color:var(--text-primary);
}
.r-pill .rn{
  width:15px;height:15px;border-radius:50%;flex:none;
  background:var(--accent-fill);color:var(--text-on-accent);
  font-family:var(--font-small);font-size:10px;font-weight:600;
  display:grid;place-items:center;
}

/* Effect preview box ("这些时间将计为…") */
.effect-box{
  padding:8px 10px;
  border-radius:var(--radius-overlay);
  background:color-mix(in srgb,var(--accent-fill) 7%,var(--fill-card-secondary));
  border:1px solid color-mix(in srgb,var(--accent-fill) 28%,var(--stroke-card));
  display:flex;flex-direction:column;gap:4px;
}
.effect-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.effect-desc{font:var(--type-caption);color:var(--text-secondary);overflow-wrap:anywhere}

/* ===========================
   Right-hand 360px Panel (annotation-list, annotation-edit)
   =========================== */
.panel-scrim{
  display:none;
  position:absolute;inset:0;
  background:color-mix(in srgb,var(--fill-smoke) 42%,transparent);
  z-index:15;
}
.details{
  width:var(--w-details);flex:none;
  border-left:1px solid var(--stroke-divider);
  padding:0;gap:0;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:transparent;
}
html[data-size="min"][data-panel-open="true"] .panel-scrim{display:block}
html[data-size="min"] .details{
  position:absolute;top:0;right:0;bottom:0;
  width:360px;max-width:calc(100% - 16px);
  background:linear-gradient(var(--fill-layer),var(--fill-layer)),var(--bg-base);
  border-left:1px solid var(--stroke-divider);
  box-shadow:var(--shadow-28);
  z-index:20;
}

.ed-head{
  flex:none;padding:10px var(--space-l);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:flex-start;gap:var(--space-s);
}
.ed-head-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ed-head-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.ed-body-wrap{position:relative;flex:1;min-height:0;display:flex}
.ed-body{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:8px var(--space-l);
  display:flex;flex-direction:column;gap:7px;
}

/* Strictly single-row pinned panel footer */
.ed-foot{
  flex:none;padding:8px var(--space-l);
  border-top:1px solid var(--stroke-divider);
  display:flex;align-items:center;flex-wrap:nowrap;gap:6px;
}
.ed-foot-main{
  flex:1;min-width:0;display:flex;align-items:center;flex-wrap:nowrap;gap:6px;
}
.ed-foot-main .btn{padding:4px 9px;min-width:0;max-width:100%;overflow:hidden}
.ed-foot-main .btn.primary-slot{flex:0 1 auto}
.ed-foot-main .btn:not(.primary-slot){flex:0 0 auto}
.ed-foot-main .btn.flex-shrink{flex:0 1 auto}
.ed-foot-main .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-foot-right{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:6px}

/* Saved annotation cards (annotation-list) */
.res-card{
  padding:7px 10px;
  border-radius:var(--radius-overlay);
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:4px;
}
.anno-list{display:flex;flex-direction:column;gap:6px}
.anno-card{
  padding:7px 9px;
  border-radius:var(--radius-overlay);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:4px;
}
.anno-card.dismissed{
  background:var(--fill-card-secondary);
  border-style:dashed;
  border-color:var(--stroke-control-strong);
}
.anno-card-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.anno-range{font-family:var(--font-mono);font-size:11.5px;line-height:15px;color:var(--text-primary);font-weight:600;white-space:nowrap}
.anno-val{font:var(--type-body);font-size:13px;line-height:18px;color:var(--text-primary);overflow-wrap:anywhere;word-break:break-word}
.anno-note{font:var(--type-caption);color:var(--text-secondary);overflow-wrap:anywhere;word-break:break-word}
.anno-card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
  padding-top:4px;border-top:1px solid var(--stroke-divider);margin-top:2px;
}
.anno-ts{font:var(--type-caption);font-size:11px;line-height:14px;color:var(--text-tertiary);overflow-wrap:anywhere}
.anno-acts{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto}
.overlap-divider{
  display:flex;align-items:center;gap:6px;
  font:var(--type-caption);font-size:11px;line-height:14px;color:var(--text-tertiary);
}
.overlap-divider::before,.overlap-divider::after{content:"";flex:1;height:1px;background:var(--stroke-divider)}

/* Fixed kind box (annotation-edit) */
.kind-locked{
  padding:7px 9px;
  border-radius:var(--radius-control);
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:3px;
}
.kind-locked-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kind-locked-top svg{width:14px;height:14px;color:var(--text-secondary);flex:none}
.kind-locked-why{font:var(--type-caption);font-size:11.5px;line-height:15px;color:var(--text-secondary);overflow-wrap:anywhere}

/* Delete confirmation flyout anchored beside sidebar footer (annotation-edit) */
.del-flyout{
  position:absolute;
  right:372px;bottom:14px;
  width:324px;max-width:calc(100% - 24px);
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-28);
  padding:12px 14px;
  z-index:36;
  display:flex;flex-direction:column;gap:8px;
}
html[data-size="min"] .del-flyout{right:12px;bottom:56px;width:300px}
.del-flyout-head{display:flex;align-items:flex-start;gap:8px}
.del-flyout-head svg{color:var(--status-critical);flex:none;margin-top:2px}
.del-flyout-acts{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:2px}

/* Ranking subtle refinements */
.rank .nm{width:152px}
.rank .du{width:76px}
html[data-has-panel="true"] .rank .nm{width:136px}
html[data-size="min"] .rank .nm{width:128px}

  return `<span class="chip" style="--c:var(${colorVar})"><i></i><span class="ell">${label}</span></span>`;

function renderNav() {
  const nav = document.getElementById('nav');
  const isRail = isMin || hasPanel;
  if (isRail) nav.classList.add('rail');
  const menuRow = isMin
    ? `<div style="height:4px;flex:none"></div>`
    : `<div class="nav-item" style="margin-top:4px"><svg class="ic"><use href="#menu"/></svg></div>`;
  nav.innerHTML =
    menuRow +
    `<div class="nav-item selected"><i class="ind"></i><svg class="ic"><use href="#today-f"/></svg><span>${T.nav.today}</span></div>` +
    `<div class="nav-item"><i class="ind"></i><svg class="ic"><use href="#week"/></svg><span>${T.nav.week}</span></div>` +
    `<div class="nav-item"><i class="ind"></i><svg class="ic"><use href="#tag"/></svg><span>${T.nav.rules}</span></div>` +

    `<div class="bottom"><div class="nav-item"><i class="ind"></i><svg class="ic"><use href="#gear"/></svg><span>${T.nav.settings}</span></div></div>`;
}

      `<div class="card grow" style="padding:12px 16px;min-width:0">` +
        `<div class="row" style="margin-bottom:4px"><span class="h-sub grow">${r.title}</span><div class="seg">${r.tabs.map((t, i) => `<div${i === 0 ? ' class="on"' : ''}>${t}</div>`).join('')}</div></div>` +
        rankRowsHtml +
      `</div>` +
    `</div>`;

  const p = td.pending;
  const isPendingOther = stateKey === 'pending-other';
  const pendingRowHtml =
    `<div class="card pending${isPendingOther ? ' highlight-card' : ''}" style="flex:none">` +
      `<svg class="ic s16" style="color:var(--text-secondary)"><use href="#clock"/></svg>` +
      `<span class="strong">${p.title}</span>` +
      `<span class="sec cap">${p.range}</span>` +
      `<span class="grow"></span>` +
      `<div class="row gap4" style="flex-wrap:wrap">` +
        `<button class="btn compact">${p.rest}</button>` +
        `<button class="btn compact">${p.meeting}</button>` +
        `<button class="btn compact">${p.reading}</button>` +
        `<button class="btn compact">${p.ignore}</button>` +
        `<button class="btn compact${isPendingOther ? ' other-active' : ''}">${p.other}</button>` +
      `</div>` +
    `</div>`;

  return dateBarHtml + statusCardHtml + timelineCardHtml + bottomRowHtml + pendingRowHtml;
}

/* ===========================
   Annotation Editor Modal (annotate-dialog & pending-other)
   =========================== */
function renderCatPicker(selectedId) {
  return `<div class="cat-tray" role="radiogroup">` +
    ACTIVE_CATS.map(c =>
      `<div class="cat-opt${c.id === selectedId ? ' sel' : ''}">` +
        `<i class="sw-dot" style="--c:var(${c.c})"></i>` +
        `<span class="ell">${c.name}</span>` +
        (c.id === selectedId ? `<svg class="ic s16 chk"><use href="#check"/></svg>` : '') +
      `</div>`
    ).join('') +
  `</div>`;
}

function renderAnnotateModal(isAway) {
  const d = T.dialog;
  const scrim = document.getElementById('modal-scrim');
  scrim.style.display = 'flex';

  const rangesSection = isAway
    ? `<div class="infobar accent-info">` +
        `<svg class="ic s16 ib-ic"><use href="#clock"/></svg>` +
        `<div class="ib-body">` +
          `<div class="ib-title">${d.awaySourceTitle}</div>` +
          `<div>${d.awaySourceSub}</div>` +
        `</div>` +
      `</div>`
    : `<div class="ranges-strip">` +
        `<span class="cap sec">${d.rangesTitle}</span>` +
        `<div class="ranges-pills">` +
          d.ranges.map(rg => `<span class="r-pill"><span class="rn">${rg.num}</span><span>${rg.rangeMono}</span><span class="ter">· ${rg.dur}</span></span>`).join('') +
        `</div>` +
      `</div>`;

  const failBanner = !isAway
    ? `<div class="infobar critical">` +
        `<svg class="ic s16 ib-ic"><use href="#err-circle"/></svg>` +
        `<div class="ib-body">` +
          `<div class="ib-title"><span>${d.failTitle}</span><span class="badge crit mono">${d.failCode}</span></div>` +
          `<div>${d.failDesc}</div>` +
        `</div>` +
      `</div>`
    : '';

  const kinds = isAway ? d.kindsAway : d.kindsBatch;

  scrim.innerHTML =
    `<div class="modal-dlg" role="dialog" aria-modal="true">` +
      `<div class="modal-head">` +
        `<svg class="ic" style="color:var(--accent-text);flex:none"><use href="#edit"/></svg>` +
        `<div class="modal-head-txt">` +
          `<span class="h-sub ell">${isAway ? d.titleAway : d.titleBatch}</span>` +
          `<span class="badge ovr"><span class="btxt">${isAway ? d.badgeAway : d.badgeBatch}</span></span>` +
        `</div>` +
        `<button class="btn subtle icon compact"><svg class="ic s16"><use href="#close"/></svg></button>` +
      `</div>` +
      `<div class="modal-body-wrap" id="modal-body-wrap">` +
        `<div class="modal-body" id="modal-body">` +
          failBanner +
          rangesSection +
          `<div class="field">` +
            `<label><span>${d.kindLabel}</span></label>` +
            `<div class="seg full-seg">` +
              kinds.map(k => `<div class="${k.active ? 'on' : ''}"><span>${k.label}</span></div>`).join('') +
            `</div>` +
            `<div class="field-hint">${isAway ? d.kindHintAway : d.kindHintCat}</div>` +
          `</div>` +
          `<div class="field">` +
            `<label><span>${d.catLabel}</span><span class="cap ter">${d.catArchivedNote}</span></label>` +
            renderCatPicker('learn') +
          `</div>` +
          `<div class="field">` +
            `<label><span>${d.labelField}</span></label>` +
            `<div class="input std focused"><span class="ell">${isAway ? d.awayLabelVal : d.labelVal}</span><span class="caret"></span></div>` +
          `</div>` +
          `<div class="field">` +
            `<label><span>${d.noteField}</span></label>` +
            `<div class="textarea">${isAway ? d.awayNoteVal : d.noteVal}</div>` +
          `</div>` +
          `<div class="effect-box">` +
            `<div class="effect-head">` +
              `<span class="strong cap">${d.effectPrefix}</span>` +
              catChip('--cat-1', T.cats.learn) +
            `</div>` +
            `<div class="effect-desc">${isAway ? d.effectDescAway : d.effectDescBatch}</div>` +
          `</div>` +
        `</div>` +
        `<div class="scroll-track" aria-hidden="true"><div class="scroll-thumb" id="modal-thumb"></div></div>` +
      `</div>` +
      `<div class="modal-foot">` +
        `<div class="modal-foot-l"><span class="cap ter ell">${d.footAtomicNote}</span></div>` +
        `<div class="modal-foot-r">` +
          `<button class="btn"><span>${d.cancelBtn}</span></button>` +
          (isAway
            ? `<button class="btn accent"><span>${d.saveBtn}</span></button>`
            : `<button class="btn accent"><svg class="ic s16"><use href="#refresh"/></svg><span>${d.retryBtn}</span></button>`) +
        `</div>` +
      `</div>` +
    `</div>`;
}

/* ===========================
   Details Sidebar: annotation-list
   =========================== */
function renderAnnotationListPanel() {
  const al = T.annoList;
  const panel = document.getElementById('details');
  panel.style.display = 'flex';

  const cardsHtml = al.items.map((it, idx) => {
    const overlapSep = idx === 1
      ? `<div class="overlap-divider"><span>${al.overlapNote}</span></div>`
      : '';
    if (it.kind === 'dismissed') {
      return overlapSep +
        `<div class="anno-card dismissed">` +
          `<div class="anno-card-top">` +
            `<span class="badge dis"><span class="btxt">${al.kindDismissed}</span></span>` +
            `<span class="anno-range">${it.rangeMono}</span>` +
            `<span class="cap ter">${it.dur}</span>` +
          `</div>` +
          `<div class="anno-note">${it.note}</div>` +
          `<div class="anno-card-foot">` +
            `<span class="anno-ts">${it.ts}</span>` +
            `<div class="anno-acts">` +
              `<button class="btn compact"><svg class="ic s16" style="width:13px;height:13px"><use href="#undo"/></svg><span>${al.undoIgnoreBtn}</span></button>` +
            `</div>` +
          `</div>` +
        `</div>`;
    }
    const kindBadge = it.kind === 'cat'
      ? `<span class="badge ovr"><span class="btxt">${al.kindCat}</span></span>`
      : `<span class="badge"><span class="btxt">${al.kindNote}</span></span>`;
    const overlapBadge = it.overlap
      ? `<span class="badge warn"><span class="btxt">${al.overlapBadge}</span></span>`
      : '';
    return overlapSep +
      `<div class="anno-card">` +
        `<div class="anno-card-top">` +
          kindBadge +
          overlapBadge +
          `<span class="anno-range">${it.rangeMono}</span>` +
          `<span class="cap ter">${it.dur}</span>` +
        `</div>` +
        (it.catName ? `<div class="row gap8" style="flex-wrap:wrap">${catChip(it.catVar, it.catName)}${it.label ? `<span class="strong cap">${it.label}</span>` : ''}</div>` : (it.label ? `<div class="anno-val strong">${it.label}</div>` : '')) +
        `<div class="anno-note">${it.note}</div>` +
        `<div class="anno-card-foot">` +
          `<span class="anno-ts">${it.ts}</span>` +
          `<div class="anno-acts">` +
            `<button class="btn compact subtle"><svg class="ic s16" style="width:13px;height:13px"><use href="#edit"/></svg><span>${al.editBtn}</span></button>` +
            `<button class="btn compact icon subtle danger" title="${al.deleteBtn}" aria-label="${al.deleteBtn}"><svg class="ic s16" style="width:13px;height:13px"><use href="#trash"/></svg></button>` +
          `</div>` +
        `</div>` +
      `</div>`;
  }).join('');

  panel.innerHTML =
    `<div class="ed-head">` +
      `<svg class="ic" style="color:var(--text-secondary);flex:none;margin-top:2px"><use href="#code"/></svg>` +
      `<div class="ed-head-txt">` +
        `<div class="ed-head-title"><span class="strong">${al.title}</span><span class="badge">4</span></div>` +
        `<div class="cap sec ell">${al.subtitle}</div>` +
      `</div>` +
      `<button class="btn compact"><svg class="ic s16" style="width:13px;height:13px"><use href="#add"/></svg><span>${al.addBtn}</span></button>` +
      `<button class="btn subtle icon compact"><svg class="ic s16"><use href="#close"/></svg></button>` +
    `</div>` +
    `<div class="ed-body-wrap" id="ed-body-wrap">` +
      `<div class="ed-body" id="ed-body">` +
        `<div class="res-card">` +
          `<div class="row gap8" style="flex-wrap:wrap">${catChip('--cat-1', T.cats.learn)}<span class="badge ovr"><span class="btxt">${al.sourceBadge}</span></span></div>` +
          `<div class="cap sec">${al.blockSummary}</div>` +
        `</div>` +
        `<div class="anno-list">${cardsHtml}</div>` +
      `</div>` +
      `<div class="scroll-track" aria-hidden="true"><div class="scroll-thumb" id="ed-thumb"></div></div>` +
    `</div>` +
    `<div class="ed-foot">` +
      `<div class="ed-foot-main">` +
        `<button class="btn primary-slot"><svg class="ic s16"><use href="#edit"/></svg><span>${al.footAdd}</span></button>` +
        `<button class="btn flex-shrink"><svg class="ic s16"><use href="#tree"/></svg><span>${al.footExplain}</span></button>` +
      `</div>` +
      `<div class="ed-foot-right">` +
        `<button class="btn icon disabled" title="${al.footDeleteTitle}" aria-label="${al.footDeleteTitle}"><svg class="ic s16"><use href="#trash"/></svg></button>` +
        `<button class="btn icon" title="${al.footMoreTitle}" aria-label="${al.footMoreTitle}"><svg class="ic s16"><use href="#more"/></svg></button>` +
      `</div>` +
    `</div>`;
}

  const al = T.annoList;

  panel.style.display = 'flex';

  panel.innerHTML =
    `<div class="ed-head">` +
      `<button class="btn subtle icon compact" style="flex:none"><svg class="ic s16"><use href="#arrow-l"/></svg></button>` +

      `</div>` +
      `<button class="btn subtle icon compact"><svg class="ic s16"><use href="#close"/></svg></button>` +

            `<div>${ae.clipDesc}</div>` +

        /* Active-only category picker */
        `<div class="field">` +

          renderCatPicker('learn') +

        `<div class="field">` +
          `<label><span>${d.labelField}</span></label>` +
          `<div class="input std"><span class="ell">${d.labelVal}</span></div>` +
        `</div>` +

        `<div class="field">` +
          `<label><span>${d.noteField}</span></label>` +
          `<div class="textarea">${d.noteVal}</div>` +
        `</div>` +

        `<div class="row gap8" style="flex-wrap:wrap;justify-content:space-between">` +
          `<span class="cap ter">${ae.metaTs}</span>` +
          `<span class="mono ter">${ae.uuidShort}</span>` +
        `</div>` +
      `</div>` +
      `<div class="scroll-track" aria-hidden="true"><div class="scroll-thumb" id="ed-thumb"></div></div>` +
    `</div>` +
    `<div class="ed-foot">` +
      `<div class="ed-foot-main">` +
        `<button class="btn accent primary-slot"><span>${ae.saveBtn}</span></button>` +
        `<button class="btn"><span>${ae.cancelBtn}</span></button>` +
      `</div>` +
      `<div class="ed-foot-right">` +
        `<button class="btn danger-active"><svg class="ic s16"><use href="#trash"/></svg><span>${ae.deleteBtn}</span></button>` +
      `</div>` +
    `</div>`;

  /* Anchored delete confirmation flyout beside the sidebar footer */
  document.getElementById('overlay-layer').innerHTML =
    `<div class="del-flyout" role="alertdialog" aria-modal="true">` +
      `<div class="del-flyout-head">` +
        `<svg class="ic"><use href="#warn"/></svg>` +
        `<div class="grow" style="min-width:0;display:flex;flex-direction:column;gap:3px">` +
          `<span class="strong">${ae.delConfirmTitle}</span>` +
          `<span class="cap sec" style="overflow-wrap:anywhere">${ae.delConfirmDesc}</span>` +
        `</div>` +
      `</div>` +
      `<div class="del-flyout-acts">` +
        `<button class="btn compact"><span>${ae.cancelBtn}</span></button>` +
        `<button class="btn compact danger-solid"><span>${ae.delConfirmBtn}</span></button>` +
      `</div>` +
    `</div>`;
}

function renderMain() {
  const main = document.getElementById('main');
  main.innerHTML = renderTodayPage();
  if (stateKey === 'annotate-dialog') renderAnnotateModal(false);
  else if (stateKey === 'pending-other') renderAnnotateModal(true);
  else if (stateKey === 'annotation-list') renderAnnotationListPanel();
  else if (stateKey === 'annotation-edit') renderAnnotationEditPanel();
}

function syncScroll(scrollEl, wrapEl, thumbEl) {
  if (!scrollEl || !wrapEl || !thumbEl) return;
  const overflow = scrollEl.scrollHeight > scrollEl.clientHeight + 1;
  wrapEl.classList.toggle('scrollable', overflow);
  if (!overflow) return;
  const trackH = wrapEl.clientHeight - 8;
  const ratio = scrollEl.clientHeight / scrollEl.scrollHeight;
  const thumbH = Math.max(28, Math.round(trackH * ratio));
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const top = maxScroll > 0 ? Math.round((scrollEl.scrollTop / maxScroll) * (trackH - thumbH)) : 0;
  thumbEl.style.height = thumbH + 'px';
  thumbEl.style.top = top + 'px';
}

renderNav();
renderMain();

const mainEl = document.getElementById('main');
const mainWrapEl = document.getElementById('main-wrap');
const mainThumbEl = document.getElementById('main-thumb');
if (stateKey === 'pending-other' && mainEl.scrollHeight > mainEl.clientHeight) {
  mainEl.scrollTop = mainEl.scrollHeight;
} else if (isMin && stateKey === 'select-range') {
  const tlCard = document.getElementById('timeline-card');
  if (tlCard) mainEl.scrollTop = Math.max(0, tlCard.offsetTop - 8);
}
syncScroll(mainEl, mainWrapEl, mainThumbEl);
mainEl.addEventListener('scroll', () => syncScroll(mainEl, mainWrapEl, mainThumbEl));

const edBody = document.getElementById('ed-body');
const edBodyWrap = document.getElementById('ed-body-wrap');
const edThumb = document.getElementById('ed-thumb');
if (edBody) {
  syncScroll(edBody, edBodyWrap, edThumb);
  edBody.addEventListener('scroll', () => syncScroll(edBody, edBodyWrap, edThumb));
}

const modalBody = document.getElementById('modal-body');
const modalBodyWrap = document.getElementById('modal-body-wrap');
const modalThumb = document.getElementById('modal-thumb');
if (modalBody) {
  syncScroll(modalBody, modalBodyWrap, modalThumb);
  modalBody.addEventListener('scroll', () => syncScroll(modalBody, modalBodyWrap, modalThumb));
}
</script>
