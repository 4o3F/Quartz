<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Quartz — Rules page live states (M4 V1)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<!--
  Rules page live states mockup for Quartz (M4 V1: H1 / H3 / H4 / H5).
  Query parameters:
    ?state=loading | empty | load-error | new-set |
           reorder-entries | reorder-effective |
           editor | editor-cat-picker | editor-preview-stale |
           saving | stale-version | validation-error
    &theme=light | dark
    &lang=zh-CN | en | en-XA
    &size=min          (optional: 640x480 minimum window per 07 §2.3; default 1280x800)
-->
<style>
/* Minimum window 640x480 (Compact breakpoint per 07 §2.1 & §2.3) */
html[data-size="min"],
html[data-size="min"] body,
html[data-size="min"] .window{width:640px;height:480px}

.wrap{position:relative;overflow:hidden}
.main-wrap{position:relative;flex:1;min-width:0;display:flex}
.main{position:relative;padding:var(--space-xxl) var(--space-xxl) var(--space-l);gap:var(--space-s);overflow-y:auto;overflow-x:hidden}
html[data-has-panel="true"] .main{padding:var(--space-xl) var(--space-l) var(--space-l)}
html[data-size="min"] .main{padding:var(--space-l) var(--space-l) var(--space-l)}

/* Fluent 2 overlay scrollbar indicator (11 §9.2) */
.scroll-track{
  display:none;
  position:absolute;top:var(--space-xs);right:var(--space-xs);bottom:var(--space-xs);
  width:6px;pointer-events:none;z-index:8;
}
.scrollable > .scroll-track{display:block}
.scroll-thumb{
  position:absolute;left:1px;right:1px;top:0;
  border-radius:var(--radius-control);
  background:var(--text-tertiary);
}

/* Page header & pivot — content-driven wrapping for en-XA and 640x480 */
.page-head{
  flex:none;
  display:flex;align-items:center;flex-wrap:wrap;
  gap:var(--space-s);
  min-height:40px;
}
.page-head .h-title{flex:1;min-width:140px}
.page-head-acts{display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}

.pivot{
  height:auto;min-height:32px;
  gap:var(--space-l);row-gap:var(--space-xs);
  flex-wrap:wrap;
}
.pivot div{height:32px;white-space:nowrap}
html[data-size="min"] .pivot{gap:var(--space-m);row-gap:0}

/* Workspace split: rule-set tree + entries/effective list */
.rules-grid{
  flex:1;min-height:0;
  display:flex;align-items:stretch;gap:var(--space-s);
  margin-top:var(--space-xs);
}
.tree-card{
  width:256px;flex:none;
  padding:var(--space-m);
  display:flex;flex-direction:column;gap:var(--space-xs);
  align-self:flex-start;
  max-height:100%;overflow:hidden;
}
html[data-has-panel="true"] .tree-card{width:236px}
.list-card{
  flex:1;min-width:0;
  padding:var(--space-m) var(--space-m) var(--space-s);
  display:flex;flex-direction:column;gap:var(--space-xs);
  align-self:flex-start;
  max-height:100%;overflow:hidden;
}

/* Compact 640x480 stacks tree above list so zero horizontal scroll ever occurs */
html[data-size="min"] .rules-grid{
  flex-direction:column;
  flex:none;
}
html[data-size="min"] .tree-card,
html[data-size="min"] .list-card{
  width:100%;max-height:none;
}

/* Nav text stays single-line with ellipsis in en-XA */
.nav-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Tree node refinements */
.tree-head{display:flex;align-items:center;gap:var(--space-s);padding:0 var(--space-xs) var(--space-xs)}
.tnode{min-height:48px;padding:6px 8px;gap:6px}
.tnode.ind1{margin-left:14px}
.tnode.ind2{margin-left:28px}
.tnode.disabled-ui{opacity:.6}
.tnode .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px;min-width:0;max-width:100%}
.tnode .sw{flex:none}
.tnode .grip{color:var(--text-tertiary);flex:none;display:flex;align-items:center}
.tnode .lock-ic{width:12px;height:12px;color:var(--text-tertiary);flex:none}

/* Reorder visual cues in tree & table */
.drop-line{
  position:relative;height:2px;margin:2px 8px;
  background:var(--accent-fill);border-radius:1px;
}
.drop-line::before,.drop-line::after{
  content:"";position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--accent-fill);
}
.drop-line::before{left:-4px}
.drop-line::after{right:-4px}
.drop-line.ind1{margin-left:22px}

.tnode.dragging{
  background:var(--bg-flyout);
  border:1px solid var(--accent-fill);
  box-shadow:var(--shadow-8);
}
.tnode.no-drop{
  border:1px dashed var(--stroke-control-strong);
  background:var(--fill-card-secondary);
}
.tnode.no-drop .no-drop-tag{
  display:inline-flex;align-items:center;gap:4px;
  font:var(--type-caption);color:var(--text-tertiary);
}

/* Tree empty footer callout */
.tree-empty-note{
  margin-top:var(--space-s);
  padding:var(--space-m);
  border-radius:var(--radius-control);
  border:1px dashed var(--stroke-control-strong);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:var(--space-s);
}

/* List toolbar: wraps gracefully in en-XA and narrow widths */
.list-toolbar{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:var(--space-s);
  padding:0 var(--space-xs) var(--space-xs);
}
.list-toolbar .seg{flex:none}
.list-toolbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}
.list-meta{
  display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-s);
  padding:0 var(--space-xs) var(--space-xs);
  font:var(--type-caption);color:var(--text-secondary);
}
.list-meta .link{color:var(--accent-text);margin-left:auto;white-space:nowrap}

/* Rules table: content-driven columns with zero clipping */
.rtbl-h,.rtbl-r{
  display:flex;align-items:center;gap:var(--space-s);
  min-height:var(--h-row-compact);
  padding:4px var(--space-s);
  border-radius:var(--radius-control);
}
.rtbl-h{
  font:var(--type-caption);color:var(--text-secondary);
  border-bottom:1px solid var(--stroke-divider);
  border-radius:0;
}
.rtbl-r.sel{background:var(--fill-subtle-hover)}
.rtbl-r.dim{color:var(--text-secondary)}
.rtbl-r.dim .lbl{text-decoration:line-through}
.rtbl-r.dragging{
  background:var(--bg-flyout);
  border:1px solid var(--accent-fill);
  box-shadow:var(--shadow-8);
}
.rtbl-r.prio-zone{
  background:color-mix(in srgb,var(--accent-fill) 6%,transparent);
}
.rtbl-r.drop-blocked{
  opacity:.62;
  background:var(--fill-card-secondary);
  border:1px dashed var(--stroke-control-strong);
}
.rtbl-grip{width:16px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary)}
.rtbl-name{flex:1;min-width:96px;display:flex;align-items:center;gap:6px;overflow:hidden}
.rtbl-name .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtbl-cat{flex:0 0 auto;min-width:74px;max-width:124px}
.rtbl-cat .chip{max-width:100%}
.rtbl-cat .chip span{overflow:hidden;text-overflow:ellipsis}
.rtbl-prio{flex:0 0 auto;min-width:44px;text-align:right;white-space:nowrap;font:var(--type-caption);color:var(--text-secondary)}
.rtbl-prio.sorted{color:var(--text-primary);font-weight:600}
.rtbl-src{flex:0 0 192px;min-width:0;display:flex;align-items:center;gap:6px;font:var(--type-caption);color:var(--text-secondary)}
.rtbl-diff{flex:0 0 auto;min-width:60px;display:flex;justify-content:flex-end}

html[data-has-panel="true"] .rtbl-src{flex:0 0 132px}
html[data-size="min"] .rtbl-src{flex:0 0 124px}
html[data-size="min"] .rtbl-cat{min-width:64px;max-width:96px}

.group-sep{
  display:flex;align-items:center;gap:6px;
  padding:6px var(--space-s) 2px;
  font:var(--type-caption);color:var(--text-secondary);
}
.prio-group-hdr{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-s);
  padding:4px var(--space-s);margin-top:4px;
  border-radius:var(--radius-control);
  background:var(--fill-card-secondary);
  font:var(--type-caption);color:var(--text-secondary);
}
.prio-group-hdr.active{
  background:color-mix(in srgb,var(--accent-fill) 10%,transparent);
  color:var(--accent-text);
}

/* Inline banners (InfoBars) */
.infobar{
  flex:none;
  padding:6px var(--space-m);
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;align-items:flex-start;gap:var(--space-s);
  font:var(--type-caption);color:var(--text-secondary);
  overflow-wrap:anywhere;word-break:break-word;
}
.infobar .ib-ic{flex:none;margin-top:1px;color:var(--text-secondary)}
.infobar .ib-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.infobar .ib-title{font:var(--type-body-strong);color:var(--text-primary);font-size:13px;line-height:18px;overflow-wrap:anywhere}
.infobar .ib-acts{display:flex;align-items:center;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-xs)}
.infobar.caution{
  background:var(--status-caution-bg);
  border-color:color-mix(in srgb,var(--status-caution) 28%,transparent);
  color:var(--text-primary);
}
.infobar.caution .ib-ic{color:var(--status-caution)}
.infobar.critical{
  background:var(--status-critical-bg);
  border-color:color-mix(in srgb,var(--status-critical) 28%,transparent);
  color:var(--text-primary);
}
.infobar.critical .ib-ic{color:var(--status-critical)}

/* Lightweight inline load error card (visibly distinct from full-window errors.html) */
.load-err-card{
  flex:none;margin-top:var(--space-xs);
  padding:var(--space-l) var(--space-xl);
  display:flex;align-items:flex-start;gap:var(--space-m);
}
.load-err-ic{color:var(--status-caution);margin-top:1px;flex:none}
.load-err-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-xs);overflow-wrap:anywhere}
.load-err-title{font:var(--type-body-strong);color:var(--text-primary);overflow-wrap:anywhere}
.load-err-msg{font:var(--type-body);color:var(--text-secondary);overflow-wrap:anywhere}
.load-err-code{font:var(--type-caption);font-family:var(--font-mono);color:var(--text-tertiary);margin-top:2px;overflow-wrap:anywhere}
.load-err-act{flex:none;align-self:center;margin-left:var(--space-m)}
html[data-size="min"] .load-err-card{flex-wrap:wrap;padding:var(--space-l)}
html[data-size="min"] .load-err-act{margin-left:calc(20px + var(--space-m));margin-top:var(--space-xs);align-self:flex-start}

/* Static skeleton primitives (zero looping animation per 07 §9 & 11 §1) */
.skel{
  display:inline-block;border-radius:var(--radius-control);
  background:color-mix(in srgb,var(--text-tertiary) 18%,transparent);
}
.skel.soft{background:var(--fill-subtle-hover)}
.seg.dim{opacity:.55}

/* Right-hand panel (360px): side-by-side on Expanded (1280x800), overlay on Compact (640x480) per 07 §2.2 */
.panel-scrim{
  display:none;
  position:absolute;inset:0;
  background:color-mix(in srgb,var(--fill-smoke) 42%,transparent);
  z-index:15;
}
.details{
  width:var(--w-details);flex:none;
  border-left:1px solid var(--stroke-divider);
  padding:0;gap:0;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:transparent;
}
html[data-size="min"][data-panel-open="true"] .panel-scrim{display:block}
html[data-size="min"] .details{
  position:absolute;top:0;right:0;bottom:0;
  width:360px;max-width:calc(100% - 16px);
  background:linear-gradient(var(--fill-layer),var(--fill-layer)),var(--bg-base);
  border-left:1px solid var(--stroke-divider);
  box-shadow:var(--shadow-28);
  z-index:20;
}

.ed-head{
  flex:none;
  padding:10px var(--space-l);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:flex-start;gap:var(--space-s);
}
.ed-head-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ed-head-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.ed-body-wrap{position:relative;flex:1;min-height:0;display:flex}
.ed-body{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:10px var(--space-l);
  display:flex;flex-direction:column;gap:8px;
}

.ed-foot{
  flex:none;
  padding:10px var(--space-l);
  border-top:1px solid var(--stroke-divider);
  display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-s);
}
.ed-foot-main{display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}
.ed-foot-copy{margin-left:auto}

/* Form controls inside editor */
.ed-row{display:flex;gap:var(--space-s);align-items:flex-end}
.ed-row.flex-wrap{flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>label{font:var(--type-caption);color:var(--text-secondary);display:flex;align-items:center;justify-content:space-between;gap:4px}
.input{min-width:0}
.input.focused{
  border-color:var(--stroke-control);
  border-bottom:2px solid var(--accent-fill);
}
.input.invalid{
  border-color:var(--status-critical);
  border-bottom:2px solid var(--status-critical);
}
.input.disabled{
  background:var(--fill-control-disabled);
  border-color:var(--stroke-control);
  color:var(--text-disabled);
}
.caret{
  display:inline-block;width:1.5px;height:14px;
  background:var(--accent-fill);vertical-align:middle;margin-left:1px;
}
.field-err{
  display:flex;align-items:flex-start;gap:4px;
  font:var(--type-caption);color:var(--status-critical);
  overflow-wrap:anywhere;
}
.field-err svg{flex:none;margin-top:1px}
.field-hint{font:var(--type-caption);color:var(--text-tertiary);overflow-wrap:anywhere}

/* Condition row card */
.cond-list{display:flex;flex-direction:column;gap:5px}
.cond-row{
  padding:5px 7px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:5px;
}
.cond-row.invalid{
  border-color:color-mix(in srgb,var(--status-critical) 45%,transparent);
  background:color-mix(in srgb,var(--status-critical-bg) 35%,var(--fill-card-secondary));
}
.cond-line{display:flex;align-items:center;gap:4px;min-width:0}
.neg-btn{
  height:var(--h-control-compact);
  padding:0 7px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-control);
  background:var(--fill-control);
  font:var(--type-caption);color:var(--text-secondary);
  white-space:nowrap;
}
.neg-btn.on{
  background:color-mix(in srgb,var(--accent-fill) 16%,transparent);
  border-color:var(--accent-fill);
  color:var(--accent-text);
  font-weight:600;
}
.neg-btn.disabled{
  background:var(--fill-control-disabled);
  color:var(--text-disabled);
}

/* Category picker dropdown flyout */
.cat-field-wrap{position:relative}
.cat-flyout{
  position:absolute;left:0;right:0;top:calc(100% + 4px);
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-28);
  padding:4px;
  z-index:30;
  display:flex;flex-direction:column;gap:2px;
}
.cat-opt{
  min-height:32px;padding:4px 8px;
  border-radius:var(--radius-control);
  display:flex;align-items:center;gap:8px;
  font:var(--type-body);color:var(--text-primary);
}
.cat-opt.sel{background:var(--fill-subtle-hover)}
.cat-opt .sw-dot{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.cat-opt .tend{margin-left:auto;font:var(--type-caption);color:var(--text-tertiary);white-space:nowrap}
.cat-opt-foot{
  margin-top:2px;padding:6px 8px 4px;
  border-top:1px solid var(--stroke-divider);
  font:var(--type-caption);color:var(--text-tertiary);
}

/* Order stepper control */
.order-ctrl{
  display:flex;align-items:center;gap:4px;
  height:var(--h-control-compact);
}
.order-pos{font:var(--type-caption);color:var(--text-secondary);white-space:nowrap;padding:0 4px}

/* Live preview card (D5: condition-match + effective contribution + gap + first 50 privacy-safe samples) */
.prev-card{
  padding:8px 10px;
  border-radius:var(--radius-overlay);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:6px;
}
.prev-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prev-head .strong{flex:1;min-width:100px}
.prev-stale-bar{
  padding:5px 8px;
  border-radius:var(--radius-control);
  background:var(--status-caution-bg);
  border:1px solid color-mix(in srgb,var(--status-caution) 26%,transparent);
  display:flex;align-items:flex-start;gap:6px;
  font:var(--type-caption);color:var(--text-primary);
  overflow-wrap:anywhere;
}
.prev-content.stale{opacity:.52}
.prev-metrics{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}
.prev-metric{
  padding:5px 7px;
  border-radius:var(--radius-control);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:1px;
  min-width:0;
}
.prev-metric .pm-lbl{
  display:flex;align-items:center;gap:5px;
  font:var(--type-caption);color:var(--text-secondary);
}
.prev-metric .pm-dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--status-neutral)}
.prev-metric.eff .pm-dot{background:var(--status-success)}
.prev-metric .pm-val{font:var(--type-body-strong);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev-metric .pm-sub{font:var(--type-caption);color:var(--text-tertiary);overflow-wrap:anywhere}

.prev-gap{
  font:var(--type-caption);color:var(--text-secondary);
  padding:0 2px;
  overflow-wrap:anywhere;
}
.prev-samples-hdr{
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
  padding-top:4px;border-top:1px solid var(--stroke-divider);
  font:var(--type-caption);color:var(--text-secondary);
}
.sample-row{
  display:flex;align-items:center;gap:6px;
  min-height:24px;padding:1px 4px;
  border-radius:var(--radius-control);
  font:var(--type-caption);
}
.sample-time{flex:none;color:var(--text-tertiary);white-space:nowrap}
.sample-doc{flex:1;min-width:0;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sample-dur{flex:none;color:var(--text-secondary);white-space:nowrap}

/* Spinner & busy accent button */
.ring-xs{width:14px;height:14px;display:block;flex:none}
.ring-sm{width:16px;height:16px;display:block;flex:none}
.btn.accent.busy{
  background:color-mix(in srgb,var(--accent-fill) 86%,transparent);
  border-color:color-mix(in srgb,var(--accent-fill) 86%,transparent);
}

/* Modal dialog for new rule set / override builtin */
.modal-scrim{
  position:absolute;inset:0;
  background:var(--fill-smoke);
  z-index:30;
  display:flex;align-items:center;justify-content:center;
  padding:var(--space-l);
}
.modal-dlg{
  width:468px;max-width:100%;max-height:100%;
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-64);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.modal-head{
  flex:none;
  padding:var(--space-l) var(--space-xl) var(--space-m);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:center;gap:var(--space-s);
}
.modal-body{
  flex:1;min-height:0;overflow-y:auto;
  padding:var(--space-m) var(--space-xl);
  display:flex;flex-direction:column;gap:var(--space-m);
}
.modal-foot{
  flex:none;
  padding:var(--space-m) var(--space-xl);
  border-top:1px solid var(--stroke-divider);
  background:var(--fill-card-secondary);
  display:flex;align-items:center;justify-content:flex-end;gap:var(--space-s);flex-wrap:wrap;
}
.target-box{
  padding:var(--space-s) var(--space-m);
  border-radius:var(--radius-control);
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:4px;
}
.radio-card{
  padding:var(--space-s) var(--space-m);
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-control);
  background:var(--fill-control);
  display:flex;flex-direction:column;gap:var(--space-s);
}
.radio-card.sel{
  border-color:var(--accent-fill);
  background:var(--fill-card);
}
.radio-hdr{display:flex;align-items:flex-start;gap:var(--space-s)}
.radio-dot{

const PANEL_STATES = new Set([
  'editor',

/* Pseudo-locale generator matching quartz-i18n/src/pseudo.rs (~40% tilde padding + brackets)
   with accented Latin characters as requested: e.g. "Rule set" -> "[Ŕûļé šéţ~~~~]". */
const ACCENT_MAP = {
  A:'À',B:'Ɓ',C:'Ç',D:'Ď',E:'É',F:'Ƒ',G:'Ĝ',H:'Ĥ',I:'Î',J:'Ĵ',K:'Ķ',L:'Ļ',M:'Ḿ',
  N:'Ñ',O:'Ö',P:'Ƥ',Q:'Ǫ',R:'Ŕ',S:'Š',T:'Ţ',U:'Û',V:'Ṽ',W:'Ŵ',X:'Ẋ',Y:'Ý',Z:'Ž',
  a:'à',b:'ƀ',c:'ç',d:'đ',e:'é',f:'ƒ',g:'ĝ',h:'ĥ',i:'î',j:'ĵ',k:'ķ',l:'ļ',m:'ɱ',
  n:'ñ',o:'ö',p:'ƥ',q:'ǫ',r:'ŕ',s:'š',t:'ţ',u:'û',v:'ṽ',w:'ŵ',x:'ẋ',y:'ý',z:'ž',
};
function pseudoStr(s) {
  if (!s || typeof s !== 'string') return s;
  const accented = [...s].map(ch => ACCENT_MAP[ch] || ch).join('');
  const pad = Math.ceil((s.length * 2) / 5);
  return '[' + accented + '~'.repeat(pad) + ']';
}
function pseudoObj(val, skipKeys = new Set(['c', 'code', 'key', 'id', 'field', 'op', 'val', 'prio', 'ver', 'diffs', 'time'])) {
  if (typeof val === 'string') return pseudoStr(val);
  if (Array.isArray(val)) return val.map(v => pseudoObj(v, skipKeys));
  if (val && typeof val === 'object') {
    const out = {};
    for (const [k, v] of Object.entries(val)) {
      out[k] = skipKeys.has(k) ? v : pseudoObj(v, skipKeys);
    }
    return out;
  }
  return val;
}

    { name: T.rulesData.steam, c: '--cat-13', cat: T.cats.ent, prio: 50, src: 'builtin.classification' },
  ];

  const constraintBanner = showConstraint
    ? `<div class="infobar" style="margin-bottom:4px">` +
        `<svg class="ic s16 ib-ic"><use href="#lock"/></svg>` +
        `<div class="ib-body">` +
          `<div class="ib-title">${T.list.reorderEffTitle}</div>` +
          `<div>${T.list.reorderEffMsg}</div>` +
        `</div>` +
        `<button class="btn compact" style="flex:none;align-self:center">${T.list.reorderEffCta}</button>` +
      `</div>`
    : '';

  return `<div class="card list-card">` +
    `<div class="list-toolbar">` +
      `<div class="seg"><div>${T.list.segOwn}</div><div class="on">${T.list.segEff}</div></div>` +
      `<div class="list-toolbar-right">` +
        `<div class="input" style="width:152px"><svg class="ic s16"><use href="#search"/></svg><span class="ph ell">${T.list.searchPh}</span></div>` +
      `</div>` +
    `</div>` +
    `<div class="list-meta"><span>${T.list.effMeta}</span></div>` +
    constraintBanner +
    `<div class="rtbl-h">` +
      `<span class="rtbl-name">${T.list.colRule}</span>` +
      `<span class="rtbl-cat">${T.list.colCat}</span>` +
      `<span class="rtbl-prio sorted">${T.list.colPrio} ↓</span>` +
      `<span class="rtbl-src">${T.list.colSource}</span>` +
    `</div>` +
    rows.map((r, idx) =>
      `<div class="rtbl-r${r.sel ? ' sel' : ''}${showConstraint && idx === 0 ? ' drop-blocked' : ''}">` +
        `<span class="rtbl-name">` +
          `<span class="lbl">${r.name}</span>` +
          (showConstraint && idx === 0 ? `<span class="badge">${T.list.fixedByPrio}</span>` : '') +
        `</span>` +
        `<span class="rtbl-cat">${catChip(r.c, r.cat)}</span>` +
        `<span class="rtbl-prio">${r.prio}</span>` +
        `<span class="rtbl-src"><span class="ell">${r.src}</span>${r.badge ? `<span class="badge ${r.badge[0]}">${r.badge[1]}</span>` : ''}</span>` +
      `</div>`
    ).join('') +
    `<div class="group-sep"><svg class="ic s16"><use href="#chev-d"/></svg><span>${T.list.suppressedHdr}</span></div>` +
    `<div class="rtbl-r dim">` +
      `<span class="rtbl-name"><span class="lbl">${T.rulesData.wechatBuiltin}</span></span>` +
      `<span class="rtbl-cat">${catChip('--cat-3', T.cats.comm)}</span>` +
      `<span class="rtbl-prio">50</span>` +
      `<span class="rtbl-src"><span class="ell">builtin.classification</span><span class="badge dis">${T.list.badgeDis}</span></span>` +
    `</div>` +
    `<div class="cap ter" style="padding:0 8px 4px">${T.list.suppressedWechat}</div>` +
  `</div>`;
}

function renderEditorPanel(mode) {
  const ed = T.editor;
  const isSaving = mode === 'saving';
  const isStaleVer = mode === 'stale-version';
  const isValErr = mode === 'validation-error';
  const isPrevStale = mode === 'editor-preview-stale';
  const isCatOpen = mode === 'editor-cat-picker';
  const disInp = isSaving ? ' disabled' : '';
  const disBtn = isSaving ? ' disabled' : '';

  let topBanner = '';
  if (isStaleVer) {
    topBanner = `<div class="infobar caution" role="alert">` +
      `<svg class="ic s16 ib-ic"><use href="#warn"/></svg>` +
      `<div class="ib-body">` +
        `<div class="ib-title">${ed.staleTitle}</div>` +
        `<div>${ed.staleMsg}</div>` +
        `<div class="mono" style="color:var(--text-secondary);margin-top:2px">rule_set_stale · current_version: 4</div>` +
        `<div class="ib-acts">` +
          `<button class="btn compact accent"><svg class="ic s16"><use href="#refresh"/></svg><span>${ed.staleReloadBtn}</span></button>` +
          `<button class="btn compact">${ed.staleDiffBtn}</button>` +
        `</div>` +
      `</div>` +
    `</div>`;
  } else if (isValErr) {
    topBanner = `<div class="infobar critical" role="alert">` +
      `<svg class="ic s16 ib-ic"><use href="#crit-circle"/></svg>` +
      `<div class="ib-body">` +
        `<div class="ib-title">${ed.valSummaryTitle}</div>` +
        `<div>${ed.valSummaryMsg}</div>` +
        `<div class="mono" style="color:var(--text-secondary);margin-top:2px">rule_validation_failed</div>` +
      `</div>` +
    `</div>`;
  }

  const catDropdown = isCatOpen
    ? `<div class="cat-flyout" role="listbox">` +
        [
          { c: '--cat-8', name: T.cats.dev, tend: T.cats.focus },
          { c: '--cat-1', name: T.cats.learn, tend: T.cats.focus, sel: true },
          { c: '--cat-3', name: T.cats.comm, tend: T.cats.neutral },
          { c: '--cat-13', name: T.cats.ent, tend: T.cats.distraction },
          { c: '--cat-10', name: T.cats.sys, tend: T.cats.neutral },
        ].map(opt =>
          `<div class="cat-opt${opt.sel ? ' sel' : ''}">` +
            `<i class="sw-dot" style="--c:var(${opt.c})"></i>` +
            `<span class="ell">${opt.name}</span>` +
            `<span class="tend">${opt.tend}</span>` +
            (opt.sel ? `<svg class="ic s16" style="color:var(--accent-text)"><use href="#check"/></svg>` : `<span style="width:16px"></span>`) +
          `</div>`
        ).join('') +
        `<div class="cat-opt-foot">${ed.catArchivedNote}</div>` +
      `</div>`
    : '';

  const conds = isValErr
    ? [
        { field: 'app.exe_name', op: 'equals', val: 'code.exe', neg: false },
        { field: 'title.normalized', op: 'regex', val: '^[notes-.*(', neg: false, err: ed.valRegexErr, errCode: 'E-RULE-REGEX' },
        { field: 'doc.document', op: 'ends_with', val: '', neg: false, err: ed.valEmptyErr, errCode: 'E-RULE-VALUE' },
      ]
    : [
        { field: 'doc.document', op: 'ends_with', val: isPrevStale ? '.md|' : '.md', neg: false, typing: isPrevStale },
        { field: 'doc.project', op: 'equals', val: 'Quartz', neg: true },
      ];

  const condsHtml = conds.map(c => {
    const valContent = c.typing
      ? `<span class="mono">.md</span><span class="caret"></span>`
      : (c.val ? `<span class="mono ell">${c.val}</span>` : `<span class="ph mono">""</span>`);
    const inpCls = `input grow${disInp}${c.typing ? ' focused' : ''}${c.err ? ' invalid' : ''}`;
    return `<div class="cond-row${c.err ? ' invalid' : ''}">` +
      `<div class="cond-line">` +
        `<span class="neg-btn${c.neg ? ' on' : ''}${isSaving ? ' disabled' : ''}">${ed.negLabel}</span>` +
        `<div class="input grow${disInp}"><span class="mono grow ell">${c.field}</span><svg class="ic s16"><use href="#chev-d"/></svg></div>` +
        `<button class="btn compact icon subtle${disBtn}"><svg class="ic s16"><use href="#close"/></svg></button>` +
      `</div>` +
      `<div class="cond-line">` +
        `<div class="input${disInp}" style="flex:0 0 106px"><span class="mono grow ell">${c.op}</span><svg class="ic s16"><use href="#chev-d"/></svg></div>` +
        `<div class="${inpCls}">${valContent}</div>` +
      `</div>` +
      (c.neg ? `<div class="field-hint">${ed.negHint}</div>` : '') +
      (c.err ? `<div class="field-err"><svg class="ic s16" style="width:14px;height:14px"><use href="#crit-circle"/></svg><span>${c.err} <span class="mono">(${c.errCode})</span></span></div>` : '') +
    `</div>`;
  }).join('');

  const previewHtml = isValErr
    ? `<div class="prev-card">` +
        `<div class="prev-head"><span class="strong">${ed.previewTitle}</span><span class="badge crit">E-RULE</span></div>` +
        `<div class="cap sec">${ed.valPreviewPaused}</div>` +
      `</div>`
    : `<div class="prev-card">` +
        `<div class="prev-head">` +
          `<span class="strong">${ed.previewTitle}</span>` +
          (isPrevStale
            ? `<span class="row gap4 cap" style="color:var(--accent-text)">${ringSvg('ring-xs')}<span>${ed.updatingBadge}</span></span>`
            : `<span class="badge"><svg class="ic s16" style="width:12px;height:12px;margin-right:3px"><use href="#shield"/></svg>${ed.privacyBadge}</span>`) +
        `</div>` +
        (isPrevStale ? `<div class="prev-stale-bar"><svg class="ic s16" style="width:14px;height:14px;color:var(--status-caution);flex:none"><use href="#warn"/></svg><span>${ed.staleBar}</span></div>` : '') +
        `<div class="prev-content${isPrevStale ? ' stale' : ''}" style="display:flex;flex-direction:column;gap:8px">` +
          `<div class="prev-metrics">` +
            `<div class="prev-metric">` +
              `<div class="pm-lbl"><i class="pm-dot"></i><span class="ell">${ed.condMatchLabel}</span></div>` +
              `<div class="pm-val">${ed.condMatchVal}</div>` +
              `<div class="pm-sub">${ed.condMatchSub}</div>` +
            `</div>` +
            `<div class="prev-metric eff">` +
              `<div class="pm-lbl"><i class="pm-dot"></i><span class="ell">${ed.effLabel}</span></div>` +
              `<div class="pm-val">${ed.effVal}</div>` +
              `<div class="pm-sub">${ed.effSub}</div>` +
            `</div>` +
          `</div>` +
          `<div class="prev-gap">${ed.gapNote}</div>` +
          `<div class="prev-samples-hdr"><span>${ed.samplesHdr}</span><span class="ter">${ed.samplesSafe}</span></div>` +
          `<div>` +
            ed.samples.map(s => {
              const bCls = s.st === 'eff' ? 'ok' : (s.st === 'shadow' ? 'warn' : 'dis');
              const bTxt = s.st === 'eff' ? ed.stEff : (s.st === 'shadow' ? ed.stShadow : ed.stIdle);
              return `<div class="sample-row">` +
                `<span class="sample-time">${s.time}</span>` +
                `<span class="sample-doc">${s.doc}</span>` +
                `<span class="sample-dur">${s.dur}</span>` +
                `<span class="badge ${bCls}">${bTxt}</span>` +
              `</div>`;
            }).join('') +
          `</div>` +
        `</div>` +
      `</div>`;

  let primaryBtnHtml = `<button class="btn accent">${ed.saveBtn}</button>`;
  if (isSaving) {
    primaryBtnHtml = `<button class="btn accent busy">${ringSvg('ring-sm', 'color-mix(in srgb,var(--text-on-accent) 32%,transparent)', 'var(--text-on-accent)')}<span>${ed.savingBtn}</span></button>`;
  } else if (isStaleVer) {
    primaryBtnHtml = `<button class="btn disabled">${ed.saveBtn}</button>`;
  } else if (isValErr) {
    primaryBtnHtml = `<button class="btn disabled">${ed.retrySaveBtn}</button>`;
  }

  const panel = document.getElementById('details');
  panel.style.display = 'flex';
  panel.innerHTML =
    `<div class="ed-head">` +
      `<div class="ed-head-txt">` +
        `<div class="ed-head-title"><span class="strong">${ed.title}</span>${isStaleVer ? `<span class="badge warn">${ed.draftPill}</span>` : ''}</div>` +
        `<div class="cap sec ell">user.local.classification/vscode-notes</div>` +
      `</div>` +
      `<button class="btn subtle icon compact${disBtn}"><svg class="ic s16"><use href="#close"/></svg></button>` +
    `</div>` +
    `<div class="ed-body-wrap" id="ed-body-wrap">` +
      `<div class="ed-body" id="ed-body">` +
        topBanner +
        (isSaving ? `<div class="infobar"><span style="flex:none">${ringSvg('ring-xs')}</span><div class="ib-body"><span>${ed.savingNote}</span></div></div>` : '') +
        `<div class="field"><label>${ed.nameLabel}</label><div class="input std${disInp}"><span class="ell">${T.rulesData.vscodeNotes}</span></div></div>` +
        `<div class="ed-row">` +
          `<div class="field grow cat-field-wrap">` +
            `<label>${ed.catLabel}</label>` +
            `<div class="input std${disInp}${isCatOpen ? ' focused' : ''}">${catChip('--cat-1', T.cats.learn)}<span class="grow"></span><svg class="ic s16"><use href="#${isCatOpen ? 'chev-u' : 'chev-d'}"/></svg></div>` +
            catDropdown +
          `</div>` +
          `<div class="field" style="width:76px;flex:none"><label>${ed.prioLabel}</label><div class="input std${disInp}">80</div></div>` +
        `</div>` +
        `<div class="ed-row flex-wrap" style="justify-content:space-between">` +
          `<div class="field"><label>${ed.matchLabel}</label><div class="seg${isSaving ? ' dim' : ''}"><div class="on">${ed.matchAll}</div><div>${ed.matchAny}</div></div></div>` +
          `<div class="field"><label>${ed.orderLabel}</label><div class="order-ctrl"><span class="order-pos">${ed.orderPos}</span><button class="btn compact icon disabled"><svg class="ic s16"><use href="#arrow-u"/></svg></button><button class="btn compact icon${disBtn}"><svg class="ic s16"><use href="#arrow-d"/></svg></button></div></div>` +
        `</div>` +
        `<div class="field">` +
          `<label><span>${ed.condsLabel}</span><span class="cap ter">${ed.matchAll}</span></label>` +
          `<div class="cond-list">${condsHtml}</div>` +
        `</div>` +
        `<button class="btn compact${disBtn}" style="align-self:flex-start"><svg class="ic s16"><use href="#add"/></svg><span>${ed.addCond}</span></button>` +
        previewHtml +
      `</div>` +
      `<div class="scroll-track" aria-hidden="true"><div class="scroll-thumb" id="ed-thumb"></div></div>` +
    `</div>` +
    `<div class="ed-foot">` +
      `<div class="ed-foot-main">${primaryBtnHtml}<button class="btn${disBtn}">${ed.cancelBtn}</button></div>` +
      `<button class="btn compact ed-foot-copy${disBtn}"><svg class="ic s16"><use href="#copy"/></svg><span>${ed.copyBtn}</span></button>` +
    `</div>`;
}

function renderNewSetModal() {
  const m = T.newSet;
  const scrim = document.getElementById('modal-scrim');
  scrim.style.display = 'flex';
  scrim.innerHTML =
    `<div class="modal-dlg" role="dialog" aria-modal="true">` +
      `<div class="modal-head">` +
        `<span class="h-sub grow ell">${m.title}</span>` +
        `<button class="btn subtle icon compact"><svg class="ic s16"><use href="#close"/></svg></button>` +
      `</div>` +
      `<div class="modal-body">` +
        `<div class="target-box">` +
          `<div class="row gap8"><svg class="ic s16" style="color:var(--text-tertiary);flex:none"><use href="#lock"/></svg><span class="mono ell">builtin.classification/windows-terminal</span></div>` +
          `<div class="cap strong">${m.targetSummary}</div>` +
          `<div class="cap sec">${m.targetCaption}</div>` +
        `</div>` +
        `<div class="field">` +
          `<label>${m.destLabel}</label>` +
          `<div class="radio-card">` +
            `<div class="radio-hdr"><span class="radio-dot"></span><div class="grow" style="min-width:0"><div class="strong">${m.optExistingTitle}</div><div class="cap sec">${m.optExistingDesc}</div></div></div>` +
          `</div>` +
          `<div class="radio-card sel" style="margin-top:6px">` +
            `<div class="radio-hdr"><span class="radio-dot"></span><div class="grow" style="min-width:0"><div class="strong">${m.optNewTitle}</div><div class="cap sec">${m.optNewDesc}</div></div></div>` +
            `<div class="radio-fields">` +
              `<div class="field"><label>${m.parentLabel}</label><div class="input disabled"><svg class="ic s16" style="width:14px;height:14px"><use href="#lock"/></svg><span class="ell">${m.parentVal}</span></div></div>` +
              `<div class="field"><label>${m.nameLabel}</label><div class="input std focused"><span class="ell">${m.nameVal}</span><span class="caret"></span></div></div>` +
              `<div class="field"><label>${m.keyLabel}</label><div class="input std"><span class="mono ell">${m.keyVal}</span></div><div class="field-hint">${m.keyHint}</div></div>` +
              `<div class="sw-row"><div><div class="strong" style="font-size:13px">${m.enableLabel}</div><div class="cap sec">${m.enableDesc}</div></div><div class="sw on"></div></div>` +
            `</div>` +
          `</div>` +
        `</div>` +
      `</div>` +
      `<div class="modal-foot">` +
        `<button class="btn accent">${m.confirmBtn}</button>` +
        `<button class="btn">${m.cancelBtn}</button>` +
      `</div>` +
    `</div>`;
}

function renderMain() {
  const main = document.getElementById('main');

  if (stateKey === 'loading') {
    main.innerHTML =
      renderHeaderAndPivot({ disabled: true, loadingBadge: true }) +
      `<div class="rules-grid">${renderTreeCard({ mode: 'loading' })}${renderListLoading()}</div>`;
    return;
  }

  if (stateKey === 'empty') {
    main.innerHTML =
      renderHeaderAndPivot() +
      `<div class="rules-grid">${renderTreeCard({ mode: 'empty' })}${renderBuiltinEmptyList()}</div>`;
    return;
  }

  if (stateKey === 'load-error') {
    const e = T.loadErr;
    main.innerHTML =
      renderHeaderAndPivot() +
      `<div class="card load-err-card" role="alert">` +
        `<svg class="ic load-err-ic"><use href="#warn"/></svg>` +
        `<div class="load-err-body">` +
          `<div class="load-err-title">${e.title}</div>` +
          `<div class="load-err-msg">${e.msg}</div>` +
          `<div class="load-err-code">${e.codeLabel}: busy</div>` +
        `</div>` +
        `<div class="load-err-act"><button class="btn"><svg class="ic s16"><use href="#refresh"/></svg><span>${e.retry}</span></button></div>` +
      `</div>`;
    return;
  }

  if (stateKey === 'new-set') {
    main.innerHTML =
      renderHeaderAndPivot() +
      `<div class="rules-grid">${renderTreeCard({ selected: 'builtin' })}${renderBuiltinEmptyList()}</div>`;
    renderNewSetModal();
    return;
  }

  if (stateKey === 'reorder-entries') {
    main.innerHTML =
      renderHeaderAndPivot() +
      `<div class="rules-grid">${renderTreeCard({ mode: 'reorder', selected: 'local' })}${renderOwnEntriesList({ reorder: true })}</div>`;
    return;
  }

  if (stateKey === 'reorder-effective') {
    main.innerHTML =
      renderHeaderAndPivot() +
      `<div class="rules-grid">${renderTreeCard({ selected: 'builtin' })}${renderEffectiveList({ showConstraint: true })}</div>`;
    return;
  }

  // Editor-family states
  const isSaving = stateKey === 'saving';
  main.innerHTML =
    renderHeaderAndPivot({ disabled: isSaving }) +
    `<div class="rules-grid">${renderTreeCard({ selected: 'local', disabled: isSaving })}${renderOwnEntriesList({ selectedIdx: 0, disabled: isSaving })}</div>`;
  renderEditorPanel(stateKey);
}

function syncScroll(scrollEl, wrapEl, thumbEl) {
  if (!scrollEl || !wrapEl || !thumbEl) return;
  const overflow = scrollEl.scrollHeight > scrollEl.clientHeight + 1;
  wrapEl.classList.toggle('scrollable', overflow);
  if (!overflow) return;
  const trackH = wrapEl.clientHeight - 8;
  const ratio = scrollEl.clientHeight / scrollEl.scrollHeight;
  const thumbH = Math.max(28, Math.round(trackH * ratio));
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const top = maxScroll > 0 ? Math.round((scrollEl.scrollTop / maxScroll) * (trackH - thumbH)) : 0;
  thumbEl.style.height = thumbH + 'px';
  thumbEl.style.top = top + 'px';
}

renderNav();
renderMain();

const mainEl = document.getElementById('main');
const mainWrapEl = document.getElementById('main-wrap');
const mainThumbEl = document.getElementById('main-thumb');
syncScroll(mainEl, mainWrapEl, mainThumbEl);
mainEl.addEventListener('scroll', () => syncScroll(mainEl, mainWrapEl, mainThumbEl));

const edBody = document.getElementById('ed-body');
const edBodyWrap = document.getElementById('ed-body-wrap');
const edThumb = document.getElementById('ed-thumb');
if (edBody) {
  syncScroll(edBody, edBodyWrap, edThumb);
  edBody.addEventListener('scroll', () => syncScroll(edBody, edBodyWrap, edThumb));
}
</script>
