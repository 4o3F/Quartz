<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Quartz — Categories &amp; unclassified queue (M4 V2)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<!--
  Categories editor, unclassified queue, and classification scope chooser mockup for Quartz (M4 V2: H2 / H11).
  Query parameters:
    ?state=categories | category-edit | category-archived |
           categories-loading | categories-error | category-saving |
           queue | queue-documents | queue-day | queue-scope |
           queue-empty | queue-search-empty | queue-loading | queue-error
    &theme=light | dark
    &lang=zh-CN | en | en-XA
    &size=min          (optional: 640x480 minimum window per 07 §2.3; default 1280x800)
    &group=app | document  (optional override for queue states; queue/queue-day default app, queue-documents/queue-scope default document)
-->
<style>
/* Minimum window 640x480 (Compact breakpoint per 07 §2.1 & §2.3) */
html[data-size="min"],
html[data-size="min"] body,
html[data-size="min"] .window{width:640px;height:480px}

.wrap{position:relative;overflow:hidden}
.main-wrap{position:relative;flex:1;min-width:0;display:flex}
.main{position:relative;padding:var(--space-xxl) var(--space-xxl) var(--space-l);gap:var(--space-s);overflow-y:auto;overflow-x:hidden}
html[data-has-panel="true"] .main{padding:var(--space-xl) var(--space-l) var(--space-l)}
html[data-size="min"] .main{padding:var(--space-l) var(--space-l) var(--space-l)}

/* Fluent 2 overlay scrollbar indicator (11 §9.2) */
.scroll-track{
  display:none;
  position:absolute;top:var(--space-xs);right:var(--space-xs);bottom:var(--space-xs);
  width:6px;pointer-events:none;z-index:8;
}
.scrollable > .scroll-track{display:block}
.scroll-thumb{
  position:absolute;left:1px;right:1px;top:0;
  border-radius:var(--radius-control);
  background:var(--text-tertiary);
}

/* Nav text stays single-line with ellipsis in en-XA */
.nav-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Page header & pivot — content-driven wrapping for en-XA and 640x480 */
.page-head{
  flex:none;
  display:flex;align-items:center;flex-wrap:wrap;
  gap:var(--space-s);
  min-height:40px;
}
.page-head .h-title{flex:1;min-width:140px}
.page-head-acts{display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}

.pivot{
  height:auto;min-height:32px;
  gap:var(--space-l);row-gap:var(--space-xs);
  flex-wrap:wrap;
}
.pivot div{height:32px;white-space:nowrap}
html[data-size="min"] .pivot{gap:var(--space-m);row-gap:0}

/* Flexible buttons & badges safe for en-XA */
.badge{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center}
.badge .btxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:var(--h-control-standard);height:auto;padding:4px 12px}
.btn.compact{min-height:var(--h-control-compact);height:auto;padding:2px 10px}
.btn.icon{width:var(--h-control-standard);height:var(--h-control-standard);padding:0}
.btn.compact.icon{width:var(--h-control-compact);height:var(--h-control-compact);padding:0}

/* Main workspace card */
.work-card{
  flex:none;
  padding:var(--space-m) var(--space-m) var(--space-s);
  display:flex;flex-direction:column;gap:var(--space-xs);
  margin-top:var(--space-xs);
}
.toolbar{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:var(--space-s);
  padding:0 var(--space-xs) var(--space-xs);
}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}
.meta-bar{
  display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-s);
  padding:0 var(--space-xs) var(--space-xs);
  font:var(--type-caption);color:var(--text-secondary);
}
.meta-bar .meta-hint{margin-left:auto;color:var(--text-tertiary)}
html[data-size="min"] .meta-bar .meta-hint{margin-left:0}

/* Inline banners (InfoBars, reused from V1) */
.infobar{
  flex:none;
  padding:6px var(--space-m);
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;align-items:flex-start;gap:var(--space-s);
  font:var(--type-caption);color:var(--text-secondary);
  overflow-wrap:anywhere;word-break:break-word;
}
.infobar .ib-ic{flex:none;margin-top:1px;color:var(--text-secondary)}
.infobar .ib-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.infobar .ib-title{font:var(--type-body-strong);color:var(--text-primary);font-size:13px;line-height:18px;overflow-wrap:anywhere}
.infobar.caution{
  background:var(--status-caution-bg);
  border-color:color-mix(in srgb,var(--status-caution) 28%,transparent);
  color:var(--text-primary);
}
.infobar.caution .ib-ic{color:var(--status-caution)}

/* Lightweight inline load error card (shared pattern with V1 & Today) */
.load-err-card{
  flex:none;margin-top:var(--space-xs);
  padding:var(--space-l) var(--space-xl);
  display:flex;align-items:flex-start;gap:var(--space-m);
}
.load-err-ic{color:var(--status-caution);margin-top:1px;flex:none}
.load-err-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-xs);overflow-wrap:anywhere}
.load-err-title{font:var(--type-body-strong);color:var(--text-primary);overflow-wrap:anywhere}
.load-err-msg{font:var(--type-body);color:var(--text-secondary);overflow-wrap:anywhere}
.load-err-code{font:var(--type-caption);font-family:var(--font-mono);color:var(--text-tertiary);margin-top:2px;overflow-wrap:anywhere}
.load-err-act{flex:none;align-self:center;margin-left:var(--space-m)}
html[data-size="min"] .load-err-card{flex-wrap:wrap;padding:var(--space-l)}
html[data-size="min"] .load-err-act{margin-left:calc(20px + var(--space-m));margin-top:var(--space-xs);align-self:flex-start}

/* Static skeleton primitives (zero looping animation per 07 §9 & 11 §1) */
.skel{
  display:inline-block;border-radius:var(--radius-control);
  background:color-mix(in srgb,var(--text-tertiary) 18%,transparent);
}
.skel.soft{background:var(--fill-subtle-hover)}
.seg.dim{opacity:.55}

/* Drag-reorder insertion bar (reused from V1) */
.drop-line{
  position:relative;height:2px;margin:2px 8px;
  background:var(--accent-fill);border-radius:1px;
}
.drop-line::before,.drop-line::after{
  content:"";position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--accent-fill);
}
.drop-line::before{left:-4px}
.drop-line::after{right:-4px}
.drop-line.ind1{margin-left:34px}

/* ===========================
   Categories list
   =========================== */
.cat-h,.cat-r{
  display:flex;align-items:center;gap:var(--space-s);
  min-height:var(--h-row-standard);
  padding:4px var(--space-s);
  border-radius:var(--radius-control);
}
.cat-h{
  min-height:var(--h-row-compact);
  font:var(--type-caption);color:var(--text-secondary);
  border-bottom:1px solid var(--stroke-divider);
  border-radius:0;
}
.cat-r{position:relative}
.cat-r.sel{background:var(--fill-subtle-hover)}
.cat-r.sel::before{
  content:"";position:absolute;left:0;top:11px;width:3px;height:18px;
  border-radius:2px;background:var(--accent-fill);
}
.cat-r.dragging{
  background:var(--bg-flyout);
  border:1px solid var(--accent-fill);
  box-shadow:var(--shadow-8);
}
.cat-r.disabled-ui{opacity:.6}
.cat-r.arch-r{
  min-height:auto;
  padding:8px var(--space-s);
  align-items:flex-start;
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  margin-top:4px;
}
.cat-grip{
  width:16px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);
}
.cat-indent{
  width:24px;flex:none;
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:4px;
  color:var(--stroke-control-strong);
}
.cat-branch{
  width:10px;height:12px;
  border-left:1.5px solid var(--stroke-control-strong);
  border-bottom:1.5px solid var(--stroke-control-strong);
  border-bottom-left-radius:3px;
  margin-bottom:4px;
}
.cat-sw{
  width:14px;height:14px;border-radius:3px;flex:none;
  background:var(--c);
  box-shadow:inset 0 0 0 1px var(--stroke-control);
}
.cat-r.arch-r .cat-sw{opacity:.65;margin-top:3px}
.cat-name-col{
  flex:1;min-width:110px;
  display:flex;align-items:center;gap:6px;
  overflow:hidden;
}
.cat-name-stack{
  flex:1;min-width:0;
  display:flex;flex-direction:column;gap:2px;
}
.cat-name-line{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.cat-name-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-tend-col{
  flex:0 0 112px;
  display:flex;align-items:center;justify-content:flex-start;
}
.tend-pill{
  display:inline-flex;align-items:center;
  height:20px;padding:0 8px;max-width:100%;
  border-radius:var(--radius-control);
  background:var(--fill-subtle-hover);
  font:var(--type-caption);color:var(--text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cat-rules-col{
  flex:0 0 88px;
  text-align:right;
  font:var(--type-caption);color:var(--text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cat-act-col{
  flex:0 0 28px;
  display:flex;justify-content:flex-end;align-items:center;
}
html[data-lang="en-XA"] .cat-tend-col{flex:0 0 144px}
html[data-lang="en-XA"] .cat-rules-col{flex:0 0 108px}
html[data-size="min"] .cat-rules-col{display:none}
html[data-size="min"] .cat-tend-col{flex:0 0 76px}
html[data-size="min"][data-lang="en-XA"] .cat-tend-col{flex:0 0 104px}
html[data-size="min"] .cat-indent{width:16px}

/* Collapsed / expanded archived footer inside Categories card */
.arch-sect{
  margin-top:var(--space-s);
  padding-top:var(--space-s);
  border-top:1px solid var(--stroke-divider);
  display:flex;flex-direction:column;gap:6px;
}
.arch-toggle{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  padding:4px var(--space-s);
  border-radius:var(--radius-control);
  background:var(--fill-card-secondary);
  min-height:var(--h-row-compact);
}
.arch-toggle .arch-hint{margin-left:auto;font:var(--type-caption);color:var(--text-tertiary)}
html[data-size="min"] .arch-toggle .arch-hint{margin-left:0}
.arch-ref-hint{
  margin-top:4px;
  padding:5px 8px;
  border-radius:var(--radius-control);
  background:var(--status-caution-bg);
  border:1px solid color-mix(in srgb,var(--status-caution) 26%,transparent);
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  font:var(--type-caption);color:var(--text-primary);
  overflow-wrap:anywhere;
}
.arch-ref-hint svg{flex:none;color:var(--status-caution)}
.arch-ref-link{
  margin-left:auto;
  display:inline-flex;align-items:center;gap:2px;
  font:var(--type-caption);font-weight:600;color:var(--accent-text);
  white-space:nowrap;
}
.arch-ref-link svg{color:var(--accent-text)}

/* Range filter chip & reset link (queue-day) */
.range-chip{
  display:inline-flex;align-items:center;gap:5px;
  height:var(--h-control-compact);padding:0 8px;
  border-radius:var(--radius-control);
  background:var(--fill-subtle-hover);
  font:var(--type-caption);color:var(--text-secondary);
  white-space:nowrap;
}
.range-chip.active-day{
  background:color-mix(in srgb,var(--accent-fill) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--accent-fill) 36%,transparent);
  color:var(--accent-text);
  font-weight:600;
}
.range-reset-link{
  font:var(--type-caption);color:var(--accent-text);
  white-space:nowrap;
}

/* ===========================
   Unclassified queue list
   =========================== */
.q-h,.q-r{
  display:flex;align-items:center;gap:var(--space-s);
  min-height:44px;
  padding:6px var(--space-s);
  border-radius:var(--radius-control);
}
.q-h{
  min-height:var(--h-row-compact);
  padding:4px var(--space-s);
  font:var(--type-caption);color:var(--text-secondary);
  border-bottom:1px solid var(--stroke-divider);
  border-radius:0;
}
.q-r.sel{
  background:var(--fill-subtle-hover);
  position:relative;
}
.q-r.sel::before{
  content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
  border-radius:2px;background:var(--accent-fill);
}
.q-r.expanded{
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  border-bottom:none;
  border-bottom-left-radius:0;
  border-bottom-right-radius:0;
}
.q-chev{
  width:18px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
}
.q-ic{
  width:24px;height:24px;border-radius:var(--radius-control);flex:none;
  background:var(--fill-subtle-hover);
  color:var(--text-secondary);
  display:grid;place-items:center;
}
.q-entity{
  flex:1;min-width:110px;
  display:flex;flex-direction:column;gap:1px;
  overflow:hidden;
}
.q-entity-title{display:flex;align-items:center;gap:6px;min-width:0}
.q-entity-sub{font:var(--type-caption);color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-bar-col{
  width:96px;flex:none;
  display:flex;align-items:center;
}
.q-bar{
  width:100%;height:6px;border-radius:3px;
  background:var(--fill-subtle-hover);
  overflow:hidden;
}
.q-bar i{
  display:block;height:100%;border-radius:3px;
  background:var(--cat-neutral);
}
.q-dur-col{
  flex:0 0 82px;
  text-align:right;
  font:var(--type-caption);color:var(--text-secondary);
  white-space:nowrap;
}
.q-act-col{
  flex:0 0 92px;
  display:flex;justify-content:flex-end;
}
html[data-lang="en-XA"] .q-dur-col{flex:0 0 96px}
html[data-lang="en-XA"] .q-act-col{flex:0 0 148px}
html[data-has-panel="true"] .q-bar-col{width:64px}
html[data-size="min"] .q-bar-col{width:52px}
html[data-size="min"] .q-dur-col{flex:0 0 68px}
html[data-size="min"] .q-act-col{flex:0 0 78px}
html[data-size="min"][data-lang="en-XA"] .q-dur-col{flex:0 0 82px}
html[data-size="min"][data-lang="en-XA"] .q-act-col{flex:0 0 140px}

/* Expandable sample ranges drawer under a queue row (up to 5 ranges per 04 §6.2.1) */
.q-samples{
  padding:6px var(--space-m) 8px 46px;
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  border-top:1px solid var(--stroke-divider);
  border-bottom-left-radius:var(--radius-control);
  border-bottom-right-radius:var(--radius-control);
  margin-bottom:4px;
  display:flex;flex-direction:column;gap:3px;
}
html[data-size="min"] .q-samples{padding-left:var(--space-m)}
.q-samples-hdr{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-s);flex-wrap:wrap;
  padding-bottom:3px;
  font:var(--type-caption);color:var(--text-secondary);
}
.q-sample-row{
  display:flex;align-items:center;gap:var(--space-s);
  min-height:28px;padding:2px 6px;
  border-radius:var(--radius-control);
  font:var(--type-caption);
}
.q-sample-row.sel{background:var(--fill-subtle-hover)}
.q-sample-range{flex:1;min-width:0;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-sample-dur{flex:none;color:var(--text-secondary);white-space:nowrap}

/* Calm empty states (matching today-states.html) */
.empty-card{
  flex:1;min-height:280px;
  margin-top:var(--space-xs);
  display:flex;align-items:center;justify-content:center;
}
.empty-inner{
  max-width:440px;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:var(--space-m);
  padding:var(--space-xxl) var(--space-l);
}
.empty-tile{
  width:48px;height:48px;
  border-radius:var(--radius-overlay);
  background:var(--fill-subtle-hover);
  border:1px solid var(--stroke-card);
  color:var(--text-secondary);
  display:grid;place-items:center;
}
.empty-tile.ok{
  background:var(--status-success-bg);
  border-color:color-mix(in srgb,var(--status-success) 24%,transparent);
  color:var(--status-success);
}
.empty-tile svg{width:24px;height:24px;stroke-width:1.5}
.empty-title{font:var(--type-subtitle);color:var(--text-primary)}
.empty-desc{font:var(--type-body);color:var(--text-secondary);overflow-wrap:anywhere}
.status-pill{
  display:inline-flex;align-items:center;gap:8px;
  height:24px;padding:0 var(--space-m);
  border-radius:var(--radius-control);
  background:var(--fill-subtle-hover);
  font:var(--type-caption);color:var(--text-secondary);
}
.status-pill i{width:6px;height:6px;border-radius:50%;background:var(--status-success);flex:none}

.search-empty-box{
  padding:var(--space-xxxl) var(--space-l);
  display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:var(--space-s);
}

/* ===========================
   Right-hand panel (360px, reused from V1)
   =========================== */
.panel-scrim{
  display:none;
  position:absolute;inset:0;
  background:color-mix(in srgb,var(--fill-smoke) 42%,transparent);
  z-index:15;
}
.details{
  width:var(--w-details);flex:none;
  border-left:1px solid var(--stroke-divider);
  padding:0;gap:0;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:transparent;
}
html[data-size="min"][data-panel-open="true"] .panel-scrim{display:block}
html[data-size="min"] .details{
  position:absolute;top:0;right:0;bottom:0;
  width:360px;max-width:calc(100% - 16px);
  background:linear-gradient(var(--fill-layer),var(--fill-layer)),var(--bg-base);
  border-left:1px solid var(--stroke-divider);
  box-shadow:var(--shadow-28);
  z-index:20;
}

.ed-head{
  flex:none;
  padding:10px var(--space-l);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:flex-start;gap:var(--space-s);
}
.ed-head-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ed-head-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.ed-body-wrap{position:relative;flex:1;min-height:0;display:flex}
.ed-body{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:10px var(--space-l);
  display:flex;flex-direction:column;gap:8px;
}

.ed-foot{
  flex:none;
  padding:8px var(--space-l);
  border-top:1px solid var(--stroke-divider);
  display:flex;align-items:center;flex-wrap:nowrap;gap:6px;
}
.ed-foot-main{
  flex:1;min-width:0;
  display:flex;align-items:center;flex-wrap:nowrap;gap:6px;
}
.ed-foot-main .btn{
  padding:4px 10px;
  min-width:0;max-width:100%;
  overflow:hidden;
}
.ed-foot-main .btn.accent{flex:0 1 auto}
.ed-foot-main .btn:not(.accent){flex:0 0 auto}
.ed-foot-main .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-foot-copy{flex:0 0 auto;margin-left:auto}
.ed-foot-more{flex:0 0 auto;margin-left:auto}
.tend-seg{width:100%;display:flex;height:auto;min-height:var(--h-control-compact)}
.tend-seg div{flex:1 1 0;min-width:0;padding:2px 6px;justify-content:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Form controls inside panel */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{
  font:var(--type-caption);color:var(--text-secondary);
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
}
.label-act{color:var(--accent-text);font:var(--type-caption);white-space:nowrap}
.label-act.disabled{color:var(--text-disabled)}
.input{min-width:0}
.input.focused{
  border-color:var(--stroke-control);
  border-bottom:2px solid var(--accent-fill);
}
.input.disabled{
  background:var(--fill-control-disabled);
  border-color:var(--stroke-control);
  color:var(--text-disabled);
}
.caret{
  display:inline-block;width:1.5px;height:14px;
  background:var(--accent-fill);vertical-align:middle;margin-left:1px;flex:none;
}
.field-hint{font:var(--type-caption);color:var(--text-tertiary);overflow-wrap:anywhere}

/* Semantic 15-swatch category palette tray (sits on bg.base for >=3:1 dark contrast per 11 §3.3) */
.palette-tray{
  padding:8px;
  border-radius:var(--radius-control);
  background:var(--bg-base);
  border:1px solid var(--stroke-card);
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;
}
.swatch-btn{

}

.radio-card.sel .radio-dot{

  background:var(--accent-fill);

.radio-title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}

function ringSvg(cls, trackVar = 'var(--stroke-control-strong)', arcVar = 'var(--accent-fill)') {
  return `<svg class="${cls}" viewBox="0 0 28 28" aria-hidden="true">` +
    `<circle cx="14" cy="14" r="10.5" fill="none" stroke="${trackVar}" stroke-width="3"/>` +
    `<path d="M14 3.5 A10.5 10.5 0 0 1 24.5 14" fill="none" stroke="${arcVar}" stroke-width="3" stroke-linecap="round"/>` +
    `</svg>`;
}

function catChip(colorVar, label) {
  return `<span class="chip" style="--c:var(${colorVar})"><i></i><span>${label}</span></span>`;
}

function renderNav() {
  const nav = document.getElementById('nav');
  const isRail = isMin || hasPanel;
  if (isRail) nav.classList.add('rail');
  const menuRow = isMin
    ? `<div style="height:4px;flex:none"></div>`
    : `<div class="nav-item" style="margin-top:4px"><svg class="ic"><use href="#menu"/></svg></div>`;
  nav.innerHTML =
    menuRow +
    `<div class="nav-item"><i class="ind"></i><svg class="ic"><use href="#today"/></svg><span>${T.nav.today}</span></div>` +
    `<div class="nav-item"><i class="ind"></i><svg class="ic"><use href="#week"/></svg><span>${T.nav.week}</span></div>` +
    `<div class="nav-item selected"><i class="ind"></i><svg class="ic"><use href="#tag-f"/></svg><span>${T.nav.rules}</span></div>` +
    `<div class="spacer"></div>` +
    `<div class="bottom"><div class="nav-item"><i class="ind"></i><svg class="ic"><use href="#gear"/></svg><span>${T.nav.settings}</span></div></div>`;
}

function renderHeaderAndPivot({ disabled = false, loadingBadge = false, hideQueueBadge = false } = {}) {
  const dis = disabled ? ' disabled' : '';
  let qBadge = `<span class="badge">7</span>`;
  if (loadingBadge) qBadge = `<span class="skel soft" style="width:18px;height:16px"></span>`;
  else if (hideQueueBadge) qBadge = '';

  const headerAct = isQueueTab
    ? `<button class="btn${dis}"><svg class="ic s16"><use href="#copy"/></svg><span>${T.page.copySituation}</span></button>`
    : `<button class="btn accent${dis}"><svg class="ic s16"><use href="#add"/></svg><span>${T.page.newCategory}</span></button>`;

  return `<div class="page-head">` +
    `<span class="h-title ell">${T.page.title}</span>` +
    `<div class="page-head-acts">${headerAct}</div>` +
  `</div>` +
  `<div class="pivot">` +
    `<div class="${!isQueueTab ? 'on' : ''}">${T.page.tabs.categories}</div>` +
    `<div>${T.page.tabs.rules}</div>` +
    `<div class="${isQueueTab ? 'on' : ''}">${T.page.tabs.queue}${qBadge}</div>` +
    `<div>${T.page.tabs.extraction}</div>` +
    `<div>${T.page.tabs.privacy}</div>` +
  `</div>`;
}

function renderErrorCard(title, msg, codeLabel, retryLabel) {
  return `<div class="card load-err-card" role="alert">` +
    `<svg class="ic load-err-ic"><use href="#warn"/></svg>` +
    `<div class="load-err-body">` +
      `<div class="load-err-title">${title}</div>` +
      `<div class="load-err-msg">${msg}</div>` +
      `<div class="load-err-code">${codeLabel}: busy</div>` +
    `</div>` +
    `<div class="load-err-act"><button class="btn"><svg class="ic s16"><use href="#refresh"/></svg><span>${retryLabel}</span></button></div>` +
  `</div>`;
}

function renderCategoriesList({ mode = 'normal', selectedId = null, disabled = false } = {}) {
  const c = T.cats;
  const rows = getCategoryRows();
  const showDragDemo = mode === 'normal';
  const showArchivedExpanded = mode === 'archived';
  const visibleRows = showArchivedExpanded ? rows.slice(0, 6) : rows;
  const disCls = disabled ? ' disabled-ui' : '';
  const btnDis = disabled ? ' disabled' : '';

  const rowsHtml = visibleRows.map((r) => {
    const isSel = selectedId === r.id;
    const isDragging = showDragDemo && r.id === 'docs';
    const dropBefore = showDragDemo && r.id === 'backend' ? `<div class="drop-line ind1"></div>` : '';
    const indentHtml = r.depth > 0 ? `<span class="cat-indent"><i class="cat-branch"></i></span>` : '';
    const badges =
      (r.builtin ? `<span class="badge"><span class="btxt">${c.builtinBadge}</span></span>` : '') +
      (r.renamed ? `<span class="badge ovr"><span class="btxt">${c.renamedBadge}</span></span>` : '') +
      (isDragging ? `<span class="badge ovr"><span class="btxt">${c.siblingDragBadge}</span></span>` : '');
    return dropBefore +
      `<div class="cat-r${isSel ? ' sel' : ''}${isDragging ? ' dragging' : ''}${disCls}">` +
        `<span class="cat-grip" style="${isDragging ? 'color:var(--accent-text)' : ''}"><svg class="ic s16"><use href="#drag"/></svg></span>` +
        indentHtml +
        `<span class="cat-sw" style="--c:var(${r.c})"></span>` +
        `<div class="cat-name-col">` +
          `<span class="cat-name-txt${r.depth === 0 || isDragging ? ' strong' : ''}">${r.name}</span>` +
          badges +
        `</div>` +
        `<div class="cat-tend-col"><span class="tend-pill">${r.tend}</span></div>` +
        `<div class="cat-rules-col">${c.rulesCount(r.rules)}</div>` +
        `<div class="cat-act-col"><button class="btn compact icon subtle${btnDis}"><svg class="ic s16"><use href="#edit"/></svg></button></div>` +
      `</div>`;
  }).join('');

  let archHtml = '';
  if (!showArchivedExpanded) {
    archHtml = `<div class="arch-sect">` +
      `<div class="arch-toggle">` +
        `<svg class="ic s16" style="color:var(--text-secondary)"><use href="#chev-r"/></svg>` +
        `<span class="strong">${c.archivedCollapsed}</span>` +
        `<span class="arch-hint">${c.archivedCollapsedHint}</span>` +
      `</div>` +
    `</div>`;
  } else {
    archHtml = `<div class="arch-sect">` +
      `<div class="arch-toggle">` +
        `<svg class="ic s16" style="color:var(--text-secondary)"><use href="#chev-d"/></svg>` +
        `<span class="strong">${c.archivedCollapsed}</span>` +
      `</div>` +
      `<div class="infobar">` +
        `<svg class="ic s16 ib-ic"><use href="#info"/></svg>` +
        `<div class="ib-body"><span>${c.archivedExpandedInfo}</span></div>` +
      `</div>` +
      `<div class="cat-r arch-r">` +
        `<span class="cat-sw" style="--c:var(--cat-9)"></span>` +
        `<div class="cat-name-stack">` +
          `<div class="cat-name-line">` +
            `<span class="strong sec">${c.items.archClient}</span>` +
            `<span class="badge dis"><span class="btxt">${c.archivedBadge}</span></span>` +
            `<span class="badge warn"><span class="btxt">${c.archRefBadge}</span></span>` +
            `<span class="tend-pill">${T.tend.focus}</span>` +
          `</div>` +
          `<div class="arch-ref-hint">` +
            `<svg class="ic s16" style="width:14px;height:14px"><use href="#warn"/></svg>` +
            `<span style="flex:1;min-width:140px">${c.archRefHint}</span>` +
            `<span class="arch-ref-link">${c.archRefLink}<svg class="ic s16" style="width:12px;height:12px"><use href="#chev-r"/></svg></span>` +
          `</div>` +
        `</div>` +
        `<button class="btn compact" style="flex:none"><svg class="ic s16"><use href="#restore"/></svg><span>${c.restoreBtn}</span></button>` +

function syncScroll(scrollEl, wrapEl, thumbEl) {
  if (!scrollEl || !wrapEl || !thumbEl) return;
  const overflow = scrollEl.scrollHeight > scrollEl.clientHeight + 1;
  wrapEl.classList.toggle('scrollable', overflow);
  if (!overflow) return;
  const trackH = wrapEl.clientHeight - 8;
  const ratio = scrollEl.clientHeight / scrollEl.scrollHeight;
  const thumbH = Math.max(28, Math.round(trackH * ratio));
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const top = maxScroll > 0 ? Math.round((scrollEl.scrollTop / maxScroll) * (trackH - thumbH)) : 0;
  thumbEl.style.height = thumbH + 'px';
  thumbEl.style.top = top + 'px';
}
