<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Quartz — Extraction &amp; privacy rule editors (M4 V3)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<!--
  Document extraction and privacy rule editors mockup for Quartz (M4 V3).
  Query parameters:
    ?state=extraction | extraction-editor | extraction-regex-error |
           privacy | privacy-editor | privacy-receipt-required |
           privacy-preview-failed | privacy-builtin-override |
           privacy-loosen-confirm | privacy-loading
    &theme=light | dark
    &lang=zh-CN | en | en-XA
    &size=min          (optional: 640x480 minimum window per 07 §2.3; default 1280x800)
-->
<style>
/* Minimum window 640x480 (Compact breakpoint per 07 §2.1 & §2.3) */
html[data-size="min"],
html[data-size="min"] body,
html[data-size="min"] .window{width:640px;height:480px}

.wrap{position:relative;overflow:hidden}
.main-wrap{position:relative;flex:1;min-width:0;display:flex}
.main{position:relative;padding:var(--space-xxl) var(--space-xxl) var(--space-l);gap:var(--space-s);overflow-y:auto;overflow-x:hidden}
html[data-has-panel="true"] .main{padding:var(--space-xl) var(--space-l) var(--space-l)}
html[data-size="min"] .main{padding:var(--space-l) var(--space-l) var(--space-l)}

/* Fluent 2 overlay scrollbar indicator (11 §9.2) */
.scroll-track{
  display:none;
  position:absolute;top:var(--space-xs);right:var(--space-xs);bottom:var(--space-xs);
  width:6px;pointer-events:none;z-index:8;
}
.scrollable > .scroll-track{display:block}
.scroll-thumb{
  position:absolute;left:1px;right:1px;top:0;
  border-radius:var(--radius-control);
  background:var(--text-tertiary);
}

/* Nav text stays single-line with ellipsis in en-XA */
.nav-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Page header & pivot — content-driven wrapping for en-XA and 640x480 */
.page-head{
  flex:none;
  display:flex;align-items:center;flex-wrap:wrap;
  gap:var(--space-s);
  min-height:40px;
}
.page-head .h-title{flex:1;min-width:140px}
.page-head-acts{display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}

.pivot{
  height:auto;min-height:32px;
  gap:var(--space-l);row-gap:var(--space-xs);
  flex-wrap:wrap;
}
.pivot div{height:32px;white-space:nowrap}
html[data-size="min"] .pivot{gap:var(--space-m);row-gap:0}

/* Flexible buttons & badges safe for en-XA */
.badge{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:3px}
.badge .btxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:var(--h-control-standard);height:auto;padding:4px 12px}
.btn.compact{min-height:var(--h-control-compact);height:auto;padding:2px 10px}
.btn.icon{width:var(--h-control-standard);height:var(--h-control-standard);padding:0}
.btn.compact.icon{width:var(--h-control-compact);height:var(--h-control-compact);padding:0}

/* Workspace split: rule-set tree + entries list (reused from V1) */
.rules-grid{
  flex:1;min-height:0;
  display:flex;align-items:stretch;gap:var(--space-s);
  margin-top:var(--space-xs);
}
.tree-card{
  width:256px;flex:none;
  padding:var(--space-m);
  display:flex;flex-direction:column;gap:var(--space-xs);
  align-self:flex-start;
  max-height:100%;overflow:hidden;
}
html[data-has-panel="true"] .tree-card{width:228px}
.list-card{
  flex:1;min-width:0;
  padding:var(--space-m) var(--space-m) var(--space-s);
  display:flex;flex-direction:column;gap:var(--space-xs);
  align-self:flex-start;
  max-height:100%;overflow:hidden;
}
html[data-size="min"] .rules-grid{flex-direction:column;flex:none}
html[data-size="min"] .tree-card,
html[data-size="min"] .list-card{width:100%;max-height:none}

/* Tree node refinements */
.tree-head{display:flex;align-items:center;gap:var(--space-s);padding:0 var(--space-xs) var(--space-xs)}
.tnode{min-height:48px;padding:6px 8px;gap:6px}
.tnode.ind1{margin-left:14px}
.tnode.disabled-ui{opacity:.6}
.tnode .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px;min-width:0;max-width:100%}
.tnode .sw{flex:none}
.tnode .lock-ic{width:12px;height:12px;color:var(--text-tertiary);flex:none}
.tree-foot-note{
  margin-top:4px;
  padding:6px 8px;
  border-radius:var(--radius-control);
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  font:var(--type-caption);color:var(--text-secondary);
  overflow-wrap:anywhere;
}

/* List toolbar */
.list-toolbar{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:var(--space-s);
  padding:0 var(--space-xs) var(--space-xs);
}
.list-toolbar .seg{flex:none}
.list-toolbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}
.list-meta{
  display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-s);
  padding:0 var(--space-xs) var(--space-xs);
  font:var(--type-caption);color:var(--text-secondary);
}
.list-meta .link{color:var(--accent-text);margin-left:auto;white-space:nowrap}

/* Entries tables (extraction & privacy) */
.rtbl-h,.rtbl-r{
  display:flex;align-items:center;gap:var(--space-s);
  min-height:36px;
  padding:5px var(--space-s);
  border-radius:var(--radius-control);
}
.rtbl-h{
  min-height:var(--h-row-compact);
  padding:4px var(--space-s);
  font:var(--type-caption);color:var(--text-secondary);
  border-bottom:1px solid var(--stroke-divider);
  border-radius:0;
}
.rtbl-r{position:relative}
.rtbl-r.sel{background:var(--fill-subtle-hover)}
.rtbl-r.sel::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:2px;background:var(--accent-fill);
}
.rtbl-r.dim{color:var(--text-secondary)}
.rtbl-r.dim .lbl{text-decoration:line-through}

.col-rule{flex:1;min-width:110px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.col-rule-top{display:flex;align-items:center;gap:5px;min-width:0}
.col-rule-top .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-rule-sub{font:var(--type-caption);color:var(--text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.col-cond{flex:0 0 184px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:11.5px;line-height:16px;color:var(--text-secondary)}
.col-fields{flex:0 0 188px;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:3px;justify-content:flex-end}
.col-act{flex:0 0 124px;min-width:0;display:flex;align-items:center;gap:4px}
.col-src{flex:0 0 126px;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;font:var(--type-caption);color:var(--text-secondary)}

html[data-has-panel="true"] .col-cond{flex:0 0 132px}
html[data-has-panel="true"] .col-fields{flex:0 0 138px}
html[data-has-panel="true"] .col-act{flex:0 0 96px}
html[data-has-panel="true"] .col-src{display:none}
html[data-lang="en-XA"] .col-act{flex:0 0 144px}
html[data-has-panel="true"][data-lang="en-XA"] .col-fields{flex:0 0 116px}
html[data-has-panel="true"][data-lang="en-XA"] .col-act{flex:0 0 118px}
html[data-size="min"] .col-cond{flex:0 0 124px}
html[data-size="min"] .col-fields{flex:0 0 122px}
html[data-size="min"] .col-src{display:none}

.field-tag{
  display:inline-flex;align-items:center;height:18px;padding:0 5px;
  border-radius:var(--radius-control);
  background:var(--fill-subtle-hover);
  border:1px solid var(--stroke-card);
  font-family:var(--font-mono);font-size:11px;line-height:14px;
  color:var(--text-primary);white-space:nowrap;
}
.field-tag.muted{color:var(--text-tertiary);background:transparent}
.field-tag.ok{color:var(--status-success);background:var(--status-success-bg);border-color:color-mix(in srgb,var(--status-success) 24%,transparent)}
.field-tag.warn{color:var(--status-caution);background:var(--status-caution-bg);border-color:color-mix(in srgb,var(--status-caution) 24%,transparent)}
.field-tag.crit{color:var(--status-critical);background:var(--status-critical-bg);border-color:color-mix(in srgb,var(--status-critical) 24%,transparent)}

.fallback-foot{
  margin-top:4px;
  padding:6px var(--space-s);
  border-top:1px solid var(--stroke-divider);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font:var(--type-caption);color:var(--text-tertiary);
}

/* Inline banners (InfoBars, reused from V1) */
.infobar{
  flex:none;
  padding:6px 10px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;align-items:flex-start;gap:var(--space-s);
  font:var(--type-caption);color:var(--text-secondary);
  overflow-wrap:anywhere;word-break:break-word;
}
.infobar .ib-ic{flex:none;margin-top:1px;color:var(--text-secondary)}
.infobar .ib-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.infobar .ib-title{font:var(--type-body-strong);color:var(--text-primary);font-size:13px;line-height:18px;overflow-wrap:anywhere}
.infobar .ib-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.infobar.caution{
  background:var(--status-caution-bg);
  border-color:color-mix(in srgb,var(--status-caution) 28%,transparent);
  color:var(--text-primary);
}
.infobar.caution .ib-ic{color:var(--status-caution)}
.infobar.critical{
  background:var(--status-critical-bg);
  border-color:color-mix(in srgb,var(--status-critical) 28%,transparent);
  color:var(--text-primary);
}
.infobar.critical .ib-ic{color:var(--status-critical)}

/* Static skeleton primitives (zero looping animation per 07 §9 & 11 §1) */
.skel{
  display:inline-block;border-radius:var(--radius-control);
  background:color-mix(in srgb,var(--text-tertiary) 18%,transparent);
}
.skel.soft{background:var(--fill-subtle-hover)}
.seg.dim{opacity:.55}

/* Right-hand panel (360px, reused from V1 & V2) */
.panel-scrim{
  display:none;
  position:absolute;inset:0;
  background:color-mix(in srgb,var(--fill-smoke) 42%,transparent);
  z-index:15;
}
.details{
  width:var(--w-details);flex:none;
  border-left:1px solid var(--stroke-divider);
  padding:0;gap:0;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:transparent;
}
html[data-size="min"][data-panel-open="true"] .panel-scrim{display:block}
html[data-size="min"] .details{
  position:absolute;top:0;right:0;bottom:0;
  width:360px;max-width:calc(100% - 16px);
  background:linear-gradient(var(--fill-layer),var(--fill-layer)),var(--bg-base);
  border-left:1px solid var(--stroke-divider);
  box-shadow:var(--shadow-28);
  z-index:20;
}

.ed-head{
  flex:none;
  padding:9px var(--space-l);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:flex-start;gap:var(--space-s);
}
.ed-head-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ed-head-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.ed-body-wrap{position:relative;flex:1;min-height:0;display:flex}
.ed-body{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:8px var(--space-l) 8px;
  display:flex;flex-direction:column;gap:6px;
}

/* Single-row pinned footer (V2 overflow pattern — NEVER wraps) */
.ed-foot-banner{
  flex:none;
  padding:5px var(--space-l);
  border-top:1px solid color-mix(in srgb,var(--status-caution) 26%,transparent);
  background:var(--status-caution-bg);
  display:flex;align-items:center;gap:6px;
  font:var(--type-caption);color:var(--text-primary);
}
.ed-foot-banner svg{flex:none;color:var(--status-caution)}
.ed-foot-banner span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ed-foot{
  flex:none;
  padding:8px var(--space-l);
  border-top:1px solid var(--stroke-divider);
  display:flex;align-items:center;flex-wrap:nowrap;gap:6px;
}
.ed-foot-main{
  flex:1;min-width:0;
  display:flex;align-items:center;flex-wrap:nowrap;gap:6px;
}
.ed-foot-main .btn{
  padding:4px 10px;
  min-width:0;max-width:100%;
  overflow:hidden;
}
.ed-foot-main .btn.primary-slot{flex:0 1 auto}
.ed-foot-main .btn:not(.primary-slot){flex:0 0 auto}
.ed-foot-main .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-foot-copy,.ed-foot-more{flex:0 0 auto;margin-left:auto}

/* Form controls inside editor */
.ed-row{display:flex;gap:var(--space-s);align-items:flex-end}
.ed-row.flex-wrap{flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>label{font:var(--type-caption);color:var(--text-secondary);display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.input{min-width:0}
.input.focused{
  border-color:var(--stroke-control);
  border-bottom:2px solid var(--accent-fill);
}
.input.invalid{
  border-color:var(--status-critical);
  border-bottom:2px solid var(--status-critical);
}
.input.disabled{
  background:var(--fill-control-disabled);
  border-color:var(--stroke-control);
  color:var(--text-disabled);
}
.caret{
  display:inline-block;width:1.5px;height:13px;
  background:var(--accent-fill);vertical-align:middle;margin-left:1px;flex:none;
}
.field-err{
  display:flex;align-items:flex-start;gap:5px;
  font-size:11.5px;line-height:15px;color:var(--status-critical);
  overflow-wrap:anywhere;
}
.field-err svg{flex:none;margin-top:1px}
.field-hint{font:var(--type-caption);color:var(--text-tertiary);overflow-wrap:anywhere}

/* Multi-line monospace regex editor */
.mono-area{
  padding:5px 8px;
  border-radius:var(--radius-control);
  background:var(--fill-control);
  border:1px solid var(--stroke-control);
  border-bottom-color:var(--stroke-control-strong);
  font-family:var(--font-mono);font-size:11.5px;line-height:15px;
  color:var(--text-primary);
  overflow-wrap:anywhere;word-break:break-all;
  min-height:36px;
}
.mono-area.invalid{
  border-color:var(--status-critical);
  border-bottom:2px solid var(--status-critical);
  background:color-mix(in srgb,var(--status-critical-bg) 28%,var(--fill-control));
}
.mono-area .err-hl{
  background:var(--status-critical-bg);
  color:var(--status-critical);
  border-bottom:1.5px solid var(--status-critical);
  border-radius:2px;
  padding:0 1px;
}
.mono-area .cap-hl{
  color:var(--accent-text);
  font-weight:600;
}
.diag-list{
  display:flex;flex-direction:column;gap:3px;
  margin-top:2px;
}

/* Capture outputs compact 2x2 table */
.cap-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:4px;
}
.cap-cell{
  display:flex;align-items:center;justify-content:space-between;gap:4px;
  padding:4px 7px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  min-width:0;
}
.cap-cell.bad{
  grid-column:1 / -1;
  border-color:color-mix(in srgb,var(--status-critical) 35%,transparent);
  background:color-mix(in srgb,var(--status-critical-bg) 42%,var(--fill-card-secondary));
}
.cap-cell-l{display:flex;flex-direction:column;min-width:0}
.cap-name{font-family:var(--font-mono);font-size:11.5px;line-height:14px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-desc{font-size:10.5px;line-height:13px;color:var(--text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-state{flex:none;max-width:56%}

/* Inline test title box */
.test-box{
  padding:5px 7px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:4px;
}
.test-box.paused{opacity:.76}
.test-out{
  display:flex;align-items:center;flex-wrap:wrap;gap:4px;
  font:var(--type-caption);
}

/* Condition row card (reused from V1) */
.cond-list{display:flex;flex-direction:column;gap:5px}
.cond-row{
  padding:5px 7px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:4px;
}
.cond-line{display:flex;align-items:center;gap:4px;min-width:0}
.neg-btn{
  height:var(--h-control-compact);
  padding:0 7px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-control);
  background:var(--fill-control);
  font:var(--type-caption);color:var(--text-secondary);
  white-space:nowrap;
}

/* Order stepper */
.order-ctrl{display:flex;align-items:center;gap:4px;height:var(--h-control-compact)}
.order-pos{font:var(--type-caption);color:var(--text-secondary);white-space:nowrap;padding:0 3px}

/* Full-width segmented controls inside 360px panel */
.full-seg{width:100%;display:flex;height:auto;min-height:var(--h-control-compact)}
.full-seg div{flex:1 1 0;min-width:0;padding:1px 6px;display:block;text-align:center;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Per-field privacy actions grid */
.act-grid{
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  overflow:hidden;
}
.act-row{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:4px 8px;
  border-top:1px solid var(--stroke-divider);
}
.act-row:first-child{border-top:none}
.act-field{display:flex;align-items:baseline;gap:5px;min-width:0}
.act-field .af-lbl{font:var(--type-caption);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-field .af-key{font-family:var(--font-mono);font-size:11px;line-height:14px;color:var(--text-tertiary);flex:none}
.act-seg{flex:none}
.act-seg div{padding:0 8px}

/* Read-only target card & destination box (privacy-builtin-override) */
.target-card{
  padding:7px 9px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:4px;
}
.dest-row{
  padding:6px 8px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card);
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
  font:var(--type-caption);
}
.dest-link{color:var(--accent-text);white-space:nowrap}

/* Live preview card */
.prev-card{
  padding:7px 8px;
  border-radius:var(--radius-overlay);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:5px;
}
.prev-head{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.prev-head .strong{flex:1;min-width:92px}
.prev-content.stale{opacity:.52}
.prev-metrics{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px;
}
.prev-metric{
  padding:4px 6px;
  border-radius:var(--radius-control);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:1px;
  min-width:0;
}
.prev-metric .pm-lbl{display:flex;align-items:center;gap:4px;font:var(--type-caption);color:var(--text-secondary)}
.prev-metric .pm-dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--status-neutral)}
.prev-metric.eff .pm-dot{background:var(--status-success)}
.prev-metric.warn .pm-dot{background:var(--status-caution)}
.prev-metric .pm-val{font:var(--type-body-strong);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev-metric .pm-sub{font-size:11px;line-height:14px;color:var(--text-tertiary);overflow-wrap:anywhere}

.prev-summary-line{
  padding:4px 7px;
  border-radius:var(--radius-control);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  font:var(--type-caption);color:var(--text-primary);
  overflow-wrap:anywhere;
}
.prev-samples-hdr{
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
  padding-top:3px;border-top:1px solid var(--stroke-divider);
  font:var(--type-caption);color:var(--text-secondary);
}

/* Extraction before/after sample card */
.ba-sample{
  padding:4px 6px;
  border-radius:var(--radius-control);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:2px;

function ringSvg(cls, trackVar = 'var(--stroke-control-strong)', arcVar = 'var(--accent-fill)') {
  return `<svg class="${cls}" viewBox="0 0 28 28" aria-hidden="true">` +
    `<circle cx="14" cy="14" r="10.5" fill="none" stroke="${trackVar}" stroke-width="3"/>` +
    `<path d="M14 3.5 A10.5 10.5 0 0 1 24.5 14" fill="none" stroke="${arcVar}" stroke-width="3" stroke-linecap="round"/>` +
    `</svg>`;
}

function renderNav() {
  const nav = document.getElementById('nav');
  const isRail = isMin || hasPanel;
  if (isRail) nav.classList.add('rail');
  const menuRow = isMin
    ? `<div style="height:4px;flex:none"></div>`
    : `<div class="nav-item" style="margin-top:4px"><svg class="ic"><use href="#menu"/></svg></div>`;
  nav.innerHTML =
    menuRow +
    `<div class="nav-item"><i class="ind"></i><svg class="ic"><use href="#today"/></svg><span>${T.nav.today}</span></div>` +
    `<div class="nav-item"><i class="ind"></i><svg class="ic"><use href="#week"/></svg><span>${T.nav.week}</span></div>` +
    `<div class="nav-item selected"><i class="ind"></i><svg class="ic"><use href="#tag-f"/></svg><span>${T.nav.rules}</span></div>` +
    `<div class="spacer"></div>` +
    `<div class="bottom"><div class="nav-item"><i class="ind"></i><svg class="ic"><use href="#gear"/></svg><span>${T.nav.settings}</span></div></div>`;
}

function renderHeaderAndPivot({ disabled = false, loadingBadge = false } = {}) {
  const dis = disabled ? ' disabled' : '';
  const qBadge = loadingBadge
    ? `<span class="skel soft" style="width:18px;height:16px"></span>`
    : `<span class="badge">7</span>`;
  return `<div class="page-head">` +
    `<span class="h-title ell">${T.page.title}</span>` +
    `<div class="page-head-acts">` +
      `<button class="btn${dis}"><svg class="ic s16"><use href="#import"/></svg><span>${T.page.importBtn}</span></button>` +
      `<button class="btn${dis}"><svg class="ic s16"><use href="#export"/></svg><span>${T.page.exportBtn}</span></button>` +
    `</div>` +
  `</div>` +
  `<div class="pivot">` +
    `<div>${T.page.tabs.categories}</div>` +
    `<div>${T.page.tabs.rules}</div>` +
    `<div>${T.page.tabs.queue}${qBadge}</div>` +
    `<div${isExtractionTab ? ' class="on"' : ''}>${T.page.tabs.extraction}</div>` +
    `<div${!isExtractionTab ? ' class="on"' : ''}>${T.page.tabs.privacy}</div>` +
  `</div>`;

            `<span class="sec">${p.ovrDestLbl}: <span class="strong" style="color:var(--text-primary)">${p.ovrDestVal}</span></span>` +
            `<span class="dest-link">${p.ovrOtherSet}</span>` +
          `</div>` +
          `<div class="prev-card">` +
            `<div class="prev-head">` +
              `<span class="strong">${p.previewTitle}</span>` +
              `<span class="badge ok"><svg class="ic s16" style="width:11px;height:11px"><use href="#check"/></svg><span class="btxt">${p.receiptOkOverride}</span></span>` +
            `</div>` +
            `<div class="prev-summary-line">${p.ovrSummaryZero}</div>` +
            `<div class="cap sec" style="overflow-wrap:anywhere">${p.ovrZeroNote}</div>` +
            `<div class="prev-samples-hdr"><span>${p.ovrSampleHdr}</span></div>` +
            p.ovrSamples.map(s =>
              `<div class="psample-row">` +
                `<span class="psample-time">${s.time}</span>` +
                `<span class="psample-app">${s.app}</span>` +
                `<span class="badge"><span class="btxt">${s.badge}</span></span>` +
                `<span class="psample-dur">${s.dur}</span>` +
              `</div>`
            ).join('') +
            `<div class="cap ter" style="overflow-wrap:anywhere">${p.ovrSampleNote}</div>` +
          `</div>` +
        `</div>` +
        `<div class="scroll-track" aria-hidden="true"><div class="scroll-thumb" id="ed-thumb"></div></div>` +
      `</div>` +
      renderFooter({ primaryLabel: p.ovrSaveBtn, primaryDisabled: false });
    return;
  }

  let topBanner = '';
  if (isRecomputing) {
    topBanner =
      `<div class="infobar caution" role="status">` +
        `<span style="flex:none;margin-top:1px">${ringSvg('ring-xs')}</span>` +
        `<div class="ib-body">` +
          `<div class="ib-title">${p.receiptBannerTitle}</div>` +
          `<div>${p.receiptBannerMsg}</div>` +
          `<div class="mono" style="color:var(--text-secondary);margin-top:1px">preview_pending · preview_expired (5 min)</div>` +
        `</div>` +
      `</div>`;
  } else if (isFailed) {
    topBanner =
      `<div class="infobar caution" role="alert">` +
        `<svg class="ic s16 ib-ic"><use href="#warn"/></svg>` +
        `<div class="ib-body">` +
          `<div class="ib-title">${p.failedBannerTitle}</div>` +
          `<div>${p.failedBannerMsg}</div>` +
          `<div class="mono" style="color:var(--text-secondary);margin-top:1px">error_code: busy · preview_required</div>` +
          `<div class="ib-acts">` +
            `<button class="btn compact"><svg class="ic s16"><use href="#refresh"/></svg><span>${p.retryBtn}</span></button>` +
          `</div>` +
        `</div>` +
      `</div>`;
  }

  let previewHeadRight = `<span class="badge ok"><svg class="ic s16" style="width:11px;height:11px"><use href="#check"/></svg><span class="btxt">${p.receiptOk}</span></span>`;
  if (isRecomputing) {
    previewHeadRight = `<span class="row gap4 cap" style="color:var(--accent-text)">${ringSvg('ring-xs')}<span>${p.recomputingBadge}</span></span>`;
  } else if (isFailed) {
    previewHeadRight =
      `<span class="badge warn"><span class="btxt">${p.failedBadge}</span></span>` +
      `<button class="btn compact"><svg class="ic s16"><use href="#refresh"/></svg><span>${p.retryShort}</span></button>`;
  }

  const previewFailNote = isFailed
    ? `<div class="prev-fail-bar"><svg class="ic s16" style="width:14px;height:14px"><use href="#warn"/></svg><span>${p.failedStaleNote}</span></div>`
    : '';

  const footerLockBanner = isBlocked
    ? `<div class="ed-foot-banner"><svg class="ic s16" style="width:14px;height:14px"><use href="#lock"/></svg><span>${isFailed ? p.failedFooterLock : p.receiptFooterLock}</span></div>`
    : '';

  const panel = document.getElementById('details');
  panel.style.display = 'flex';
  panel.innerHTML =
    `<div class="ed-head">` +
      `<div class="ed-head-txt">` +
        `<div class="ed-head-title"><span class="strong">${p.edTitle}</span><span class="badge add">${c.badgeAdd}</span></div>` +
        `<div class="cap sec ell mono">user.local.privacy/outlook-hide-title</div>` +
      `</div>` +
      `<button class="btn subtle icon compact"><svg class="ic s16"><use href="#close"/></svg></button>` +
    `</div>` +
    `<div class="ed-body-wrap" id="ed-body-wrap">` +
      `<div class="ed-body" id="ed-body">` +
        topBanner +
        `<div class="field"><label>${p.edNameLabel}</label><div class="input std"><span class="ell">${p.edNameVal}</span></div></div>` +
        `<div class="field">` +
          `<label><span>${p.condsLabel}</span><div class="seg"><div class="on">${c.matchAll}</div><div>${c.matchAny}</div></div></label>` +
          `<div class="cond-list">` +
            `<div class="cond-row">` +
              `<div class="cond-line">` +
                `<span class="neg-btn">${c.negLabel}</span>` +
                `<div class="input grow"><span class="mono grow ell">app.exe_name</span><svg class="ic s16"><use href="#chev-d"/></svg></div>` +
                `<button class="btn compact icon subtle"><svg class="ic s16"><use href="#close"/></svg></button>` +
              `</div>` +
              `<div class="cond-line">` +
                `<div class="input" style="flex:0 0 102px"><span class="mono grow ell">equals</span><svg class="ic s16"><use href="#chev-d"/></svg></div>` +
                `<div class="input grow${isRecomputing ? ' focused' : ''}"><span class="mono ell">outlook.exe</span>${isRecomputing ? '<span class="caret"></span>' : ''}</div>` +
              `</div>` +
            `</div>` +
          `</div>` +
          `<div class="row gap8" style="flex-wrap:wrap"><button class="btn compact"><svg class="ic s16"><use href="#add"/></svg><span>${c.addCond}</span></button><span class="cap ter ell" style="min-width:0;flex:1;text-align:right">${p.condsHint}</span></div>` +
        `</div>` +
        `<div class="field">` +
          `<label>${p.actionsLabel}</label>` +
          `<div class="seg full-seg"><div class="on">${p.presetTitleHidden}</div><div>${p.presetExcluded}</div><div>${p.presetCustom}</div></div>` +
          `<div class="act-grid">` +
            `<div class="act-row">` +
              `<div class="act-field"><span class="af-lbl">${p.fieldAppLbl}</span><span class="af-key">app</span></div>` +
              `<div class="seg act-seg"><div class="on">${p.actKeep}</div><div>${p.actDrop}</div></div>` +
            `</div>` +
            `<div class="act-row">` +
              `<div class="act-field"><span class="af-lbl">${p.fieldTitleLbl}</span><span class="af-key">window_title</span></div>` +
              `<div class="seg act-seg"><div>${p.actKeep}</div><div class="on">${p.actDrop}</div></div>` +
            `</div>` +
          `</div>` +
        `</div>` +
        `<div class="prev-card">` +
          `<div class="prev-head">` +
            `<span class="strong">${p.previewTitle}</span>` +
            previewHeadRight +
          `</div>` +
          previewFailNote +
          `<div class="prev-content${isBlocked ? ' stale' : ''}" style="display:flex;flex-direction:column;gap:5px">` +
            `<div class="prev-summary-line">` +
              `<div style="font-weight:600">${p.summaryMain}</div>` +
              `<div class="ter" style="margin-top:2px">${p.metricSegsSub} · ${p.metricDurSub}</div>` +
            `</div>` +
            `<div class="prev-samples-hdr"><span>${p.samplesHdr}</span></div>` +
            p.samples.map(s =>
              `<div class="psample-row">` +
                `<span class="psample-time">${s.time}</span>` +
                `<span class="psample-app">${s.app}</span>` +
                `<span class="badge${s.idle ? ' dis' : ' warn'}"><span class="btxt">${s.idle ? p.transIdleHidden : p.transFullToHidden}</span></span>` +
                `<span class="psample-dur">${s.dur}</span>` +
              `</div>`
            ).join('') +
            `<div class="cap ter" style="overflow-wrap:anywhere">${p.samplesOmitNote}</div>` +
          `</div>` +
        `</div>` +
        `<div class="history-box">` +
          `<div class="row gap4"><svg class="ic s16" style="width:14px;height:14px;color:var(--text-secondary);flex:none"><use href="#info"/></svg><span class="cap" style="color:var(--text-primary);overflow-wrap:anywhere">${p.futureNote}</span></div>` +
          `<div class="history-row">` +
            `<button class="btn compact disabled"><svg class="ic s16"><use href="#history"/></svg><span>${p.applyHistoryBtn}</span></button>` +
            `<span class="cap ter" style="flex:1;min-width:120px;overflow-wrap:anywhere">${p.historyDisabledHint}</span>` +
          `</div>` +
        `</div>` +
      `</div>` +
      `<div class="scroll-track" aria-hidden="true"><div class="scroll-thumb" id="ed-thumb"></div></div>` +
    `</div>` +
    footerLockBanner +
    renderFooter({ primaryLabel: c.saveBtn, primaryDisabled: isBlocked });
}

function renderLoosenConfirmModal() {
  const m = T.priv.loosen;
  const scrim = document.getElementById('modal-scrim');
  scrim.style.display = 'flex';
  scrim.innerHTML =
    `<div class="modal-dlg" role="dialog" aria-modal="true">` +
      `<div class="modal-head">` +
        `<svg class="ic modal-head-ic"><use href="#warn"/></svg>` +
        `<span class="h-sub grow ell">${m.title}</span>` +
        `<button class="btn subtle icon compact"><svg class="ic s16"><use href="#close"/></svg></button>` +
      `</div>` +
      `<div class="modal-body-wrap" id="modal-body-wrap">` +
        `<div class="modal-body" id="modal-body">` +
          `<div class="modal-desc">${m.desc}</div>` +
          `<div class="impact-box">` +
            `<div class="impact-row">` +
              `<span class="impact-k">${m.changeLbl}</span>` +
              `<div class="impact-v"><div class="impact-tags"><span class="badge warn"><span class="btxt">${m.changeBadge}</span></span></div></div>` +
            `</div>` +
            `<div class="impact-row">` +
              `<span class="impact-k">${m.ruleLbl}</span>` +
              `<div class="impact-v">` +
                `<span class="strong" style="font-size:12px;line-height:16px">${m.ruleVal}</span>` +
                `<span class="mono ter" style="font-size:11px;line-height:14px">builtin.privacy/browser-private-edge</span>` +
              `</div>` +
            `</div>` +
            `<div class="impact-row">` +
              `<span class="impact-k">${m.appsLbl}</span>` +
              `<div class="impact-v"><span class="mono" style="font-size:11.5px;line-height:15px">${m.appsVal}</span></div>` +
            `</div>` +
            `<div class="impact-row">` +
              `<span class="impact-k">${m.fieldsLbl}</span>` +
              `<div class="impact-v">` +
                `<div class="impact-tags"><span class="field-tag warn" style="height:auto;padding:2px 6px;white-space:normal;overflow-wrap:anywhere">${m.fieldTitleDiff}</span></div>` +
                `<span class="ter">${m.fieldAppSame}</span>` +
              `</div>` +
            `</div>` +
            `<div class="impact-row">` +
              `<span class="impact-k">${m.destLbl}</span>` +
              `<div class="impact-v"><span>${m.destVal}</span></div>` +
            `</div>` +
          `</div>` +
          `<div class="modal-note">` +
            `<svg class="ic s16" style="width:14px;height:14px"><use href="#info"/></svg>` +
            `<span>${m.note}</span>` +
          `</div>` +
        `</div>` +
        `<div class="scroll-track" aria-hidden="true"><div class="scroll-thumb" id="modal-thumb"></div></div>` +
      `</div>` +
      `<div class="modal-foot">` +
        `<button class="btn"><span>${m.cancelBtn}</span></button>` +
        `<button class="btn accent"><span>${m.confirmBtn}</span></button>` +
      `</div>` +
    `</div>`;
}

function renderMain() {
  const main = document.getElementById('main');

  switch (stateKey) {
    case 'extraction':
      main.innerHTML =
        renderHeaderAndPivot() +
        `<div class="rules-grid">${renderTreeCard({ kind: 'extraction', selected: 'local' })}${renderExtractionList({ selectedIdx: 0, ownView: false })}</div>`;
      break;
    case 'extraction-editor':
      main.innerHTML =
        renderHeaderAndPivot() +
        `<div class="rules-grid">${renderTreeCard({ kind: 'extraction', selected: 'local' })}${renderExtractionList({ selectedIdx: 0, ownView: true })}</div>`;
      renderExtractionEditor({ isError: false });
      break;
    case 'extraction-regex-error':
      main.innerHTML =
        renderHeaderAndPivot() +
        `<div class="rules-grid">${renderTreeCard({ kind: 'extraction', selected: 'local' })}${renderExtractionList({ selectedIdx: 0, ownView: true })}</div>`;
      renderExtractionEditor({ isError: true });
      break;
    case 'privacy':
      main.innerHTML =
        renderHeaderAndPivot() +
        `<div class="rules-grid">${renderTreeCard({ kind: 'privacy', selected: 'local' })}${renderPrivacyList({ selectedIdx: 0, ownView: false })}</div>`;
      break;
    case 'privacy-editor':
      main.innerHTML =
        renderHeaderAndPivot() +
        `<div class="rules-grid">${renderTreeCard({ kind: 'privacy', selected: 'local' })}${renderPrivacyList({ selectedIdx: 0, ownView: true })}</div>`;
      renderPrivacyEditor({ mode: 'normal' });
      break;
    case 'privacy-receipt-required':
      main.innerHTML =
        renderHeaderAndPivot() +
        `<div class="rules-grid">${renderTreeCard({ kind: 'privacy', selected: 'local' })}${renderPrivacyList({ selectedIdx: 0, ownView: true })}</div>`;
      renderPrivacyEditor({ mode: 'receipt-required' });
      break;
    case 'privacy-preview-failed':
      main.innerHTML =
        renderHeaderAndPivot() +
        `<div class="rules-grid">${renderTreeCard({ kind: 'privacy', selected: 'local' })}${renderPrivacyList({ selectedIdx: 0, ownView: true })}</div>`;
      renderPrivacyEditor({ mode: 'preview-failed' });
      break;
    case 'privacy-builtin-override':
      main.innerHTML =
        renderHeaderAndPivot() +
        `<div class="rules-grid">${renderTreeCard({ kind: 'privacy', selected: 'builtin' })}${renderPrivacyList({ selectedIdx: 2, ownView: false })}</div>`;
      renderPrivacyEditor({ mode: 'builtin-override' });
      break;
    case 'privacy-loosen-confirm':
      main.innerHTML =
        renderHeaderAndPivot() +
        `<div class="rules-grid">${renderTreeCard({ kind: 'privacy', selected: 'builtin' })}${renderPrivacyList({ selectedIdx: 2, ownView: false })}</div>`;
      renderPrivacyEditor({ mode: 'builtin-override' });
      renderLoosenConfirmModal();
      break;
    case 'privacy-loading':
      main.innerHTML =
        renderHeaderAndPivot({ disabled: true, loadingBadge: true }) +
        `<div class="rules-grid">${renderTreeCard({ kind: 'privacy', loading: true })}${renderPrivacyLoading()}</div>`;
      break;
    default:
      main.innerHTML =
        renderHeaderAndPivot() +
        `<div class="rules-grid">${renderTreeCard({ kind: 'extraction', selected: 'local' })}${renderExtractionList({ selectedIdx: 0, ownView: false })}</div>`;
      break;
  }
}

function syncScroll(scrollEl, wrapEl, thumbEl) {
  if (!scrollEl || !wrapEl || !thumbEl) return;
  const overflow = scrollEl.scrollHeight > scrollEl.clientHeight + 1;
  wrapEl.classList.toggle('scrollable', overflow);
  if (!overflow) return;
  const trackH = wrapEl.clientHeight - 8;
  const ratio = scrollEl.clientHeight / scrollEl.scrollHeight;
  const thumbH = Math.max(28, Math.round(trackH * ratio));
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const top = maxScroll > 0 ? Math.round((scrollEl.scrollTop / maxScroll) * (trackH - thumbH)) : 0;
  thumbEl.style.height = thumbH + 'px';
  thumbEl.style.top = top + 'px';
}

renderNav();
renderMain();

const mainEl = document.getElementById('main');
const mainWrapEl = document.getElementById('main-wrap');
const mainThumbEl = document.getElementById('main-thumb');
syncScroll(mainEl, mainWrapEl, mainThumbEl);
mainEl.addEventListener('scroll', () => syncScroll(mainEl, mainWrapEl, mainThumbEl));

const edBody = document.getElementById('ed-body');
const edBodyWrap = document.getElementById('ed-body-wrap');
const edThumb = document.getElementById('ed-thumb');
if (edBody) {
  syncScroll(edBody, edBodyWrap, edThumb);
  edBody.addEventListener('scroll', () => syncScroll(edBody, edBodyWrap, edThumb));
}

const modalBody = document.getElementById('modal-body');
const modalBodyWrap = document.getElementById('modal-body-wrap');
const modalThumb = document.getElementById('modal-thumb');
if (modalBody) {
  syncScroll(modalBody, modalBodyWrap, modalThumb);
  modalBody.addEventListener('scroll', () => syncScroll(modalBody, modalBodyWrap, modalThumb));
}
</script>
