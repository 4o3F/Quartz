<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Quartz — Rule text, version history &amp; three-way comparison (M4 V4)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<!--
  Rule text import/export, version history with diff/rollback, and three-way upstream comparison mockup (M4 V4: H7 / H8 / H9).
  Query parameters:
    ?state=import | import-invalid | import-preview | export |
           history | history-diff | history-revert |
           three-way | three-way-pending | three-way-removed
    &theme=light | dark
    &lang=zh-CN | en | en-XA
    &size=min          (optional: 640x480 minimum window per 07 §2.3; default 1280x800)
-->
<style>
/* Minimum window 640x480 (Compact breakpoint per 07 §2.1 & §2.3) */
html[data-size="min"],
html[data-size="min"] body,
html[data-size="min"] .window{width:640px;height:480px}

.wrap{position:relative;overflow:hidden}
.main-wrap{position:relative;flex:1;min-width:0;display:flex}
.main{position:relative;padding:var(--space-xxl) var(--space-xxl) var(--space-l);gap:var(--space-s);overflow-y:auto;overflow-x:hidden}
html[data-wide-view="true"] .main{padding:10px var(--space-xl) 10px;gap:6px}
html[data-size="min"] .main{padding:var(--space-s) var(--space-m) var(--space-l)}

/* Fluent 2 overlay scrollbar indicator (11 §9.2) */
.scroll-track{
  display:none;
  position:absolute;top:var(--space-xs);right:var(--space-xs);bottom:var(--space-xs);
  width:6px;pointer-events:none;z-index:8;
}
.scrollable > .scroll-track{display:block}
.scroll-thumb{
  position:absolute;left:1px;right:1px;top:0;
  border-radius:var(--radius-control);
  background:var(--text-tertiary);
}

/* Nav text stays single-line with ellipsis in en-XA */
.nav-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Page header & pivot */
.page-head{
  flex:none;
  display:flex;align-items:center;flex-wrap:wrap;
  gap:var(--space-s);
  min-height:40px;
}
.page-head .h-title{flex:1;min-width:140px}
.page-head-acts{display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}

.pivot{
  height:auto;min-height:32px;
  gap:var(--space-l);row-gap:var(--space-xs);
  flex-wrap:wrap;
}
.pivot div{height:32px;white-space:nowrap}
html[data-size="min"] .pivot{gap:var(--space-m);row-gap:0}

/* Flexible buttons & badges safe for en-XA */
.badge{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:3px}
.badge .btxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:var(--h-control-standard);height:auto;padding:4px 12px}
.btn.compact{min-height:var(--h-control-compact);height:auto;padding:2px 10px}
.btn.icon{width:var(--h-control-standard);height:var(--h-control-standard);padding:0}
.btn.compact.icon{width:var(--h-control-compact);height:var(--h-control-compact);padding:0}

/* Workspace split: rule-set tree + list/history card */
.rules-grid{
  flex:1;min-height:0;
  display:flex;align-items:stretch;gap:var(--space-s);
  margin-top:var(--space-xs);
}
.tree-card{
  width:256px;flex:none;
  padding:var(--space-m);
  display:flex;flex-direction:column;gap:var(--space-xs);
  align-self:flex-start;
  max-height:100%;overflow:hidden;
}
.list-card{
  flex:1;min-width:0;
  padding:var(--space-m) var(--space-m) var(--space-s);
  display:flex;flex-direction:column;gap:var(--space-xs);
  align-self:flex-start;
  max-height:100%;overflow:hidden;
}
html[data-size="min"] .rules-grid{flex-direction:column;flex:none}
html[data-size="min"] .tree-card,
html[data-size="min"] .list-card{width:100%;max-height:none}

/* Tree nodes (reused from V1) */
.tree-head{display:flex;align-items:center;gap:var(--space-s);padding:0 var(--space-xs) var(--space-xs)}
.tnode{min-height:48px;padding:6px 8px;gap:6px}
.tnode.ind1{margin-left:14px}
.tnode.ind2{margin-left:28px}
.tnode .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px;min-width:0;max-width:100%}
.tnode .sw{flex:none}
.tnode .lock-ic{width:12px;height:12px;color:var(--text-tertiary);flex:none}

/* List toolbar & background entries table (reused from V1) */
.list-toolbar{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:var(--space-s);
  padding:0 var(--space-xs) var(--space-xs);
}
.list-toolbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}
.list-meta{
  display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-s);
  padding:0 var(--space-xs) var(--space-xs);
  font:var(--type-caption);color:var(--text-secondary);
}
.list-meta .link{color:var(--accent-text);margin-left:auto;white-space:nowrap}

.rtbl-h,.rtbl-r{
  display:flex;align-items:center;gap:var(--space-s);
  min-height:var(--h-row-compact);
  padding:4px var(--space-s);
  border-radius:var(--radius-control);
}
.rtbl-h{
  font:var(--type-caption);color:var(--text-secondary);
  border-bottom:1px solid var(--stroke-divider);
  border-radius:0;
}
.rtbl-r.sel{background:var(--fill-subtle-hover)}
.rtbl-r.dim{color:var(--text-secondary)}
.rtbl-r.dim .lbl{text-decoration:line-through}
.rtbl-name{flex:1;min-width:96px;display:flex;align-items:center;gap:6px;overflow:hidden}
.rtbl-name .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtbl-cat{flex:0 0 auto;min-width:74px;max-width:124px}
.rtbl-prio{flex:0 0 auto;min-width:44px;text-align:right;white-space:nowrap;font:var(--type-caption);color:var(--text-secondary)}
.rtbl-diff{flex:0 0 auto;min-width:60px;display:flex;justify-content:flex-end}

/* Inline banners (InfoBars, reused from V1/V3) */
.infobar{
  flex:none;
  padding:7px 11px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;align-items:flex-start;gap:var(--space-s);
  font:var(--type-caption);color:var(--text-secondary);
  overflow-wrap:anywhere;word-break:break-word;
}
.infobar .ib-ic{flex:none;margin-top:1px;color:var(--text-secondary)}
.infobar .ib-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.infobar .ib-title{font:var(--type-body-strong);color:var(--text-primary);font-size:13px;line-height:18px;overflow-wrap:anywhere}
.infobar .ib-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.infobar.caution{
  background:var(--status-caution-bg);
  border-color:color-mix(in srgb,var(--status-caution) 28%,transparent);
  color:var(--text-primary);
}
.infobar.caution .ib-ic{color:var(--status-caution)}
.infobar.critical{
  background:var(--status-critical-bg);
  border-color:color-mix(in srgb,var(--status-critical) 28%,transparent);
  color:var(--text-primary);
}
.infobar.critical .ib-ic{color:var(--status-critical)}

/* Modal dialogs (Import, Export, Revert confirmation) */
.modal-scrim{
  position:absolute;inset:0;
  background:var(--fill-smoke);
  z-index:30;
  display:flex;align-items:center;justify-content:center;
  padding:var(--space-l);
}
.modal-dlg{
  width:640px;max-width:100%;max-height:100%;
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-64);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.modal-dlg.wide{width:736px}
.modal-dlg.narrow{width:548px}
.modal-head{
  flex:none;
  padding:12px var(--space-xl);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:center;gap:var(--space-s);
}
.modal-head-txt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-body-wrap{position:relative;flex:1;min-height:0;display:flex}
.modal-body{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:10px var(--space-xl);
  display:flex;flex-direction:column;gap:8px;
}
.modal-foot{
  flex:none;
  padding:10px var(--space-xl);
  border-top:1px solid var(--stroke-divider);
  background:var(--fill-card-secondary);
  display:flex;align-items:center;justify-content:flex-end;gap:var(--space-s);flex-wrap:wrap;
}
.modal-foot-left{margin-right:auto;display:flex;align-items:center;gap:6px;min-width:0}

html[data-size="min"] .modal-scrim{padding:var(--space-s)}
html[data-size="min"] .modal-dlg{width:100%;height:100%}
html[data-size="min"] .modal-head{padding:8px 12px}
html[data-size="min"] .modal-body{padding:8px 12px;gap:8px}
html[data-size="min"] .modal-foot{padding:8px 12px;gap:6px}

/* Import drop zone & TOML text box */
.dropzone{
  padding:10px 12px;
  border-radius:var(--radius-control);
  border:1.5px dashed var(--stroke-control-strong);
  background:var(--fill-card-secondary);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.dropzone-ic{
  width:32px;height:32px;border-radius:var(--radius-control);flex:none;
  background:var(--fill-subtle-hover);color:var(--accent-text);
  display:grid;place-items:center;
}
.dropzone-txt{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}

.code-box-wrap{position:relative;display:flex;border-radius:var(--radius-control);border:1px solid var(--stroke-control);border-bottom-color:var(--stroke-control-strong);background:var(--bg-base);overflow:hidden}
.code-box{
  flex:1;min-width:0;
  max-height:212px;overflow-y:auto;overflow-x:hidden;
  padding:8px 10px;
  font-family:var(--font-mono);font-size:11.5px;line-height:17px;
  color:var(--text-primary);
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.code-box.tall{max-height:312px}
.code-box.compact{max-height:112px;font-size:11px;line-height:16px}
.code-ln{display:flex;gap:10px;min-width:0}
.code-lno{width:22px;flex:none;text-align:right;color:var(--text-tertiary);user-select:none}
.code-ltxt{flex:1;min-width:0;overflow-wrap:anywhere}
.tok-sec{color:var(--accent-text);font-weight:600}
.tok-key{color:var(--text-secondary)}
.tok-cmt{color:var(--text-tertiary)}
.tok-err{background:var(--status-critical-bg);color:var(--status-critical);border-radius:2px;padding:0 2px}

/* Detected destination card in import */
.dest-detect{
  padding:9px 12px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:6px;
}
.dest-kv-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.dest-kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.dest-kv .dk{font:var(--type-caption);color:var(--text-secondary)}
.dest-kv .dv{font-family:var(--font-mono);font-size:12px;line-height:16px;color:var(--text-primary);overflow-wrap:anywhere}
.dest-status{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding-top:6px;border-top:1px solid var(--stroke-divider);
}
html[data-size="min"] .dest-kv-grid{grid-template-columns:minmax(0,1fr)}

/* Validation diagnostics list (import-invalid) */
.diag-card-list{display:flex;flex-direction:column;gap:6px}
.diag-item{
  padding:8px 10px;
  border-radius:var(--radius-control);
  border:1px solid color-mix(in srgb,var(--status-critical) 30%,transparent);
  background:color-mix(in srgb,var(--status-critical-bg) 28%,var(--fill-card-secondary));
  display:flex;flex-direction:column;gap:4px;
}
.diag-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.diag-path{font-family:var(--font-mono);font-size:11.5px;line-height:16px;color:var(--text-primary);overflow-wrap:anywhere}
.diag-loc{font-family:var(--font-mono);font-size:11px;line-height:15px;color:var(--text-secondary);margin-left:auto;white-space:nowrap}
.diag-msg{font:var(--type-caption);color:var(--text-primary);overflow-wrap:anywhere}
.diag-params{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.param-pill{
  display:inline-flex;align-items:center;gap:3px;
  padding:1px 6px;border-radius:var(--radius-control);
  background:var(--fill-card);border:1px solid var(--stroke-card);
  font-family:var(--font-mono);font-size:11px;line-height:15px;color:var(--text-secondary);
  max-width:100%;overflow-wrap:anywhere;
}
.inline-note{
  padding:7px 10px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;align-items:flex-start;gap:7px;
  font:var(--type-caption);color:var(--text-secondary);
  overflow-wrap:anywhere;
}
.inline-note svg{flex:none;margin-top:1px;color:var(--text-tertiary)}

/* Rule-level diff rows (import-preview, history-diff, history-revert) */
.sect-hdr{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.sect-badges{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.diff-list{display:flex;flex-direction:column;gap:4px}
.diff-row{
  padding:5px 9px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:2px;
}
.diff-row.add{border-left:3px solid var(--status-success)}
.diff-row.chg{border-left:3px solid var(--accent-fill)}
.diff-row.rem{border-left:3px solid var(--status-critical)}
.diff-row.dis{border-left:3px solid var(--status-neutral)}
.diff-row.same{opacity:.72}
.diff-row-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.diff-row-id{font-family:var(--font-mono);font-size:11px;line-height:15px;color:var(--text-tertiary);overflow-wrap:anywhere}
.diff-paths{display:flex;flex-direction:column;gap:2px;padding-left:2px}
.diff-path-line{
  display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
  font:var(--type-caption);color:var(--text-secondary);
  overflow-wrap:anywhere;
}
.diff-path-k{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
.diff-old{text-decoration:line-through;color:var(--text-tertiary)}
.diff-new{color:var(--text-primary);font-weight:600}

/* Dual-duration impact tiles (reused from V1) + Category deltas */
.prev-metrics{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
html[data-size="min"] .prev-metrics{grid-template-columns:minmax(0,1fr)}
.prev-metric{
  padding:5px 8px;
  border-radius:var(--radius-control);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:1px;
  min-width:0;
}
.prev-metric .pm-lbl{display:flex;align-items:center;gap:5px;font:var(--type-caption);color:var(--text-secondary)}
.prev-metric .pm-dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--status-neutral)}
.prev-metric.eff .pm-dot{background:var(--status-success)}
.prev-metric .pm-val{font:var(--type-body-strong);color:var(--text-primary);overflow-wrap:anywhere}
.prev-metric .pm-sub{font:var(--type-caption);color:var(--text-tertiary);overflow-wrap:anywhere}

.delta-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}
html[data-size="min"] .delta-grid{grid-template-columns:minmax(0,1fr)}
.delta-item{
  padding:4px 8px;
  border-radius:var(--radius-control);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
  font:var(--type-caption);
}
.delta-cat{display:flex;align-items:center;gap:6px;min-width:0}
.delta-cat i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.delta-vals{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--text-secondary)}
.delta-diff{font-weight:600;color:var(--text-primary)}
.delta-diff.up{color:var(--status-success)}
.delta-diff.dn{color:var(--status-caution)}

/* Impact sample rows */
.sample-list{display:flex;flex-direction:column;gap:3px}
.sample-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:4px 7px;
  border-radius:var(--radius-control);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  font:var(--type-caption);
}
.sample-time{flex:none;color:var(--text-tertiary);white-space:nowrap}
.sample-doc{flex:1;min-width:110px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sample-trans{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.sample-dur{flex:none;color:var(--text-secondary);white-space:nowrap}

/* Export controls row */
.export-row{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
html[data-size="min"] .export-row{grid-template-columns:minmax(0,1fr)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font:var(--type-caption);color:var(--text-secondary)}

/* Version History table (history state) */
.hist-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:0 var(--space-xs) var(--space-xs);
  border-bottom:1px solid var(--stroke-divider);
}
.hist-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 10px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
}
.hist-row.sel{
  border-color:var(--accent-fill);
  background:color-mix(in srgb,var(--accent-fill) 6%,var(--fill-card));
}
.hist-chk{
  width:22px;height:22px;border-radius:var(--radius-control);flex:none;margin-top:1px;
  border:1.5px solid var(--stroke-control-strong);
  background:var(--fill-control);
  display:grid;place-items:center;
  font:var(--type-caption);font-weight:600;color:var(--text-secondary);
}
.hist-row.sel .hist-chk{
  border-color:var(--accent-fill);
  background:var(--accent-fill);
  color:var(--text-on-accent);
}
.hist-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hist-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hist-ver{font:var(--type-body-strong);font-family:var(--font-mono);color:var(--text-primary)}
.hist-note{font:var(--type-body);font-size:13px;line-height:18px;color:var(--text-primary);overflow-wrap:anywhere}
.hist-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:var(--type-caption);color:var(--text-tertiary)}
.hist-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:none;align-self:center}

/* Full-width subview header (history-diff, three-way, three-way-removed) */
.subview-head{
  flex:none;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  border-radius:var(--radius-overlay);
}
.subview-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:160px}
.subview-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}

/* Two-version comparison split (history-diff) */
.hdiff-grid{
  display:grid;
  grid-template-columns:minmax(0,44%) minmax(0,1fr);
  gap:var(--space-s);
  align-items:start;
}
html[data-size="min"] .hdiff-grid{
  grid-template-columns:minmax(0,1fr);
}
.hdiff-col{
  display:flex;flex-direction:column;gap:10px;min-width:0;
}
.pager{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding-top:8px;border-top:1px solid var(--stroke-divider);
  font:var(--type-caption);color:var(--text-secondary);
}
.pager-btns{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg-num{
  min-width:24px;height:24px;padding:0 6px;
  border-radius:var(--radius-control);
  display:inline-flex;align-items:center;justify-content:center;
  font:var(--type-caption);color:var(--text-secondary);
  border:1px solid transparent;
}
.pg-num.on{
  background:var(--accent-fill);color:var(--text-on-accent);font-weight:600;
}

/* Privacy preview summary inside revert modal */
.priv-box{
  padding:8px 10px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:6px;
}
.psample-row{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:3px 6px;border-radius:var(--radius-control);
  background:var(--fill-card);border:1px solid var(--stroke-card);
  font:var(--type-caption);
}

/* Three-way upstream comparison (three-way, three-way-pending, three-way-removed) */
.tw-list{display:flex;flex-direction:column;gap:6px}
.tw-entry{
  padding:7px 11px;
  border-radius:var(--radius-overlay);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:5px;
}
.tw-entry.tw-pending{
  border-color:color-mix(in srgb,var(--status-caution) 48%,transparent);
}
.tw-entry.removed{
  border-color:color-mix(in srgb,var(--status-critical) 35%,transparent);
}
.tw-entry-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding-bottom:5px;border-bottom:1px solid var(--stroke-divider);
}
.tw-entry-id{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.tw-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.choice-btn{
  min-height:28px;padding:3px 10px;
  display:inline-flex;align-items:center;gap:6px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-control);
  border-bottom-color:var(--stroke-control-strong);
  background:var(--fill-control);
  font:var(--type-caption);color:var(--text-primary);
  white-space:normal;text-align:left;
}
.choice-btn.sel{
  border-color:var(--accent-fill);
  background:color-mix(in srgb,var(--accent-fill) 14%,var(--fill-card));
  color:var(--accent-text);
  font-weight:600;
}
.choice-btn.sel-danger{
  border-color:var(--status-caution);
  background:var(--status-caution-bg);
  color:var(--status-caution);
  font-weight:600;
}
.choice-dot{
  width:14px;height:14px;border-radius:50%;flex:none;
  border:1.5px solid var(--text-secondary);
  display:grid;place-items:center;
}
.choice-btn.sel .choice-dot{border-color:var(--accent-fill);background:var(--accent-fill)}
.choice-btn.sel .choice-dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--text-on-accent)}

/* Three columns at 1280x800; stacked vertical cards at 640x480 (size=min) so all 3 sides remain simultaneously comparable with zero horizontal scroll */
.tw-cols{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  align-items:stretch;
}
html[data-size="min"] .tw-cols{
  grid-template-columns:minmax(0,1fr);
  gap:8px;
}
.tw-col{
  padding:6px 8px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:4px;
  min-width:0;
}
.tw-col.cur-parent{
  border-color:color-mix(in srgb,var(--status-caution) 36%,transparent);
  background:color-mix(in srgb,var(--status-caution-bg) 22%,var(--fill-card-secondary));
}
.tw-col.user-ovr{
  border-color:color-mix(in srgb,var(--accent-fill) 36%,transparent);
  background:color-mix(in srgb,var(--accent-fill) 5%,var(--fill-card-secondary));
}
.tw-col.gone{
  border:1px dashed color-mix(in srgb,var(--status-critical) 55%,transparent);
  background:color-mix(in srgb,var(--status-critical-bg) 35%,var(--fill-card-secondary));
}
.tw-col-hdr{
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
  padding-bottom:5px;border-bottom:1px solid var(--stroke-divider);
}
.tw-col-step{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:50%;flex:none;
  background:var(--fill-subtle-hover);
  font:var(--type-caption);font-weight:600;color:var(--text-secondary);
}
.tw-kv{display:flex;flex-direction:column;gap:4px;font:var(--type-caption)}
.tw-field{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;overflow-wrap:anywhere}
.tw-k{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);flex:none}
.tw-v{color:var(--text-primary);overflow-wrap:anywhere}
.tw-v.changed{
  background:color-mix(in srgb,var(--status-caution-bg) 75%,transparent);
  color:var(--text-primary);
  padding:0 4px;border-radius:3px;font-weight:600;
}
.tw-v.ovr-hl{
  background:color-mix(in srgb,var(--accent-fill) 14%,transparent);
  color:var(--accent-text);
  padding:0 4px;border-radius:3px;font-weight:600;
}
.tw-cond{
  padding:4px 6px;border-radius:var(--radius-control);
  background:var(--fill-card);border:1px solid var(--stroke-card);
  font-family:var(--font-mono);font-size:11px;line-height:15px;color:var(--text-primary);
  overflow-wrap:anywhere;
}
.tw-cond.added{
  border-color:color-mix(in srgb,var(--status-success) 45%,transparent);
  background:color-mix(in srgb,var(--status-success-bg) 50%,var(--fill-card));
}
.tw-gone-box{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;
  padding:6px 6px;margin:auto 0;
}
.tw-gone-ic{
  width:32px;height:32px;border-radius:50%;
  background:var(--status-critical-bg);color:var(--status-critical);
  display:grid;place-items:center;
}

/* Resolution radio options for three-way-removed */
.res-opts{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
html[data-size="min"] .res-opts{grid-template-columns:minmax(0,1fr)}
.res-card{
  padding:8px 10px;border-radius:var(--radius-control);
  border:1px solid var(--stroke-control);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:5px;
}
.res-card.sel{
  border-color:var(--accent-fill);
  background:color-mix(in srgb,var(--accent-fill) 6%,var(--fill-card));
}
.res-card-top{display:flex;align-items:center;gap:7px}

/* Bottom bar + auto-computed 7-day preview for three-way commit flow */
.tw-foot{
  flex:none;
  padding:8px 11px;
  border-radius:var(--radius-overlay);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:7px;
}
.tw-prev{
  padding:6px 9px;
  border-radius:var(--radius-control);
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:5px;
}
.tw-prev.tw-pending{
  flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--status-caution-bg);
  border-color:color-mix(in srgb,var(--status-caution) 28%,transparent);
}
.tw-prev-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.tw-prev-metrics{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
html[data-size="min"] .tw-prev-metrics{grid-template-columns:minmax(0,1fr)}
.tw-prev-tile{
  padding:4px 8px;
  border-radius:var(--radius-control);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;
  min-width:0;
}
.tw-prev-tile .pt-lbl{
  display:inline-flex;align-items:center;gap:5px;
  font:var(--type-caption);color:var(--text-secondary);
  min-width:0;overflow-wrap:anywhere;
}
.tw-prev-tile .pt-dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--status-neutral)}
.tw-prev-tile.eff .pt-dot{background:var(--status-success)}
.tw-prev-tile .pt-val{
  font:var(--type-body-strong);font-size:13px;line-height:18px;
  color:var(--text-primary);overflow-wrap:anywhere;
}
.tw-foot-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
html[data-size="min"] .subview-head{padding:6px 10px;gap:6px}
.tw-foot-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.tw-foot-btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderCodeLines(lines) {
  return lines.map((ln, idx) =>

  ).join('');
}

    `<div class="card list-card">` +
      `<div class="list-toolbar">` +
        `<div class="seg"><div class="on">${l.segOwn}</div><div>${l.segEff}</div></div>` +
        `<div class="list-toolbar-right">` +
          `<div class="input" style="width:156px"><svg class="ic s16 ter"><use href="#search"/></svg><span class="ph ell">${l.searchPh}</span></div>` +
          `<button class="btn compact accent"><svg class="ic s16"><use href="#add"/></svg><span>${l.addRule}</span></button>` +
        `</div>` +
      `</div>` +
      `<div class="list-meta"><span>${l.ownMeta}</span><span class="link">${l.historyLink}</span></div>` +
      `<div class="rtbl-h"><div class="rtbl-name">${l.colRule}</div><div class="rtbl-cat">${l.colCat}</div><div class="rtbl-prio">${l.colPrio}</div><div class="rtbl-diff">${l.colDiff}</div></div>` +
      rowsHtml +
    `</div>`
  );
}

function renderDiffRows(items, tags) {
  return (
    `<div class="diff-list">` +
      items.map(it => {
        const bCls = it.kind === 'add' ? 'add' : it.kind === 'chg' ? 'ovr' : it.kind === 'rem' ? 'crit' : 'dis';
        const bTxt = tags[it.kind];
        return (
          `<div class="diff-row ${it.kind}">` +
            `<div class="diff-row-top">` +
              `<span class="badge ${bCls}"><span class="btxt">${bTxt}</span></span>` +
              `<span class="strong" style="font-size:13px;line-height:18px;overflow-wrap:anywhere">${it.name}</span>` +
              `<span class="diff-row-id">${it.id}</span>` +
            `</div>` +
            `<div class="diff-paths">` +
              it.lines.map(ln =>
                `<div class="diff-path-line">` +
                  `<span class="diff-path-k">${ln.k}:</span>` +
                  (ln.oldVal ? `<span class="diff-old">${ln.oldVal}</span>` : '') +
                  (ln.oldVal && ln.newVal ? `<span class="ter">→</span>` : '') +
                  (ln.newVal ? `<span class="diff-new">${ln.newVal}</span>` : '') +
                `</div>`
              ).join('') +
            `</div>` +
          `</div>`
        );
      }).join('') +
    `</div>`
  );
}

function renderMain() {
  const main = document.getElementById('main');
  switch (stateKey) {
    case 'import':
      main.innerHTML = renderHeaderAndPivot() + `<div class="rules-grid">${renderTreeCard({ localVer: 'v3' })}${renderBgRulesList()}</div>`;
      renderImportModal();
      break;
    case 'import-invalid':
      main.innerHTML = renderHeaderAndPivot() + `<div class="rules-grid">${renderTreeCard({ localVer: 'v3' })}${renderBgRulesList()}</div>`;
      renderImportInvalidModal();
      break;
    case 'import-preview':
      main.innerHTML = renderHeaderAndPivot() + `<div class="rules-grid">${renderTreeCard({ localVer: 'v3' })}${renderBgRulesList()}</div>`;
      renderImportPreviewModal();
      break;
    case 'export':
      main.innerHTML = renderHeaderAndPivot() + `<div class="rules-grid">${renderTreeCard({ localVer: 'v3' })}${renderBgRulesList()}</div>`;
      renderExportModal();
      break;
    case 'history':
      main.innerHTML = renderHeaderAndPivot() + `<div class="rules-grid">${renderTreeCard()}${renderHistoryCard()}</div>`;
      break;
    case 'history-diff':
      main.innerHTML = renderHeaderAndPivot() + renderHistoryDiffView();
      break;
    case 'history-revert':
      main.innerHTML = renderHeaderAndPivot({ activeTab: 'privacy' }) + `<div class="rules-grid">${renderTreeCard({ privacy: true })}${renderHistoryCard({ privacy: true })}</div>`;
      renderRevertModal();
      break;
    case 'three-way':
      main.innerHTML = renderHeaderAndPivot() + renderThreeWayView();
      break;
    case 'three-way-pending':
      main.innerHTML = renderHeaderAndPivot() + renderThreeWayView({ pending: true });
      break;
    case 'three-way-removed':
      main.innerHTML = renderHeaderAndPivot() + renderThreeWayRemovedView();
      break;
    default:
      main.innerHTML = renderHeaderAndPivot() + `<div class="rules-grid">${renderTreeCard()}${renderBgRulesList()}</div>`;
      renderImportModal();
      break;
  }
}

function syncScroll(scrollEl, wrapEl, thumbEl) {
  if (!scrollEl || !wrapEl || !thumbEl) return;
  const overflow = scrollEl.scrollHeight > scrollEl.clientHeight + 1;
  wrapEl.classList.toggle('scrollable', overflow);
  if (!overflow) return;
  const trackH = wrapEl.clientHeight - 8;
  const ratio = scrollEl.clientHeight / scrollEl.scrollHeight;
  const thumbH = Math.max(28, Math.round(trackH * ratio));
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const top = maxScroll > 0 ? Math.round((scrollEl.scrollTop / maxScroll) * (trackH - thumbH)) : 0;
  thumbEl.style.height = thumbH + 'px';
  thumbEl.style.top = top + 'px';
}
