<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Quartz — Historical privacy cleanup (M4 V8)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<!--
  Historical privacy cleanup mockup for Quartz (M4 V8).
  Query parameters:
    ?state=history-range | history-preview | history-backups | history-confirm |
           history-running | history-failed | history-resumed | history-completed
    &theme=light | dark
    &lang=zh-CN | en | en-XA
    &size=min          (optional: 640x480 minimum window per 07 §2.3; default 1280x800)
-->
<style>
/* Minimum window 640x480 (Compact breakpoint per 07 §2.1 & §2.3) */
html[data-size="min"],
html[data-size="min"] body,
html[data-size="min"] .window{width:640px;height:480px}

.wrap{position:relative;overflow:hidden}
.main-wrap{position:relative;flex:1;min-width:0;display:flex}
.main{position:relative;padding:var(--space-xxl) var(--space-xxl) var(--space-l);gap:var(--space-s);overflow-y:auto;overflow-x:hidden}
html[data-size="min"] .main{padding:var(--space-l)}

/* Fluent 2 overlay scrollbar indicator (11 §9.2) */
.scroll-track{
  display:none;
  position:absolute;top:var(--space-xs);right:var(--space-xs);bottom:var(--space-xs);
  width:6px;pointer-events:none;z-index:8;
}
.scrollable > .scroll-track{display:block}
.scroll-thumb{
  position:absolute;left:1px;right:1px;top:0;
  border-radius:var(--radius-control);
  background:var(--text-tertiary);
}

/* Nav & header primitives (reused from V1/V3) */
.nav-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-head{
  flex:none;display:flex;align-items:center;flex-wrap:wrap;
  gap:var(--space-s);min-height:40px;
}
.page-head .h-title{flex:1;min-width:140px}
.page-head-acts{display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}

.pivot{
  height:auto;min-height:32px;
  gap:var(--space-l);row-gap:var(--space-xs);
  flex-wrap:wrap;
}
.pivot div{height:32px;white-space:nowrap}
html[data-size="min"] .pivot{gap:var(--space-m);row-gap:0}

.badge{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:3px}
.badge .btxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:var(--h-control-standard);height:auto;padding:4px 12px}
.btn.compact{min-height:var(--h-control-compact);height:auto;padding:2px 10px}
.btn.icon{width:var(--h-control-standard);height:var(--h-control-standard);padding:0}
.btn.compact.icon{width:var(--h-control-compact);height:var(--h-control-compact);padding:0}

/* Primary destructive CTA button — high-contrast status.critical fill + text.on_accent */
.btn.destructive{
  background:var(--status-critical);
  border-color:var(--status-critical);
  color:var(--text-on-accent);
  box-shadow:var(--shadow-2);
  font:var(--type-body-strong);
}

/* Privacy rules background workspace (reused from V3) */
.rules-grid{
  flex:1;min-height:0;
  display:flex;align-items:stretch;gap:var(--space-s);
  margin-top:var(--space-xs);
}
.tree-card{
  width:256px;flex:none;
  padding:var(--space-m);
  display:flex;flex-direction:column;gap:var(--space-xs);
  align-self:flex-start;
  max-height:100%;overflow:hidden;
}
.list-card{
  flex:1;min-width:0;
  padding:var(--space-m) var(--space-m) var(--space-s);
  display:flex;flex-direction:column;gap:var(--space-xs);
  align-self:flex-start;
  max-height:100%;overflow:hidden;
}
html[data-size="min"] .rules-grid{flex-direction:column;flex:none}
html[data-size="min"] .tree-card,
html[data-size="min"] .list-card{width:100%;max-height:none}

.tree-head{display:flex;align-items:center;gap:var(--space-s);padding:0 var(--space-xs) var(--space-xs)}
.tnode{min-height:48px;padding:6px 8px;gap:6px}
.tnode.ind1{margin-left:14px}
.tnode .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px;min-width:0;max-width:100%}
.tnode .sw{flex:none}
.tnode .lock-ic{width:12px;height:12px;color:var(--text-tertiary);flex:none}
.tree-foot-note{
  margin-top:4px;padding:6px 8px;border-radius:var(--radius-control);
  background:var(--fill-card-secondary);border:1px solid var(--stroke-card);
  font:var(--type-caption);color:var(--text-secondary);overflow-wrap:anywhere;
}

.list-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-s);padding:0 var(--space-xs) var(--space-xs)}
.list-toolbar .seg{flex:none}
.list-toolbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}
.list-meta{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-s);padding:0 var(--space-xs) var(--space-xs);font:var(--type-caption);color:var(--text-secondary)}

.rtbl-h,.rtbl-r{display:flex;align-items:center;gap:var(--space-s);min-height:36px;padding:5px var(--space-s);border-radius:var(--radius-control)}
.rtbl-h{min-height:var(--h-row-compact);padding:4px var(--space-s);font:var(--type-caption);color:var(--text-secondary);border-bottom:1px solid var(--stroke-divider);border-radius:0}
.rtbl-r{position:relative}
.rtbl-r.sel{background:var(--fill-subtle-hover)}
.rtbl-r.sel::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent-fill)}
.col-rule{flex:1;min-width:110px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.col-rule-top{display:flex;align-items:center;gap:5px;min-width:0}
.col-rule-top .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-rule-sub{font:var(--type-caption);color:var(--text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-cond{flex:0 0 184px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:11.5px;line-height:16px;color:var(--text-secondary)}
.col-act{flex:0 0 124px;min-width:0;display:flex;align-items:center;gap:4px}
.col-src{flex:0 0 126px;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;font:var(--type-caption);color:var(--text-secondary)}
html[data-size="min"] .col-cond{flex:0 0 124px}
html[data-size="min"] .col-src{display:none}

/* Inline InfoBars */
.infobar{
  flex:none;
  padding:8px 12px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card);
  display:flex;align-items:flex-start;gap:10px;
  font:var(--type-caption);color:var(--text-secondary);
  overflow-wrap:anywhere;word-break:break-word;
}
.infobar.subtle{background:var(--fill-card-secondary)}
.infobar .ib-ic{flex:none;margin-top:2px;color:var(--text-secondary)}
.infobar .ib-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.infobar .ib-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.infobar .ib-title{font:var(--type-body-strong);color:var(--text-primary);font-size:13px;line-height:18px;overflow-wrap:anywhere}
.infobar .ib-right{flex:none;display:flex;align-items:center;gap:6px;margin-left:auto;align-self:center}
.infobar.caution{
  background:var(--status-caution-bg);
  border-color:color-mix(in srgb,var(--status-caution) 28%,transparent);
  color:var(--text-primary);
}
.infobar.caution .ib-ic{color:var(--status-caution)}
.infobar.critical{
  background:var(--status-critical-bg);
  border-color:color-mix(in srgb,var(--status-critical) 28%,transparent);
  color:var(--text-primary);
}
.infobar.critical .ib-ic{color:var(--status-critical)}
.infobar.success{
  background:var(--status-success-bg);
  border-color:color-mix(in srgb,var(--status-success) 28%,transparent);
  color:var(--text-primary);
}
.infobar.success .ib-ic{color:var(--status-success)}
.infobar.accent-bar{
  background:var(--fill-card);
  border-color:color-mix(in srgb,var(--accent-fill) 32%,var(--stroke-card));
}
.infobar.accent-bar .ib-ic{color:var(--accent-fill)}

/* Fluent progress ring (static SVG arc per 07 §9 / 11 §1) */
.ring-xs{width:14px;height:14px;display:block;flex:none}
.ring-sm{width:16px;height:16px;display:block;flex:none}

/* Determinate linear Fluent 2 progress bar */
.pbar{
  height:4px;width:100%;border-radius:2px;overflow:hidden;
  background:var(--fill-subtle-hover);
}
.pbar-fill{
  height:100%;border-radius:2px;background:var(--accent-fill);
}
.pbar-fill.ok{background:var(--status-success)}
.pbar-fill.crit{background:var(--status-critical)}

/* Compact horizontal mini phase pills inside Privacy tab InfoBar (history-resumed) */
.mini-phases{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:4px;
}
.mp-item{
  display:inline-flex;align-items:center;gap:4px;
  padding:1px 6px;border-radius:var(--radius-control);
  background:var(--fill-subtle-hover);
  font:var(--type-caption);color:var(--text-tertiary);
  white-space:nowrap;
}
.mp-item.done{color:var(--status-success);background:var(--status-success-bg)}
.mp-item.active{
  color:var(--accent-text);
  background:color-mix(in srgb,var(--accent-fill) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--accent-fill) 32%,transparent);
  font-weight:600;
}
.mp-item.fail{color:var(--status-critical);background:var(--status-critical-bg)}

/* Toolbar anchor tooltip (inside window) for disabled entry during resumed job */
.btn-tip-wrap{position:relative;display:inline-flex;align-items:center}
.inline-tip{
  position:absolute;top:calc(100% + 6px);right:0;
  max-width:260px;padding:6px 9px;
  background:var(--bg-flyout);border:1px solid var(--stroke-surface);
  border-radius:var(--radius-control);box-shadow:var(--shadow-8);
  font:var(--type-caption);color:var(--text-secondary);
  white-space:normal;overflow-wrap:anywhere;z-index:12;
}

/* Modal dialogs (Fluent 2 overlay tokens, reused from V3/V4) */
.modal-scrim{
  position:absolute;inset:0;
  background:var(--fill-smoke);
  z-index:30;
  display:flex;align-items:center;justify-content:center;
  padding:var(--space-l);
}
.modal-dlg{
  width:656px;max-width:100%;max-height:100%;
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-64);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.modal-head{
  flex:none;
  padding:12px var(--space-xl);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:center;gap:var(--space-s);
}
.modal-head-txt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-head-ic{flex:none}
.modal-head-ic.warn{color:var(--status-caution)}
.modal-head-ic.crit{color:var(--status-critical)}
.modal-head-ic.ok{color:var(--status-success)}
.modal-head-ic.accent{color:var(--accent-fill)}

/* 4-step wizard bar */
.wiz-steps{
  flex:none;
  display:flex;align-items:center;gap:6px;
  padding:8px var(--space-xl);
  border-bottom:1px solid var(--stroke-divider);
  background:var(--fill-card-secondary);
}
.wiz-step{
  flex:1;min-width:0;
  display:flex;align-items:center;gap:6px;
  font:var(--type-caption);color:var(--text-tertiary);
}
.wiz-step .ws-num{
  width:18px;height:18px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  background:var(--fill-subtle-hover);
  border:1px solid var(--stroke-control-strong);
  font-size:11px;font-weight:600;color:var(--text-secondary);
}
.wiz-step .ws-lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiz-step.active{color:var(--text-primary);font-weight:600}
.wiz-step.active .ws-num{
  background:var(--accent-fill);border-color:var(--accent-fill);
  color:var(--text-on-accent);
}
.wiz-step.done{color:var(--text-secondary)}
.wiz-step.done .ws-num{
  background:var(--status-success-bg);
  border-color:color-mix(in srgb,var(--status-success) 35%,transparent);
  color:var(--status-success);
}
.wiz-sep{width:12px;height:1px;background:var(--stroke-divider);flex:none}

.modal-body-wrap{position:relative;flex:1;min-height:0;display:flex}
.modal-body{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:10px var(--space-xl);
  display:flex;flex-direction:column;gap:8px;
}

/* Strictly single-row pinned footer (never wraps to 2 rows, even in en-XA / 640x480) */
.modal-foot{
  flex:none;
  padding:10px var(--space-xl);
  border-top:1px solid var(--stroke-divider);
  background:var(--fill-card-secondary);
  display:flex;align-items:center;flex-wrap:nowrap;gap:8px;
}
.modal-foot-left{
  display:flex;align-items:center;flex-wrap:nowrap;gap:6px;
  margin-right:auto;min-width:0;flex:0 1 auto;
}
.modal-foot-right{
  display:flex;align-items:center;flex-wrap:nowrap;gap:8px;
  min-width:0;flex:0 1 auto;
}
.modal-foot .btn{min-width:0;max-width:100%;overflow:hidden}
.modal-foot .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

html[data-size="min"] .modal-scrim{padding:var(--space-s)}
html[data-size="min"] .modal-dlg{width:100%;height:100%}
html[data-size="min"] .modal-head{padding:8px 12px}
html[data-size="min"] .wiz-steps{padding:6px 12px;gap:4px}
html[data-size="min"] .wiz-sep{width:6px}
html[data-size="min"] .modal-body{padding:9px 12px;gap:8px}
html[data-size="min"] .modal-foot{padding:8px 12px;gap:6px}
html[data-size="min"] .modal-foot .btn{padding:4px 9px}

/* Content cards inside modal */
.box{
  padding:9px 11px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:6px;
}
.box.surface{background:var(--fill-card)}
.sect-hdr{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex-wrap:wrap;
}
.sect-title{font:var(--type-body-strong);font-size:13px;line-height:18px;color:var(--text-primary)}

/* Step 1: Range presets & custom date grid */
.preset-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
}
.preset-btn{
  padding:7px 9px;border-radius:var(--radius-control);
  background:var(--fill-control);
  border:1px solid var(--stroke-control);
  border-bottom-color:var(--stroke-control-strong);
  display:flex;flex-direction:column;gap:2px;min-width:0;
}
.preset-btn .pb-t{font:var(--type-body-strong);font-size:13px;line-height:18px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset-btn .pb-s{font:var(--type-caption);color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset-btn.on{
  background:color-mix(in srgb,var(--accent-fill) 10%,var(--fill-card));
  border-color:var(--accent-fill);
  box-shadow:inset 0 0 0 1px var(--accent-fill);
}
.preset-btn.on .pb-t{color:var(--accent-text)}

.date-pair{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.utc-pill{
  padding:5px 8px;border-radius:var(--radius-control);
  background:var(--bg-base);border:1px solid var(--stroke-card);
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  font:var(--type-caption);color:var(--text-secondary);
}

/* Snapshot rules chips */
.snap-meta{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font:var(--type-caption);color:var(--text-secondary);
}
.rule-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 7px;border-radius:var(--radius-control);
  background:var(--fill-card);border:1px solid var(--stroke-card);
  font:var(--type-caption);color:var(--text-primary);
  max-width:100%;
}

/* Preview loading row */
.scan-bar{
  padding:8px 10px;border-radius:var(--radius-control);
  border:1px solid color-mix(in srgb,var(--accent-fill) 28%,var(--stroke-card));
  background:color-mix(in srgb,var(--accent-fill) 6%,var(--fill-card));
  display:flex;align-items:center;gap:10px;
}
.scan-bar-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.scan-link{color:var(--accent-text);font:var(--type-caption);white-space:nowrap;flex:none}

/* Step 2: Impact KPIs, per-rule breakdown, privacy-safe samples */
.kpi-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.kpi-tile{
  padding:8px 10px;border-radius:var(--radius-control);
  background:var(--fill-card);border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:2px;min-width:0;
}
.kpi-lbl{display:flex;align-items:center;gap:5px;font:var(--type-caption);color:var(--text-secondary)}
.kpi-dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--status-caution)}
.kpi-dot.ok{background:var(--status-success)}
.kpi-dot.neu{background:var(--status-neutral)}
.kpi-val{font:var(--type-subtitle);font-size:18px;line-height:24px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-sub{font-size:11px;line-height:15px;color:var(--text-tertiary);overflow-wrap:anywhere}

.rule-break-row{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-radius:var(--radius-control);
  background:var(--fill-card);border:1px solid var(--stroke-card);
}
.rbr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rbr-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rbr-stats{flex:none;text-align:right;font:var(--type-caption);color:var(--text-primary);white-space:nowrap}
.rbr-stats-sub{font-size:11px;line-height:14px;color:var(--text-tertiary)}

.psample-list{display:flex;flex-direction:column;gap:3px}
.psample-row{
  display:flex;align-items:center;gap:8px;
  min-height:26px;padding:3px 7px;
  border-radius:var(--radius-control);
  background:var(--fill-card);border:1px solid var(--stroke-card);
  font:var(--type-caption);
}
.psample-time{flex:none;color:var(--text-tertiary);white-space:nowrap}
.psample-entity{flex:1;min-width:72px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psample-entity.redacted{color:var(--text-secondary);font-style:italic}
.psample-dur{flex:none;color:var(--text-secondary);white-space:nowrap}

/* Step 3: Backup inventory rows with checkboxes */
.chk{
  width:18px;height:18px;border-radius:var(--radius-control);flex:none;
  display:grid;place-items:center;
  border:1px solid var(--stroke-control-strong);
  background:var(--fill-control);
  color:transparent;
}
.chk.on{
  background:var(--accent-fill);
  border-color:var(--accent-fill);
  color:var(--text-on-accent);
}
.chk.crit.on{
  background:var(--status-critical);
  border-color:var(--status-critical);
  color:var(--text-on-accent);
}
.bk-list{display:flex;flex-direction:column;gap:6px}
.bk-row{
  padding:8px 10px;border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card);
  display:flex;align-items:center;gap:10px;
}
.bk-row.sel{
  border-color:color-mix(in srgb,var(--status-critical) 42%,var(--stroke-card));
  background:color-mix(in srgb,var(--status-critical-bg) 35%,var(--fill-card));
}
.bk-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bk-name{font-family:var(--font-mono);font-size:12px;line-height:16px;color:var(--text-primary);overflow-wrap:anywhere}
.bk-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:var(--type-caption);color:var(--text-secondary)}
.bk-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bk-size{font:var(--type-body-strong);font-size:12.5px;line-height:16px;color:var(--text-primary);white-space:nowrap}

/* Step 4: Summary KV table & irreversible acknowledgement */
.kv-box{
  padding:9px 11px;border-radius:var(--radius-control);
  background:var(--fill-card-secondary);border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:7px;
}
.kv-row{display:flex;align-items:flex-start;gap:10px;font:var(--type-caption)}
.kv-k{flex:0 0 118px;color:var(--text-secondary);overflow-wrap:anywhere}
.kv-v{flex:1;min-width:0;color:var(--text-primary);display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}

.ack-box{
  padding:10px 12px;border-radius:var(--radius-control);
  background:var(--status-critical-bg);
  border:1px solid color-mix(in srgb,var(--status-critical) 36%,transparent);
  display:flex;align-items:flex-start;gap:10px;
}

.ack-sub{font:var(--type-caption);color:var(--text-secondary)}

/* Step 5/6/8: 6-phase vertical stepper */
.stepper{
  padding:6px 10px;border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:0;
}
.st-row{
  position:relative;
  display:flex;align-items:flex-start;gap:10px;
  padding:4px 4px;
}
.st-row:not(:last-child)::after{
  content:"";position:absolute;left:13px;top:24px;bottom:-4px;width:1.5px;
  background:var(--stroke-divider);
}
.st-row.done:not(:last-child)::after{background:color-mix(in srgb,var(--status-success) 45%,transparent)}
.st-row.active:not(:last-child)::after{background:color-mix(in srgb,var(--accent-fill) 45%,transparent)}
.st-row.fail:not(:last-child)::after{background:color-mix(in srgb,var(--status-critical) 40%,transparent)}

.st-ic{
  width:20px;height:20px;border-radius:50%;flex:none;
  display:grid;place-items:center;position:relative;z-index:1;
  background:var(--fill-card);
  border:1px solid var(--stroke-control-strong);
  color:var(--text-tertiary);
}
.st-row.done .st-ic{
  background:var(--status-success-bg);
  border-color:color-mix(in srgb,var(--status-success) 40%,transparent);
  color:var(--status-success);
}
.st-row.active .st-ic{
  background:var(--bg-flyout);
  border-color:var(--accent-fill);
  color:var(--accent-fill);
}
.st-row.fail .st-ic{
  background:var(--status-critical-bg);
  border-color:color-mix(in srgb,var(--status-critical) 45%,transparent);
  color:var(--status-critical);
}

.st-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.st-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.st-name{font:var(--type-body-strong);font-size:13px;line-height:18px;color:var(--text-primary)}
.st-row.pending .st-name{font-weight:400;color:var(--text-secondary)}
.st-count{margin-left:auto;font:var(--type-caption);color:var(--text-secondary);white-space:nowrap}
.st-row.active .st-count{color:var(--accent-text);font-weight:600}
.st-row.fail .st-count{color:var(--status-critical);font-weight:600}
.st-desc{font:var(--type-caption);color:var(--text-secondary);overflow-wrap:anywhere}

.err-card{

}
.err-card-ic{color:var(--status-critical);margin-top:1px;flex:none}
.err-card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.err-card-title{font:var(--type-body-strong);font-size:13px;line-height:18px;color:var(--text-primary);overflow-wrap:anywhere}
.err-card-msg{font:var(--type-caption);color:var(--text-primary);overflow-wrap:anywhere}
.err-card-code{font:var(--type-caption);font-family:var(--font-mono);color:var(--text-tertiary);margin-top:2px;overflow-wrap:anywhere}

.split-2{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.split-card{
  padding:8px 10px;border-radius:var(--radius-control);

  display:flex;flex-direction:column;gap:4px;min-width:0;
}

.split-card.remain{border-left:3px solid var(--status-critical)}

};
function pseudoStr(s) {
  if (!s || typeof s !== 'string') return s;
  const accented = [...s].map(ch => ACCENT_MAP[ch] || ch).join('');

function ringSvg(cls = 'ring-sm', color = 'var(--accent-fill)') {
  return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">` +
    `<circle cx="12" cy="12" r="9" fill="none" stroke="var(--stroke-control-strong)" stroke-width="2.4"/>` +
    `<circle cx="12" cy="12" r="9" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="16 44" transform="rotate(-90 12 12)"/>` +
  `</svg>`;

function renderWizardSteps(activeStep) {
  const steps = T.wiz.steps;
  return `<div class="wiz-steps" aria-label="Progress">` +
    steps.map((lbl, idx) => {
      const stepNum = idx + 1;
      const cls = stepNum < activeStep ? 'done' : stepNum === activeStep ? 'active' : '';
      const numHtml = stepNum < activeStep
        ? `<svg class="ic s16" style="width:11px;height:11px"><use href="#check"/></svg>`
        : String(stepNum);
      return (idx > 0 ? `<div class="wiz-sep" aria-hidden="true"></div>` : '') +
        `<div class="wiz-step ${cls}"><span class="ws-num">${numHtml}</span><span class="ws-lbl">${lbl}</span></div>`;
    }).join('') +
  `</div>`;
}

function renderStepper(phases) {
  return `<div class="stepper">` +
    phases.map(ph => {
      let icHtml = `<span style="width:6px;height:6px;border-radius:50%;background:var(--text-tertiary)"></span>`;
      if (ph.state === 'done') icHtml = `<svg class="ic s16" style="width:12px;height:12px"><use href="#check"/></svg>`;
      else if (ph.state === 'active') icHtml = ringSvg('ring-xs');
      else if (ph.state === 'fail') icHtml = `<svg class="ic s16" style="width:12px;height:12px"><use href="#close"/></svg>`;

      const barHtml = ph.pct !== undefined
        ? `<div class="pbar" style="margin-top:3px"><div class="pbar-fill" style="width:${ph.pct}%"></div></div>`
        : '';
      const descHtml = ph.desc ? `<div class="st-desc">${ph.desc}</div>` : '';

      return `<div class="st-row ${ph.state}">` +
        `<div class="st-ic">${icHtml}</div>` +
        `<div class="st-main">` +
          `<div class="st-top">` +
            `<span class="st-name">${ph.name}</span>` +
            `<span class="st-count">${ph.count}</span>` +
          `</div>` +
          descHtml +
          barHtml +
        `</div>` +
      `</div>`;
    }).join('') +
  `</div>`;
}

function mountModal({ headIcon, headIconCls = 'accent', title, badgeHtml = '', wizardStep = 0, bodyHtml, footLeft = '', footRight = '' }) {
  const scrim = document.getElementById('modal-scrim');
  scrim.style.display = 'flex';
  const icHtml = headIcon === 'ring'
    ? `<span class="modal-head-ic">${ringSvg('ring-sm')}</span>`
    : `<svg class="ic modal-head-ic ${headIconCls}"><use href="#${headIcon}"/></svg>`;
  scrim.innerHTML =
    `<div class="modal-dlg" role="dialog" aria-modal="true">` +
      `<div class="modal-head">` +
        icHtml +
        `<div class="modal-head-txt">` +
          `<span class="h-sub ell">${title}</span>` +
          badgeHtml +
        `</div>` +
        `<button class="btn subtle icon compact" aria-label="${T.wiz.btnClose}"><svg class="ic s16"><use href="#close"/></svg></button>` +
      `</div>` +
      (wizardStep > 0 ? renderWizardSteps(wizardStep) : '') +
      `<div class="modal-body-wrap" id="modal-body-wrap">` +
        `<div class="modal-body" id="modal-body">${bodyHtml}</div>` +
        `<div class="scroll-track" aria-hidden="true"><div class="scroll-thumb" id="modal-thumb"></div></div>` +
      `</div>` +
      `<div class="modal-foot">` +
        `<div class="modal-foot-left">${footLeft}</div>` +
        `<div class="modal-foot-right">${footRight}</div>` +
      `</div>` +
    `</div>`;
}

  }

  if (stateKey === 'history-running') {
    const r = w.running;
    const bodyHtml =
      `<div class="infobar subtle">` +
        `<svg class="ic s16 ib-ic"><use href="#info"/></svg>` +
        `<div class="ib-body"><div class="ib-title">${r.usableTitle}</div><div>${r.usableDesc}</div></div>` +
      `</div>` +
      renderStepper(r.phases) +
      `<div class="cap ter" style="overflow-wrap:anywhere">${r.footerNote}</div>`;

    mountModal({
      headIcon: 'ring',
      title: r.title,
      badgeHtml: `<span class="badge ovr"><span class="btxt">${r.stateBadge}</span></span>`,
      bodyHtml,
      footRight: `<button class="btn accent"><span>${w.btnBg}</span></button>`,
    });
    return;
  }

  if (stateKey === 'history-failed') {
    const f = w.failed;
    const bodyHtml =
      `<div class="err-card" role="alert">` +
        `<svg class="ic err-card-ic"><use href="#crit-circle"/></svg>` +
        `<div class="err-card-body">` +
          `<div class="err-card-title">${f.errTitle}</div>` +
          `<div class="err-card-msg">${f.errDesc}</div>` +
          `<div class="err-card-code">error_code: ${f.errCode}</div>` +
        `</div>` +
      `</div>` +
      renderStepper(f.phases) +
      `<div class="split-2">` +
        `<div class="split-card done-irrev">` +
          `<span class="strong" style="font-size:12.5px;color:var(--text-primary)">${f.doneHdr}</span>` +
          `<span class="cap sec" style="overflow-wrap:anywhere">${f.doneBody}</span>` +
        `</div>` +
        `<div class="split-card remain">` +
          `<span class="strong" style="font-size:12.5px;color:var(--text-primary)">${f.remHdr}</span>` +
          `<span class="cap sec" style="overflow-wrap:anywhere">${f.remBody}</span>` +
        `</div>` +
      `</div>` +
      `<div class="cap sec" style="overflow-wrap:anywhere">${f.retryNote}</div>`;

    mountModal({
      headIcon: 'crit-circle',
      headIconCls: 'crit',
      title: f.title,
      badgeHtml: `<span class="badge crit"><span class="btxt">${f.stateBadge}</span></span>`,
      bodyHtml,
      footRight:
        `<button class="btn"><span>${w.btnClose}</span></button>` +
        `<button class="btn accent"><svg class="ic s16"><use href="#refresh"/></svg><span>${f.retryBtn}</span></button>`,
    });
    return;
  }

  if (stateKey === 'history-completed') {
    const c = w.completed;
    const bodyHtml =
      `<div class="kpi-grid">` +
        `<div class="kpi-tile">` +
          `<div class="kpi-lbl"><i class="kpi-dot ok"></i><span class="ell">${c.kpi1Lbl}</span></div>` +
          `<div class="kpi-val">${c.kpi1Val}</div>` +
          `<div class="kpi-sub">${c.kpi1Sub}</div>` +
        `</div>` +
        `<div class="kpi-tile">` +
          `<div class="kpi-lbl"><i class="kpi-dot ok"></i><span class="ell">${c.kpi2Lbl}</span></div>` +
          `<div class="kpi-val">${c.kpi2Val}</div>` +
          `<div class="kpi-sub">${c.kpi2Sub}</div>` +
        `</div>` +
        `<div class="kpi-tile">` +
          `<div class="kpi-lbl"><i class="kpi-dot ok"></i><span class="ell">${c.kpi3Lbl}</span></div>` +
          `<div class="kpi-val">${c.kpi3Val}</div>` +
          `<div class="kpi-sub">${c.kpi3Sub}</div>` +
        `</div>` +
      `</div>` +
      renderStepper(c.phases) +
      `<div class="infobar caution">` +
        `<svg class="ic s16 ib-ic"><use href="#info"/></svg>` +
        `<div class="ib-body"><div class="ib-title">${c.unselectedTitle}</div><div>${c.unselectedDesc}</div></div>` +
      `</div>`;

    mountModal({
      headIcon: 'check-circle',
      headIconCls: 'ok',
      title: c.title,
      badgeHtml: `<span class="badge ok"><span class="btxt">${c.stateBadge}</span></span>`,
      bodyHtml,
      footRight: `<button class="btn accent"><span>${w.btnDone}</span></button>`,
    });
  }
}

function syncScroll(scrollEl, wrapEl, thumbEl) {
  if (!scrollEl || !wrapEl || !thumbEl) return;
  const overflow = scrollEl.scrollHeight > scrollEl.clientHeight + 1;
  wrapEl.classList.toggle('scrollable', overflow);
  if (!overflow) return;
  const trackH = wrapEl.clientHeight - 8;
  const ratio = scrollEl.clientHeight / scrollEl.scrollHeight;
  const thumbH = Math.max(28, Math.round(trackH * ratio));
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const top = maxScroll > 0 ? Math.round((scrollEl.scrollTop / maxScroll) * (trackH - thumbH)) : 0;
  thumbEl.style.height = thumbH + 'px';
  thumbEl.style.top = top + 'px';
}

renderNav();
document.getElementById('main').innerHTML =
  renderHeaderAndPivot() +
  renderTopInfoBar() +
  renderPrivacyWorkspace();
renderStateModal();

const mainEl = document.getElementById('main');
const mainWrapEl = document.getElementById('main-wrap');
const mainThumbEl = document.getElementById('main-thumb');
syncScroll(mainEl, mainWrapEl, mainThumbEl);
mainEl.addEventListener('scroll', () => syncScroll(mainEl, mainWrapEl, mainThumbEl));

const modalBody = document.getElementById('modal-body');
const modalBodyWrap = document.getElementById('modal-body-wrap');
const modalThumb = document.getElementById('modal-thumb');
if (modalBody) {
  syncScroll(modalBody, modalBodyWrap, modalThumb);
  modalBody.addEventListener('scroll', () => syncScroll(modalBody, modalBodyWrap, modalThumb));
}
</script>
</body>
</html>
