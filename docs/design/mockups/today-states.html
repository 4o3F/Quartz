<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Quartz — Today data states</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<!--
  Today page data states mockup for Quartz (M3-D1).
  Query parameters:
    ?state=loading | refreshing | empty-today | empty-past |
           stopped | query-failed | date-picker | today-nav
    &theme=light | dark
    &lang=zh-CN | en
    &size=min          (optional: 640x480 minimum window per 07 §2.3; default 1280x800)
    &reason=paused | locked | persistence-failed  (optional, for state=stopped)
    &err=busy | internal                          (optional, for state=query-failed)
-->
<style>
/* Minimum window 640x480 (Compact breakpoint per 07 §2.1 & §2.3) */
html[data-size="min"],
html[data-size="min"] body,
html[data-size="min"] .window{width:640px;height:480px}

.main-wrap{position:relative;flex:1;min-width:0;display:flex}
.main{position:relative}
html[data-size="min"] .main{
  padding:var(--space-l) var(--space-l) var(--space-l);
  overflow-y:auto;overflow-x:hidden;
}

/* Fluent 2 overlay scrollbar indicator (shown only when compact viewport overflows vertically) */
.scroll-track{
  display:none;
  position:absolute;top:var(--space-xs);right:var(--space-xs);bottom:var(--space-xs);
  width:6px;pointer-events:none;z-index:5;
}
.main-wrap.scrollable .scroll-track{display:block}
.scroll-thumb{
  position:absolute;left:1px;right:1px;top:0;
  border-radius:var(--radius-control);
  background:var(--text-tertiary);
}

/* Compact (640x480) layout adjustments per 07 §2.1 */
html[data-size="min"] .datebar .date{min-width:168px}
html[data-size="min"] .stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  row-gap:var(--space-m);
}
html[data-size="min"] .stat{padding:0 var(--space-m);border-left:1px solid var(--stroke-divider)}
html[data-size="min"] .stat:nth-child(3n+1){padding-left:0;border-left:none}
html[data-size="min"] .two-col{flex-direction:column}
html[data-size="min"] .tl{--gut:84px}
html[data-size="min"] .tl-head{flex-wrap:wrap;row-gap:var(--space-xs)}
html[data-size="min"] .legend{flex-wrap:wrap;gap:var(--space-xs) var(--space-m)}

/* Date bar positioning & active/open button state */
.datebar{position:relative}
.datebar .btn.date.open{
  background:var(--fill-control-pressed);
  border-color:var(--stroke-control-strong);
}

/* Subtle in-flight re-query indicator (refreshing state, right side of date bar) */
.refresh-ind{
  margin-left:auto;
  display:inline-flex;align-items:center;gap:6px;
  font:var(--type-caption);color:var(--text-tertiary);
  white-space:nowrap;
}
.ring-xs{width:14px;height:14px;display:block;flex:none}

/* Static Fluent 2 skeleton primitives (zero looping animation per 07 §9 & 11 §1) */
.skel{
  display:inline-block;
  border-radius:var(--radius-control);
  background:color-mix(in srgb,var(--text-tertiary) 18%,transparent);
}
.skel.soft{background:var(--fill-subtle-hover)}
.skel.sm{border-radius:var(--tl-block-radius)}
.skel-v-slot{height:36px;display:flex;align-items:flex-end;padding-bottom:4px}
.skel-stat-v{height:22px;width:72px}
.skel-stat-v.big{height:28px;width:104px}
.skel-catbar{height:8px;width:100%;border-radius:var(--radius-control);background:var(--fill-subtle-hover);margin-top:10px}
.skel-legend{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.skel-legend span{display:inline-flex;align-items:center;gap:6px}
.skel-dot{width:8px;height:8px;border-radius:2px;background:color-mix(in srgb,var(--text-tertiary) 18%,transparent);flex:none}
.skel-blk{
  position:absolute;top:0;bottom:0;
  border-radius:var(--tl-block-radius);
  background:color-mix(in srgb,var(--text-tertiary) 18%,transparent);
}
.skel-blk.soft{background:var(--fill-subtle-hover)}
.skel-col{
  width:60%;max-width:30px;
  border-radius:1px;
  background:color-mix(in srgb,var(--text-tertiary) 16%,transparent);
}
.skel-ic{width:16px;height:16px;border-radius:var(--radius-control);background:var(--fill-subtle-hover);flex:none}
.skel-cb{width:3px;height:16px;border-radius:2px;background:var(--fill-subtle-hover);flex:none}
.seg.dim{opacity:.55}

/* Calm empty states (empty-today & empty-past) */
.empty-card{
  flex:1;min-height:0;
  margin-bottom:var(--space-xxl);
  display:flex;align-items:center;justify-content:center;
}
.empty-inner{
  max-width:440px;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:var(--space-m);
  padding:var(--space-xxl) var(--space-l);
}
.empty-tile{
  width:48px;height:48px;
  border-radius:var(--radius-overlay);
  background:var(--fill-subtle-hover);
  border:1px solid var(--stroke-card);
  color:var(--text-secondary);
  display:grid;place-items:center;
}
.empty-tile svg{width:24px;height:24px;stroke-width:1.5}
.empty-title{font:var(--type-subtitle);color:var(--text-primary)}
.empty-desc{font:var(--type-body);color:var(--text-secondary)}
.status-pill{
  display:inline-flex;align-items:center;gap:8px;
  height:24px;padding:0 var(--space-m);
  border-radius:var(--radius-control);
  background:var(--fill-subtle-hover);
  font:var(--type-caption);color:var(--text-secondary);
}
.status-pill i{width:6px;height:6px;border-radius:50%;background:var(--status-success);flex:none}

/* Stop-reason InfoBar (positioned between date bar and status-line card) */
.infobar{
  flex:none;
  min-height:var(--h-row-standard);
  padding:var(--space-s) var(--space-l);
  border-radius:var(--radius-overlay);
  border:1px solid var(--stroke-card);
  background:var(--fill-card);
  display:flex;align-items:center;gap:var(--space-m);
}
.infobar .ib-ic{color:var(--text-secondary);flex:none}
.infobar .ib-txt{
  flex:1;min-width:0;
  display:flex;align-items:baseline;flex-wrap:wrap;
  column-gap:var(--space-s);row-gap:var(--space-xxs);
}
.infobar .ib-title{font:var(--type-body-strong);color:var(--text-primary)}
.infobar .ib-msg{font:var(--type-body);color:var(--text-secondary)}
.infobar.critical{
  background:var(--status-critical-bg);
  border-color:color-mix(in srgb,var(--status-critical) 28%,transparent);
}
.infobar.critical .ib-ic{color:var(--status-critical)}

/* Inline page-level query-failed notice (clearly lighter than full-window errors.html) */
.qfail-card{
  flex:none;
  padding:var(--space-l) var(--space-xl);
  display:flex;align-items:flex-start;gap:var(--space-m);
}
.qfail-ic{color:var(--status-caution);margin-top:1px;flex:none}
.qfail-body{
  flex:1;min-width:0;
  display:flex;flex-direction:column;gap:var(--space-xs);
}
.qfail-title{font:var(--type-body-strong);color:var(--text-primary)}
.qfail-msg{font:var(--type-body);color:var(--text-secondary)}
.qfail-code{font:var(--type-caption);font-family:var(--font-mono);color:var(--text-tertiary);margin-top:2px}
.qfail-act{flex:none;align-self:center;margin-left:var(--space-m)}
html[data-size="min"] .qfail-card{flex-wrap:wrap;padding:var(--space-l)}
html[data-size="min"] .qfail-act{
  margin-left:calc(20px + var(--space-m));
  margin-top:var(--space-xs);
  align-self:flex-start;
}

/* Fluent 2 CalendarDatePicker flyout */
.cal-flyout{
  position:absolute;
  left:40px; /* aligned with date button (32px prev button + 8px gap) */
  top:calc(var(--h-control-standard) + var(--space-xs));
  width:300px;
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-28);
  z-index:20;
  overflow:hidden;
}
.cal-head{
  height:40px;
  padding:0 var(--space-s) 0 var(--space-m);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:center;gap:var(--space-xs);
}
.cal-month{
  flex:1;min-width:0;
  height:32px;padding:0 var(--space-s);
  border-radius:var(--radius-control);
  display:flex;align-items:center;
  font:var(--type-body-strong);color:var(--text-primary);
}
.cal-nav{
  width:32px;height:32px;
  border-radius:var(--radius-control);
  display:grid;place-items:center;
  color:var(--text-primary);
}
.cal-nav.disabled{color:var(--text-disabled)}
.cal-body{padding:var(--space-s) var(--space-m) var(--space-m)}
.cal-wk{
  display:grid;grid-template-columns:repeat(7,1fr);
  margin-bottom:var(--space-xs);
}
.cal-wk span{
  height:28px;
  display:grid;place-items:center;
  font:var(--type-caption);color:var(--text-secondary);
}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  row-gap:2px;
}
.cal-day{
  height:38px;
  display:grid;place-items:center;
}
.cal-day span{
  width:34px;height:34px;
  border-radius:50%;
  display:grid;place-items:center;
  font:var(--type-body);color:var(--text-primary);
}
.cal-day.out span{color:var(--text-tertiary)}
.cal-day.future span{color:var(--text-disabled)}
.cal-day.today span{
  border:1.5px solid var(--accent-fill);
  color:var(--accent-text);
  font-weight:600;
}
.cal-day.selected span{
  background:var(--accent-fill);
  color:var(--text-on-accent);
  font-weight:600;
}

/* Today-nav comparison card */
.nav-cmp{
  flex:none;
  padding:var(--space-m) var(--space-l);
  display:flex;flex-direction:column;gap:var(--space-m);
}
.nav-cmp-row{
  display:flex;align-items:center;gap:var(--space-l);
  padding-top:var(--space-m);
  border-top:1px solid var(--stroke-divider);
}
.nav-cmp-row:first-of-type{padding-top:0;border-top:none}
.nav-cmp-meta{width:176px;flex:none;display:flex;flex-direction:column;gap:2px}
.nav-cmp-bar{display:flex;align-items:center;gap:var(--space-s);flex:none}
.nav-cmp-bar .date{min-width:196px;justify-content:flex-start}
.nav-cmp-note{flex:1;min-width:0;font:var(--type-caption);color:var(--text-secondary)}
</style>
<script>
const __p = new URLSearchParams(location.search);
document.documentElement.dataset.theme = __p.get('theme') || 'light';
if (__p.get('size') === 'min') document.documentElement.dataset.size = 'min';

function renderNav() {
  const nav = document.getElementById('nav');

    ? `<div style="height:4px;flex:none"></div>`

function renderDateBar({ dateText, isToday, pickerOpen = false, refreshing = false, extraHtml = '' }) {
  const disCls = isToday ? ' disabled' : '';

  const refreshHtml = refreshing
    ? `<div class="refresh-ind">${ringSvg('ring-xs')}<span>${T.datebar.updating}</span></div>`
    : '';
  return `<div class="datebar">` +
    `<button class="btn icon"><svg class="ic s16"><use href="#chev-l"/></svg></button>` +
    `<div class="btn date${openCls}"><svg class="ic s16"><use href="#today"/></svg><span class="strong">${dateText}</span><span class="grow"></span><svg class="ic s16"><use href="#${chevId}"/></svg></div>` +
    `<button class="btn icon${disCls}"><svg class="ic s16"><use href="#chev-r"/></svg></button>` +
    `<button class="btn${disCls}">${T.datebar.todayBtn}</button>` +
    refreshHtml +

}

  const hourlySkel = `<div class="card grow" style="padding:12px 16px">` +
    `<div class="h-sub" style="margin-bottom:8px">${h.title}</div>` +
    `<div class="plot" style="padding:4px 0 6px">` +
      `<div class="hours">` +
        `<div class="y"><span style="bottom:0px">${h.y0}</span><span style="bottom:60px">${h.y30}</span><span style="bottom:120px">${h.y60}</span></div>` +
        `<div class="plotarea"><div class="gl" style="bottom:60px"></div><div class="gl" style="bottom:120px"></div>` +
          skelBars.map(px => `<div class="col"><div class="skel-col" style="height:${px}px"></div></div>`).join('') +
        `</div>` +
      `</div>` +
      `<div class="hlabels">${skelBars.map(() => `<span><i class="skel soft" style="width:14px;height:10px"></i></span>`).join('')}</div>` +
    `</div>` +
  `</div>`;

  const skelRanks = [
    { nm: 112, bar: 92, du: 56 },
    { nm: 96, bar: 52, du: 52 },
    { nm: 64, bar: 34, du: 38 },
    { nm: 104, bar: 20, du: 36 },
    { nm: 58, bar: 14, du: 34 },
  ];
  const rankSkel = `<div class="card grow" style="padding:12px 16px">` +
    `<div class="row" style="margin-bottom:4px"><span class="h-sub grow">${r.title}</span><div class="seg dim">${r.tabs.map((t, i) => `<div${i === 0 ? ' class="on"' : ''}>${t}</div>`).join('')}</div></div>` +
    skelRanks.map(row =>
      `<div class="rank">` +
        `<i class="skel-cb"></i>` +
        `<div class="nm"><i class="skel-ic"></i><i class="skel" style="width:${row.nm}px;height:12px"></i></div>` +
        `<div class="bar"><div class="fill" style="width:${row.bar}%"><div style="flex:1;background:color-mix(in srgb,var(--text-tertiary) 18%,transparent)"></div></div></div>` +
        `<div class="du"><i class="skel soft" style="width:${row.du}px;height:12px"></i></div>` +
      `</div>`
    ).join('') +
  `</div>`;

  return renderDateBar({ dateText: T.dates.today, isToday: true }) +
    statusCard +
    timelineCard +
    `<div class="row gap8 two-col" style="flex:none;align-items:stretch">${hourlySkel}${rankSkel}</div>`;
}

/* State 2: Refreshing — full content preserved at full opacity + subtle datebar indicator */
function renderRefreshingState() {
  return renderDateBar({ dateText: T.dates.today, isToday: true, refreshing: true }) +
    renderStatusCard() +
    renderTimelineCard() +
    renderHourlyAndRanking() +
    renderPendingRow();
}

/* State 3: Empty today — actively recording, nothing captured yet */
function renderEmptyTodayState() {
  const e = T.emptyToday;
  return renderDateBar({ dateText: T.dates.today, isToday: true }) +
    `<div class="card empty-card">` +
      `<div class="empty-inner">` +
        `<div class="empty-tile"><svg class="ic"><use href="#clock"/></svg></div>` +
        `<div class="empty-title">${e.title}</div>` +
        `<div class="empty-desc">${e.desc}</div>` +
        `<div class="status-pill"><i></i><span>${e.pill}</span></div>` +
      `</div>` +
    `</div>`;
}

/* State 4: Empty past day — navigable date bar + calm empty state */
function renderEmptyPastState() {
  const e = T.emptyPast;
  return renderDateBar({ dateText: T.dates.emptyPast, isToday: false }) +
    `<div class="card empty-card">` +
      `<div class="empty-inner">` +
        `<div class="empty-tile"><svg class="ic"><use href="#today"/></svg></div>` +
        `<div class="empty-title">${e.title}</div>` +
        `<div class="empty-desc">${e.desc}</div>` +
        `<button class="btn" style="margin-top:4px">${e.backToday}</button>` +
      `</div>` +
    `</div>`;
}

/* State 5: Today with data, recording currently stopped */
function renderStoppedState() {
  const key = T.stopped[stopReason] ? stopReason : 'paused';
  const info = T.stopped[key];
  const isCritical = key === 'persistence-failed';
  const iconId = isCritical ? 'crit-circle' : (key === 'locked' ? 'lock' : 'pause');
  const actionHtml = info.action
    ? `<button class="btn compact"><svg class="ic s16"><use href="#play"/></svg><span>${info.action}</span></button>`
    : '';
  const infoBar = `<div class="infobar${isCritical ? ' critical' : ''}" role="status">` +
    `<svg class="ic s16 ib-ic"><use href="#${iconId}"/></svg>` +
    `<div class="ib-txt"><span class="ib-title">${info.title}</span><span class="ib-msg">${info.msg}</span></div>` +
    actionHtml +
  `</div>`;

  return renderDateBar({ dateText: T.dates.today, isToday: true }) +
    infoBar +
    renderStatusCard() +
    renderTimelineCard() +
    renderHourlyAndRanking();
}

/* State 6: Query failed — lightweight inline page-level notice, app remains usable */
function renderQueryFailedState() {
  const q = T.qfail;
  const msg = failCode === 'internal' ? q.internalMsg : q.busyMsg;
  return renderDateBar({ dateText: T.dates.today, isToday: true }) +
    `<div class="card qfail-card" role="alert">` +
      `<svg class="ic qfail-ic"><use href="#warn"/></svg>` +
      `<div class="qfail-body">` +
        `<div class="qfail-title">${q.title}</div>` +
        `<div class="qfail-msg">${msg}</div>` +
        `<div class="qfail-code">${q.codePrefix}: ${failCode}</div>` +
      `</div>` +
      `<div class="qfail-act"><button class="btn"><svg class="ic s16"><use href="#refresh"/></svg><span>${q.retry}</span></button></div>` +
    `</div>`;
}

/* State 7: Fluent 2 CalendarDatePicker flyout opened from date button
   November 2026: Nov 1 = Sunday. Today = Nov 19 (Thu), Selected = Nov 16 (Mon), Future = Nov 20..30 */
function renderCalendarFlyout() {
  const d = T.dates;
  const cells = [];
  if (d.weekStart === 'mon') {
    // Leading Oct 26..31 (Mon..Sat)
    for (let day = 26; day <= 31; day++) cells.push({ n: day, cls: 'out' });
  }
  // November 1..30 (Today = 19, Selected = 16, Future = 20..30)
  for (let day = 1; day <= 30; day++) {
    let cls = '';
    if (day === 16) cls = 'selected';
    else if (day === 19) cls = 'today';
    else if (day > 19) cls = 'future';
    cells.push({ n: day, cls });
  }
  // Trailing December days to complete the final calendar week
  let nextDay = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ n: nextDay++, cls: 'out future' });
  }

  return `<div class="cal-flyout" role="dialog" aria-label="${d.monthLabel}">` +
    `<div class="cal-head">` +
      `<div class="cal-month">${d.monthLabel}</div>` +
      `<div class="cal-nav" role="button"><svg class="ic s16"><use href="#chev-l"/></svg></div>` +
      `<div class="cal-nav disabled" role="button"><svg class="ic s16"><use href="#chev-r"/></svg></div>` +
    `</div>` +
    `<div class="cal-body">` +
      `<div class="cal-wk">${d.weekdays.map(w => `<span>${w}</span>`).join('')}</div>` +
      `<div class="cal-grid">${cells.map(c => `<div class="cal-day ${c.cls}"><span>${c.n}</span></div>`).join('')}</div>` +
    `</div>` +
  `</div>`;
}

function renderDatePickerState() {
  return renderDateBar({ dateText: T.dates.past, isToday: false, pickerOpen: true, extraHtml: renderCalendarFlyout() }) +
    renderStatusCard() +
    renderTimelineCard() +
    renderHourlyAndRanking() +
    renderPendingRow();
}

/* State 8: Today-nav — Today selected (next & Today disabled) + past-day comparison strip */
function renderTodayNavState() {
  const c = T.navCmp;
  const cmpCard = `<div class="card nav-cmp">` +
    `<div class="strong">${c.heading}</div>` +
    `<div class="nav-cmp-row">` +
      `<div class="nav-cmp-meta"><span class="strong">${c.todayLabel}</span><span class="cap sec">${c.todaySub}</span></div>` +
      `<div class="nav-cmp-bar">` +
        `<button class="btn icon"><svg class="ic s16"><use href="#chev-l"/></svg></button>` +
        `<div class="btn date"><svg class="ic s16"><use href="#today"/></svg><span class="strong">${T.dates.today}</span><span class="grow"></span><svg class="ic s16"><use href="#chev-d"/></svg></div>` +
        `<button class="btn icon disabled"><svg class="ic s16"><use href="#chev-r"/></svg></button>` +
        `<button class="btn disabled">${T.datebar.todayBtn}</button>` +
      `</div>` +
      `<div class="nav-cmp-note">${c.todayNote}</div>` +
    `</div>` +
    `<div class="nav-cmp-row">` +
      `<div class="nav-cmp-meta"><span class="strong">${c.pastLabel}</span><span class="cap sec">${c.pastSub}</span></div>` +
      `<div class="nav-cmp-bar">` +
        `<button class="btn icon"><svg class="ic s16"><use href="#chev-l"/></svg></button>` +
        `<div class="btn date"><svg class="ic s16"><use href="#today"/></svg><span class="strong">${T.dates.past}</span><span class="grow"></span><svg class="ic s16"><use href="#chev-d"/></svg></div>` +
        `<button class="btn icon"><svg class="ic s16"><use href="#chev-r"/></svg></button>` +
        `<button class="btn">${T.datebar.todayBtn}</button>` +
      `</div>` +
      `<div class="nav-cmp-note">${c.pastNote}</div>` +
    `</div>` +
  `</div>`;

  return renderDateBar({ dateText: T.dates.today, isToday: true }) +
    cmpCard +
    renderStatusCard() +
    renderTimelineCard();
}

const RENDERERS = {
  loading: renderLoadingState,
  refreshing: renderRefreshingState,
  'empty-today': renderEmptyTodayState,
  'empty-past': renderEmptyPastState,
  stopped: renderStoppedState,
  'query-failed': renderQueryFailedState,
  'date-picker': renderDatePickerState,
  'today-nav': renderTodayNavState,
};

renderNav();
const main = document.getElementById('main');
main.innerHTML = (RENDERERS[stateKey] || renderLoadingState)();

/* Sync Fluent 2 overlay scrollbar indicator on compact viewport */
const mainWrap = document.getElementById('main-wrap');
const scrollThumb = document.getElementById('scroll-thumb');
function syncScroll() {
  const overflow = main.scrollHeight > main.clientHeight + 1;
  mainWrap.classList.toggle('scrollable', overflow);
  if (!overflow) return;
  const trackH = mainWrap.clientHeight - 8;
  const ratio = main.clientHeight / main.scrollHeight;
  const thumbH = Math.max(32, Math.round(trackH * ratio));
  const maxScroll = main.scrollHeight - main.clientHeight;
  const top = maxScroll > 0 ? Math.round((main.scrollTop / maxScroll) * (trackH - thumbH)) : 0;
  scrollThumb.style.height = thumbH + 'px';
  scrollThumb.style.top = top + 'px';
}
main.addEventListener('scroll', syncScroll);
syncScroll();
</script>
</body>
