<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Quartz — Explanations, situation text &amp; Today entry points (M4 V5)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<!--
  Explanations, situation text, context menus, and Today classification/privacy entry points (M4 V5: H10 / H15).
  Query parameters:
    ?state=explain | explain-fragments | explain-long | situation |
           context-menu-ranking | context-menu-timeline |
           classify-from-today | privacy-from-today
    &theme=light | dark
    &lang=zh-CN | en | en-XA
    &size=min          (optional: 640x480 minimum window per 07 §2.3; default 1280x800)
-->
<style>
/* Minimum window 640x480 (Compact breakpoint per 07 §2.1 & §2.3) */
html[data-size="min"],
html[data-size="min"] body,
html[data-size="min"] .window{width:640px;height:480px}

.wrap{position:relative;overflow:hidden}
.main-wrap{position:relative;flex:1;min-width:0;display:flex}
.main{position:relative;padding:var(--space-xxl) var(--space-xxl) var(--space-l);gap:var(--space-s);overflow-y:auto;overflow-x:hidden}
html[data-has-panel="true"] .main{padding:var(--space-l) var(--space-l) var(--space-l)}
html[data-size="min"] .main{padding:var(--space-m) var(--space-m) var(--space-l)}

/* Follow 07 §10 decision: chart plot areas sit directly on bg.base in both light and dark */
.plot{background:var(--bg-base);border-radius:var(--radius-control)}

/* Fluent 2 overlay scrollbar indicator (11 §9.2) */
.scroll-track{
  display:none;
  position:absolute;top:var(--space-xs);right:var(--space-xs);bottom:var(--space-xs);
  width:6px;pointer-events:none;z-index:8;
}
.scrollable > .scroll-track{display:block}
.scroll-thumb{
  position:absolute;left:1px;right:1px;top:0;
  border-radius:var(--radius-control);
  background:var(--text-tertiary);
}

/* Nav text stays single-line with ellipsis in en-XA */
.nav-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Flexible buttons & badges safe for en-XA */
.badge{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:3px}
.badge .btxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:var(--h-control-standard);height:auto;padding:4px 12px}
.btn.compact{min-height:var(--h-control-compact);height:auto;padding:2px 10px}
.btn.icon{width:var(--h-control-standard);height:var(--h-control-standard);padding:0}
.btn.compact.icon{width:var(--h-control-compact);height:var(--h-control-compact);padding:0}

/* Today layout responsiveness (07 §2.1 & §2.3) */
.datebar{flex-wrap:wrap;height:auto;min-height:var(--h-control-standard)}
.datebar .date{min-width:186px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.stat{padding:0 10px;border-left:1px solid var(--stroke-divider);min-width:0}
.stat:first-child{padding-left:0;border-left:none}
.stat .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{flex-wrap:wrap;gap:var(--space-xs) var(--space-l)}
.tl-head{gap:6px;row-gap:4px;flex-wrap:wrap}
.tl-head .h-sub{flex:1 0 auto;min-width:0;white-space:nowrap}

html[data-has-panel="true"] .stats{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:var(--space-s)}
html[data-has-panel="true"] .stat:nth-child(3n+1){padding-left:0;border-left:none}
html[data-has-panel="true"] .tl{--gut:98px}
html[data-has-panel="true"] .two-col{flex-direction:column}

html[data-size="min"] .datebar .date{min-width:154px}
html[data-size="min"] .stats{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:var(--space-s)}
html[data-size="min"] .stat:nth-child(3n+1){padding-left:0;border-left:none}
html[data-size="min"] .two-col{flex-direction:column}
html[data-size="min"] .tl{--gut:84px}
html[data-size="min"] .legend{gap:var(--space-xs) var(--space-m)}

/* Timeline clock-change marker */
.dst-marker{
  position:absolute;top:-2px;bottom:-2px;width:2px;
  background:repeating-linear-gradient(180deg,var(--status-caution) 0 4px,transparent 4px 7px);
  z-index:4;pointer-events:none;
}
.dst-pill{
  position:absolute;top:-19px;transform:translateX(-50%);
  height:16px;padding:0 5px;border-radius:var(--radius-control);
  background:var(--status-caution-bg);color:var(--status-caution);
  border:1px solid color-mix(in srgb,var(--status-caution) 28%,transparent);
  font:var(--type-caption);font-size:10.5px;line-height:14px;
  white-space:nowrap;display:inline-flex;align-items:center;gap:3px;
}

/* Selected block ring for timeline context menu */
.blk.ctx-target{
  box-shadow:0 0 0 2px var(--bg-base),0 0 0 3.5px var(--accent-fill);
  z-index:5;
}

/* Ranking row refinements + inline overflow "..." button */
.rank{position:relative}
.rank .nm{width:152px}
.rank .du{width:76px}
.rank-more{
  width:24px;height:24px;flex:none;
  display:grid;place-items:center;
  border-radius:var(--radius-control);
  color:var(--text-tertiary);
}
.rank.sel .rank-more{
  background:var(--fill-control);
  border:1px solid var(--stroke-control-strong);
  color:var(--text-primary);
}
html[data-has-panel="true"] .rank .nm{width:136px}
html[data-size="min"] .rank .nm{width:128px}

/* Fluent 2 Context Menu Flyout + Disabled Tooltip */
.ctx-menu{
  position:absolute;
  width:228px;
  padding:4px;
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-28);
  z-index:35;
  display:flex;flex-direction:column;gap:2px;
}
.ctx-item{
  min-height:32px;
  padding:4px 10px;
  border-radius:var(--radius-control);
  display:flex;align-items:center;gap:10px;
  font:var(--type-body);color:var(--text-primary);
  position:relative;
}
.ctx-item.hov{background:var(--fill-subtle-hover)}
.ctx-item .ctx-ic{flex:none;color:var(--text-secondary)}
.ctx-item .ctx-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-item .ctx-sub{font:var(--type-caption);color:var(--text-tertiary);white-space:nowrap;flex:none}
.ctx-item.disabled{color:var(--text-disabled)}
.ctx-item.disabled .ctx-ic{color:var(--text-disabled)}
.ctx-sep{height:1px;margin:3px 6px;background:var(--stroke-divider)}

.ctx-tooltip{
  position:absolute;
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-control);
  box-shadow:var(--shadow-16);
  padding:5px 9px;
  font:var(--type-caption);color:var(--text-secondary);
  white-space:normal;max-width:216px;overflow-wrap:anywhere;align-items:flex-start !important;
  z-index:38;
  display:inline-flex;align-items:center;gap:5px;
}
.ctx-tooltip svg{color:var(--text-tertiary);flex:none}

/* ===========================
   Right-hand 360px Panel (shared V1/V2/V3/V5 architecture)
   =========================== */
.panel-scrim{
  display:none;
  position:absolute;inset:0;
  background:color-mix(in srgb,var(--fill-smoke) 42%,transparent);
  z-index:15;
}
.details{
  width:var(--w-details);flex:none;
  border-left:1px solid var(--stroke-divider);
  padding:0;gap:0;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:transparent;
}
html[data-size="min"][data-panel-open="true"] .panel-scrim{display:block}
html[data-size="min"] .details{
  position:absolute;top:0;right:0;bottom:0;
  width:360px;max-width:calc(100% - 16px);
  background:linear-gradient(var(--fill-layer),var(--fill-layer)),var(--bg-base);
  border-left:1px solid var(--stroke-divider);
  box-shadow:var(--shadow-28);
  z-index:20;
}

.ed-head{
  flex:none;
  padding:10px var(--space-l);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:flex-start;gap:var(--space-s);
}
.ed-head-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ed-head-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.ed-body-wrap{position:relative;flex:1;min-height:0;display:flex}
.ed-body{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:8px var(--space-l);
  display:flex;flex-direction:column;gap:6px;
}

/* Strictly single-row pinned panel footer (V2/V3 rule — NEVER wraps) */
.ed-foot{
  flex:none;
  padding:8px var(--space-l);
  border-top:1px solid var(--stroke-divider);
  display:flex;align-items:center;flex-wrap:nowrap;gap:6px;
}
.ed-foot-main{
  flex:1;min-width:0;
  display:flex;align-items:center;flex-wrap:nowrap;gap:6px;
}
.ed-foot-main .btn{
  padding:4px 9px;
  min-width:0;max-width:100%;
  overflow:hidden;
}
.ed-foot-main .btn.primary-slot{flex:0 1 auto}
.ed-foot-main .btn:not(.primary-slot){flex:0 0 auto}
.ed-foot-main .btn.flex-shrink{flex:0 1 auto}
.ed-foot-main .btn.icon{flex:0 0 auto;padding:0}
.ed-foot-main .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-foot-right{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:6px}

/* ===========================
   Explain Sidebar Components
   =========================== */
.res-card{
  padding:7px 10px;
  border-radius:var(--radius-overlay);
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:4px;
}
.res-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.res-cat-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.res-time{font:var(--type-body-strong);color:var(--text-primary);white-space:nowrap}
.res-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:var(--type-caption);color:var(--text-secondary)}

/* Annotation precedence callout */
.anno-callout{
  padding:5px 8px;
  border-radius:var(--radius-control);
  border:1px solid color-mix(in srgb,var(--accent-fill) 32%,transparent);
  background:color-mix(in srgb,var(--accent-fill) 8%,var(--fill-card));
  display:flex;flex-direction:column;gap:2px;
}
.anno-callout-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.anno-callout-top svg{color:var(--accent-text);flex:none}
.anno-callout-desc{font:var(--type-caption);font-size:11.5px;line-height:15px;color:var(--text-secondary);overflow-wrap:anywhere}

/* Historical privacy attribution box */
.priv-attr{
  padding:5px 8px;
  border-radius:var(--radius-control);
  border:1px solid color-mix(in srgb,var(--status-caution) 30%,transparent);
  background:var(--status-caution-bg);
  display:flex;align-items:flex-start;gap:6px;
  font:var(--type-caption);font-size:11.5px;line-height:15px;color:var(--text-primary);
}
.priv-attr.neutral{
  border-color:var(--stroke-card);
  background:var(--fill-card-secondary);
  color:var(--text-secondary);
}
.priv-attr svg{flex:none;margin-top:1px;color:var(--status-caution)}
.priv-attr.neutral svg{color:var(--text-tertiary)}
.priv-attr-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;overflow-wrap:anywhere}

/* Extraction provenance card */
.stage-card{
  padding:6px 9px;
  border-radius:var(--radius-overlay);
  background:var(--fill-card);
  border:1px solid var(--stroke-card);
  display:flex;flex-direction:column;gap:4px;
}
.stage-hdr{
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
}
.stage-hdr-l{display:flex;align-items:center;gap:6px;min-width:0}
.stage-num{
  width:18px;height:18px;border-radius:50%;flex:none;
  background:var(--fill-subtle-hover);
  font:var(--type-caption);font-weight:600;color:var(--text-secondary);
  display:grid;place-items:center;
}
.kv-chips{display:flex;flex-wrap:wrap;gap:4px}
.kv-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 6px;max-width:100%;
  border-radius:var(--radius-control);
  background:var(--fill-card-secondary);
  border:1px solid var(--stroke-card);
  font-family:var(--font-mono);font-size:11px;line-height:15px;
  color:var(--text-primary);
  overflow-wrap:anywhere;
}
.kv-chip .k{color:var(--text-tertiary)}
.kv-chip.missing{color:var(--text-tertiary);border-style:dashed;background:transparent}
.kv-chip.hidden{color:var(--status-caution);background:var(--status-caution-bg);border-color:color-mix(in srgb,var(--status-caution) 28%,transparent)}

/* Explain tree controls & nodes */
.tree-controls{
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
  padding:4px 0;
}
.tree-controls-btns{display:flex;align-items:center;gap:4px;flex-wrap:wrap}

.set-group{
  display:flex;flex-direction:column;gap:3px;
}
.set-hdr{
  display:flex;align-items:center;gap:5px;min-width:0;
  padding:2px 4px;border-radius:var(--radius-control);
}
.set-hdr .set-name{font:var(--type-caption);font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-hdr .set-key{font-family:var(--font-mono);font-size:11px;line-height:14px;color:var(--text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rule-node{
  margin-left:8px;
  padding:5px 7px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;gap:3px;
  position:relative;
}
.rule-node.winner{
  background:var(--fill-card);
  border-color:color-mix(in srgb,var(--status-success) 38%,transparent);
  border-left:3px solid var(--status-success);
  padding-left:6px;
}
.rule-node.winner-overridden{
  background:var(--fill-card);
  border-color:color-mix(in srgb,var(--accent-fill) 36%,transparent);
  border-left:3px solid var(--accent-fill);
  padding-left:6px;
}
.rule-node.collapsed{
  padding:3px 6px;
  background:transparent;
  border:1px solid var(--stroke-divider);
}
.rule-hdr{display:flex;align-items:flex-start;gap:4px;min-width:0}
.rule-hdr .r-ico{flex:none;margin-top:1px}
.rule-hdr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:0}
.rule-title-line{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.rule-title-line .r-name{font:var(--type-caption);font-weight:600;color:var(--text-primary);overflow-wrap:anywhere}
.rule-reason{font:var(--type-caption);font-size:11px;line-height:14px;color:var(--text-tertiary);overflow-wrap:anywhere}

.cond-tree{
  border-left:1px solid var(--stroke-divider);
  margin-left:6px;padding-left:8px;
  display:flex;flex-direction:column;gap:2px;
}
.cond-item{display:flex;flex-direction:column;gap:0;min-width:0}
.cond-expr{
  display:flex;align-items:flex-start;gap:4px;
  font-family:var(--font-mono);font-size:11px;line-height:14px;
  color:var(--text-primary);overflow-wrap:anywhere;
}
.cond-mark{flex:none;font-weight:700;width:11px;text-align:center}
.cond-mark.ok{color:var(--status-success)}
.cond-mark.no{color:var(--text-tertiary)}
.cond-actual{
  padding-left:15px;
  font:var(--type-caption);font-size:11px;line-height:14px;
  color:var(--text-secondary);overflow-wrap:anywhere;
}
.cond-actual .val-missing{
  display:inline-flex;align-items:center;padding:0 4px;border-radius:3px;
  background:var(--fill-subtle-hover);color:var(--text-secondary);
  font-family:var(--font-small);
}
.cond-actual .val-hidden{
  display:inline-flex;align-items:center;padding:0 4px;border-radius:3px;
  background:var(--status-caution-bg);color:var(--status-caution);
  font-family:var(--font-small);font-weight:600;
}

/* Fragment list (explain-fragments) */
.frag-list{display:flex;flex-direction:column;gap:5px}
.frag-card{
  border-radius:var(--radius-overlay);
  border:1px solid var(--stroke-card);
  background:var(--fill-card);
  overflow:hidden;
}
.frag-card.expanded{
  border-color:color-mix(in srgb,var(--accent-fill) 42%,transparent);
}
.frag-hdr{
  padding:5px 8px;
  display:flex;align-items:flex-start;gap:5px;
  background:var(--fill-card-secondary);
}
.frag-card.expanded .frag-hdr{
  border-bottom:1px solid var(--stroke-divider);
  background:color-mix(in srgb,var(--accent-fill) 7%,var(--fill-card-secondary));
}
.frag-hdr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.frag-time-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.frag-time{font-family:var(--font-mono);font-size:11.5px;line-height:15px;font-weight:600;color:var(--text-primary)}
.frag-utc{
  display:inline-flex;align-items:center;height:16px;padding:0 5px;
  border-radius:var(--radius-control);
  background:var(--status-caution-bg);color:var(--status-caution);
  font-family:var(--font-mono);font-size:10.5px;line-height:14px;font-weight:600;
}
.frag-meta-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font:var(--type-caption);color:var(--text-secondary)}
.frag-body{
  padding:6px 8px;
  display:flex;flex-direction:column;gap:5px;
}

/* Paging footer inside explain-long */
.pager-box{
  padding:6px 9px;
  border-radius:var(--radius-control);
  border:1px dashed var(--stroke-control-strong);
  background:var(--fill-card-secondary);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  text-align:center;
}

/* ===========================
   InfoBars & Modals (Situation Dialog)
   =========================== */
.infobar{
  flex:none;
  padding:6px 10px;
  border-radius:var(--radius-control);
  border:1px solid var(--stroke-card);
  background:var(--fill-card-secondary);
  display:flex;align-items:flex-start;gap:var(--space-s);
  font:var(--type-caption);color:var(--text-secondary);
  overflow-wrap:anywhere;word-break:break-word;
}
.infobar .ib-ic{flex:none;margin-top:1px;color:var(--text-secondary)}
.infobar .ib-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.infobar .ib-title{font:var(--type-body-strong);color:var(--text-primary);font-size:13px;line-height:18px;overflow-wrap:anywhere}
.infobar.caution{
  background:var(--status-caution-bg);
  border-color:color-mix(in srgb,var(--status-caution) 28%,transparent);
  color:var(--text-primary);
}
.infobar.caution .ib-ic{color:var(--status-caution)}
.infobar.accent-info{
  background:color-mix(in srgb,var(--accent-fill) 8%,var(--fill-card));
  border-color:color-mix(in srgb,var(--accent-fill) 28%,transparent);
  color:var(--text-primary);
}
.infobar.accent-info .ib-ic{color:var(--accent-text)}

.modal-scrim{
  position:absolute;inset:0;
  background:var(--fill-smoke);
  z-index:40;
  display:flex;align-items:center;justify-content:center;
  padding:var(--space-l);
}
.modal-dlg{
  width:624px;max-width:100%;max-height:100%;
  background:var(--bg-flyout);
  border:1px solid var(--stroke-surface);
  border-radius:var(--radius-overlay);
  box-shadow:var(--shadow-64);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.modal-head{
  flex:none;
  padding:12px var(--space-xl);
  border-bottom:1px solid var(--stroke-divider);
  display:flex;align-items:center;gap:var(--space-s);
}
.modal-head-txt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-body-wrap{position:relative;flex:1;min-height:0;display:flex}
.modal-body{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:12px var(--space-xl);
  display:flex;flex-direction:column;gap:10px;
}
.modal-foot{
  flex:none;
  padding:10px var(--space-xl);
  border-top:1px solid var(--stroke-divider);
  background:var(--fill-card-secondary);
  display:flex;align-items:center;flex-wrap:nowrap;gap:var(--space-s);
}
.modal-foot-l{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden}
.modal-foot-r{flex:0 0 auto;display:flex;align-items:center;gap:var(--space-s);margin-left:auto}

html[data-size="min"] .modal-scrim{padding:var(--space-s)}
html[data-size="min"] .modal-head{padding:10px 14px}
html[data-size="min"] .modal-body{padding:10px 14px;gap:8px}
html[data-size="min"] .modal-foot{padding:8px 14px}
html[data-size="min"] .modal-foot-l .sit-meta-hide{display:none}

/* Editable situation text box */
.sit-editor{
  padding:8px 11px;
  border-radius:var(--radius-control);
  background:var(--bg-base);
  border:1px solid var(--stroke-control-strong);
  border-bottom:2px solid var(--accent-fill);
  font-family:var(--font-mono);font-size:11.5px;line-height:16px;
  color:var(--text-primary);
  display:flex;flex-direction:column;gap:1px;
  overflow-wrap:anywhere;
}

      main.innerHTML = renderTodayPage({ isDst: true, selBand: { left: 19.4, width: 28.6 } });
      renderExplainFragmentsPanel();
      break;
    case 'explain-long':
      main.innerHTML = renderTodayPage({ selBand: { left: 19.4, width: 8.2 } });
      renderExplainLongPanel();
      break;
    case 'situation':
      main.innerHTML = renderTodayPage({ selBand: { left: 78.8, width: 5.8 } });
      renderExplainPanel();
      renderSituationModal();
      break;
    case 'context-menu-ranking':
      main.innerHTML = renderTodayPage({ ctxRankingRow: 1 });
      break;
    case 'context-menu-timeline':
      main.innerHTML = renderTodayPage({ ctxTimelineBlock: true });
      break;
    case 'classify-from-today':
      main.innerHTML = renderTodayPage({ selBand: { left: 74.0, width: 4.6 } });
      renderClassifyFromTodayPanel();
      break;
    case 'privacy-from-today':
      main.innerHTML = renderPrivacyTabMain();
      renderPrivacyFromTodayPanel();
      break;
    default:
      main.innerHTML = renderTodayPage({ selBand: { left: 78.8, width: 5.8 } });
      renderExplainPanel();
  }
}

function syncScroll(scrollEl, wrapEl, thumbEl) {
  if (!scrollEl || !wrapEl || !thumbEl) return;
  const overflow = scrollEl.scrollHeight > scrollEl.clientHeight + 1;
  wrapEl.classList.toggle('scrollable', overflow);
  if (!overflow) return;
  const trackH = wrapEl.clientHeight - 8;
  const ratio = scrollEl.clientHeight / scrollEl.scrollHeight;
  const thumbH = Math.max(28, Math.round(trackH * ratio));
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const top = maxScroll > 0 ? Math.round((scrollEl.scrollTop / maxScroll) * (trackH - thumbH)) : 0;
  thumbEl.style.height = thumbH + 'px';
  thumbEl.style.top = top + 'px';
}

renderNav();

const mainWrapEl = document.getElementById('main-wrap');
const mainThumbEl = document.getElementById('main-thumb');
syncScroll(mainEl, mainWrapEl, mainThumbEl);
mainEl.addEventListener('scroll', () => syncScroll(mainEl, mainWrapEl, mainThumbEl));

if (edBody) {
  syncScroll(edBody, edBodyWrap, edThumb);
  edBody.addEventListener('scroll', () => syncScroll(edBody, edBodyWrap, edThumb));
}

const modalBody = document.getElementById('modal-body');
const modalBodyWrap = document.getElementById('modal-body-wrap');
const modalThumb = document.getElementById('modal-thumb');
if (modalBody) {
  if (stateKey === 'situation' && modalBody.scrollHeight > modalBody.clientHeight) {
    modalBody.scrollTop = modalBody.scrollHeight;
  }
  syncScroll(modalBody, modalBodyWrap, modalThumb);
  modalBody.addEventListener('scroll', () => syncScroll(modalBody, modalBodyWrap, modalThumb));
}
